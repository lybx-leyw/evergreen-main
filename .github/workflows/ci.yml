# Evergreen Base CI
#
# 三个维度：
#   1. subpackage-tests — core 6 个子模块的纯 Dart 测试（stub 隔离，无需 Flutter SDK 依赖）
#   2. flutter-tests    — 根 Flutter 测试（testWidgets + 集成）
#   3. build-apk        — 安卓 debug APK（Chaquopy Python 3.11 + 插件资产清单生成）
#   4. build-windows    — Windows 桌面 debug 构建（验证桌面端链路）
#
# 前置约定：
#   - 插件资产清单（assets/plugins_bundle + pubspec 资产块）由 tool/bundle_plugins.dart
#     生成，CI 每次构建前重新生成（该目录不入库，不能依赖 checkout 自带）。
#   - Chaquopy 的 buildPython 由 build.gradle.kts 读环境变量 CHAQUOPY_BUILD_PYTHON
#     （路径不存在会硬失败），CI 用 setup-python 3.11 并回填真实路径。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── 1. 子包测试 ───────────────────────────
  subpackage-tests:
    name: 子包测试 (core 6 子模块)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 子包 dart test（. / config / data / agent / theme / module）
        run: |
          set -euo pipefail
          for pkg in . config data agent theme module; do
            echo "===== lib/core/$pkg ====="
            (cd "lib/core/$pkg" && dart pub get && dart test)
          done

  # ─────────────────────────── 2. 根 Flutter 测试 ───────────────────────────
  flutter-tests:
    name: Flutter 测试 (根)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成插件资产清单（部分测试读取 assets/plugins_bundle）
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}
        run: |
          flutter pub get
          dart run tool/bundle_plugins.dart

      - name: flutter test
        run: flutter test

  # ─────────────────────────── 3. 安卓 APK ───────────────────────────
  build-apk:
    name: 构建安卓 APK (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      # Chaquopy 构建期需要本机 Python 3.11（编译 src/main/python + pip 装 wheel）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 定位 buildPython 真实路径
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: 接受 Android SDK licenses（缺失 NDK 时 AGP 自动下载）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('evg-base/android/**/*.gradle*', 'evg-base/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 生成插件资产清单 + pub get
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}
        run: |
          flutter pub get
          dart run tool/bundle_plugins.dart

      - name: 构建 APK (debug)
        run: flutter build apk --debug

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-base-debug-apk
          path: evg-base/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # ─────────────────────────── 4. Windows 桌面 ───────────────────────────
  build-windows:
    name: 构建 Windows 桌面 (debug)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get + 构建
        run: |
          flutter pub get
          flutter build windows --debug

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-base-windows-debug
          path: evg-base/build/windows/x64/runner/Debug/
          if-no-files-found: error
