# Evergreen Release 工作流
# 打 tag v* 或手动触发，构建双版（浙大专用版 + 通用版）× 双模式（debug + release）
# 的 APK + Windows 产物并发布 GitHub Release（每平台 4 个 artifact，共 8 个）
#
# 双版区分（同一仓库，构建期选择性装入）：
#   - 浙大专用版（zju）: profile=release_full + EVERGREEN_ZJU=true  → 内置浙大校园/教务/智云课堂模板与数据源
#   - 通用版（std）:     profile=release_std  + EVERGREEN_ZJU=false → 不含浙大内容，模板路由回退 v4，产物更小
# 模板路由由 tool/gen_template_registry.dart 按 profile 生成（未选中模板被 AOT tree-shaker 剔除）；
# 浙大数据源/内置模块注册由 lib/app_bootstrap.dart 的 kZjuEnabled 编译期开关控制。
#
# 双模式区分（同 edition，两套构建）：
#   - release: AOT + tree-shake，浙大代码被真正剔除，产物小、性能好 → 最终用户
#   - debug:   JIT，不 tree-shake，保留完整日志（logcat/stderr），体积大 → 开发者调试/复现问题
# 注：--dart-define 对两种模式均生效；debug 产物内浙大代码仍在包中但不注册、不运行。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 2.0.0-alpha.1)'
        required: true
        default: '2.0.0-alpha.1'

# 双版矩阵：edition 名 / build profile / EVERGREEN_ZJU 开关 / 产物后缀与展示名
jobs:
  # ─────────────────────────── 1. 安卓 APK ───────────────────────────
  build-apk:
    name: 构建 Android APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: zju, profile: release_full, zju: 'true',  label: 浙大专用版, mode: debug }
          - { edition: zju, profile: release_full, zju: 'true',  label: 浙大专用版, mode: release }
          - { edition: std, profile: release_std,  zju: 'false', label: 通用版,     mode: debug }
          - { edition: std, profile: release_std,  zju: 'false', label: 通用版,     mode: release }
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      # Chaquopy 构建期需要 Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 定位 buildPython 路径
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: 接受 Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            # media_kit mpv 预编译 jar（预下载步骤生成，避免每次从 GitHub releases 下载断流）
            ~/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-*/android/build
          key: gradle-${{ runner.os }}-${{ hashFiles('evg-base/android/**/*.gradle*', 'evg-base/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 预下载 Gradle 发行版 (避免 wrapper 下载断流)
        shell: bash
        run: |
          set -euo pipefail
          # Gradle wrapper 用 Java HttpURLConnection 下载发行版，CI 网络偶发
          # "Unexpected end of file from server"（Download.java:58）。
          # 此处用 curl（带重试）预下载、预解压并打 .ok 标记，
          # wrapper 检测到 dists/<name>/<hash>/<name>.ok 即认为已安装，不再走 Java 下载。
          # dists 子目录 hash = MD5(distributionUrl)，从 gradle-wrapper.properties 动态解析。
          WRAPPER_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          DIST_URL=$(grep '^distributionUrl' "$WRAPPER_PROP" | cut -d= -f2- | sed 's/\\:/:/g')
          echo "distributionUrl: $DIST_URL"
          ZIP_NAME=$(basename "$DIST_URL")               # gradle-8.14-bin.zip
          DIR_NAME="${ZIP_NAME%.zip}"                    # gradle-8.14-bin
          HASH=$(printf '%s' "$DIST_URL" | md5sum | awk '{print $1}')
          DIR="$HOME/.gradle/wrapper/dists/$DIR_NAME/$HASH"
          INSTALLED="$DIR/$DIR_NAME"
          mkdir -p "$DIR"
          for attempt in 1 2 3; do
            if [ -d "$INSTALLED" ] && [ -f "$DIR/$ZIP_NAME.ok" ] && [ -x "$INSTALLED/bin/gradle" ]; then
              echo "OK: Gradle 已就绪 (命中缓存, $DIR)"
              break
            fi
            echo "下载 $ZIP_NAME (第 $attempt/3 次): $DIST_URL"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$DIR/$ZIP_NAME" "$DIST_URL"
            unzip -q -o "$DIR/$ZIP_NAME" -d "$DIR"
            if [ -x "$INSTALLED/bin/gradle" ]; then
              touch "$DIR/$ZIP_NAME.ok"
              echo "OK: Gradle 预安装完成 ($DIR)"
              break
            fi
            echo "警告: 解压校验失败，删除重下"
            rm -rf "$DIR"
            mkdir -p "$DIR"
          done
          [ -x "$INSTALLED/bin/gradle" ] || { echo "::error::Gradle 预下载三次均失败"; exit 1; }
          "$INSTALLED/bin/gradle" --version | head -3

      - name: 生成模板注册表 (profile) + 插件/脚本资产 + pub get
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}/evg-base
        run: |
          flutter pub get
          dart run tool/gen_template_registry.dart --profile ${{ matrix.profile }}
          dart run tool/bundle_plugins.dart
          dart run tool/bundle_scripts.dart

      - name: 预下载 media_kit mpv 原生库 (避免 GitHub 下载断流)
        shell: bash
        run: |
          set -euo pipefail
          # media_kit_libs_android_video 的 build.gradle 在配置阶段会从 GitHub releases
          # 下载 4 个 ABI 的 libmpv jar（v1.1.7），CI 网络偶发 "Unexpected end of file from server"。
          # 此处提前用 curl（带重试）下载到插件期望的位置并做 md5 校验，
          # Gradle 配置阶段检测到文件已存在且 md5 匹配即跳过下载。
          BASE=$(ls -d "$HOME/.pub-cache/hosted/pub.dev/media_kit_libs_android_video-"* 2>/dev/null | head -1)
          if [ -z "$BASE" ]; then
            echo "::error::未找到 media_kit_libs_android_video 插件目录，请先 flutter pub get"
            exit 1
          fi
          DEST="$BASE/android/build/v1.1.7"
          mkdir -p "$DEST"
          # 以下 URL 与 md5 与插件 build.gradle (1.3.8) 硬编码完全一致
          declare -A JARS=(
            [default-arm64-v8a]="83df25b61193af8fa815e373143ac9af"
            [default-armeabi-v7a]="22e21526fefc0a2b8f17adbec9f57590"
            [default-x86_64]="6fa26bf0459b11f1c0b0dbc29e5b940d"
            [default-x86]="0d742b756dc9d1fcd84ea271d8b68f32"
          )
          for name in "${!JARS[@]}"; do
            want="${JARS[$name]}"
            file="$DEST/$name.jar"
            for attempt in 1 2 3; do
              if [ -f "$file" ] && [ "$(md5sum "$file" | awk '{print $1}')" = "$want" ]; then
                echo "OK: $name.jar 已就绪 (命中缓存)"
                break
              fi
              echo "下载 $name.jar (第 $attempt/3 次): .../releases/download/v1.1.7/$name.jar"
              curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$file" \
                "https://github.com/media-kit/libmpv-android-video-build/releases/download/v1.1.7/$name.jar"
              if [ "$(md5sum "$file" | awk '{print $1}')" = "$want" ]; then
                echo "OK: $name.jar 下载并校验通过"
                break
              fi
              echo "警告: $name.jar md5 校验失败，删除重下"
              rm -f "$file"
            done
            [ -f "$file" ] || { echo "::error::$name.jar 三次下载均失败"; exit 1; }
          done
          echo "media_kit mpv 原生库预下载完成 ($DEST)"

      - name: 构建 APK (${{ matrix.mode }}, ${{ matrix.label }})
        run: flutter build apk --${{ matrix.mode }} --dart-define=EVERGREEN_ZJU=${{ matrix.zju }}

      - name: 上传 APK artifact (${{ matrix.mode }}, ${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-${{ matrix.edition }}-android-${{ matrix.mode }}
          path: evg-base/build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          if-no-files-found: error

  # ─────────────────────────── 2. Windows 桌面 ───────────────────────────
  build-windows:
    name: 构建 Windows 安装包 (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: zju, profile: release_full, zju: 'true',  label: 浙大专用版, suffix: '-Zju', appName: 'Evergreen',       mode: debug,   modeName: Debug }
          - { edition: zju, profile: release_full, zju: 'true',  label: 浙大专用版, suffix: '-Zju', appName: 'Evergreen',       mode: release, modeName: Release }
          - { edition: std, profile: release_std,  zju: 'false', label: 通用版,     suffix: '-Std', appName: 'Evergreen Std',   mode: debug,   modeName: Debug }
          - { edition: std, profile: release_std,  zju: 'false', label: 通用版,     suffix: '-Std', appName: 'Evergreen Std',   mode: release, modeName: Release }
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成模板注册表 (profile) + 插件/脚本资产 + pub get
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}/evg-base
        run: |
          flutter pub get
          dart run tool/gen_template_registry.dart --profile ${{ matrix.profile }}
          dart run tool/bundle_plugins.dart
          dart run tool/bundle_scripts.dart

      - name: 构建 Windows (${{ matrix.mode }}, ${{ matrix.label }})
        run: flutter build windows --${{ matrix.mode }} --dart-define=EVERGREEN_ZJU=${{ matrix.zju }}

      - name: 下载嵌入 Python 并安装依赖
        shell: pwsh
        run: |
          $pyVer = "3.10.11"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          $dest = "build\greenix_dist\python"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\python-embed.zip"
          Expand-Archive -Path "$env:TEMP\python-embed.zip" -DestinationPath $dest -Force
          # embeddable 默认注释掉 import site → pip 无法工作，启用之
          # （文件名是 pythonNNN._pth，扩展名 _pth 而非 pth）
          Get-ChildItem $dest -Filter "*._pth" | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c = $c -replace "#import site", "import site"
            [IO.File]::WriteAllText($_.FullName, $c)
          }
          # embeddable 不带 pip，先经 get-pip.py 引导
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py"
          & "$dest\python.exe" "$env:TEMP\get-pip.py"
          & "$dest\python.exe" -m pip --version
          & "$dest\python.exe" -m pip install -r scripts\requirements.txt

      - name: 构建 Inno Setup 安装包 (${{ matrix.label }})
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc scripts\installer.iss "/DMyAppName=${{ matrix.appName }}" "/DMyAppSuffix=${{ matrix.suffix }}" "/DMyBuildMode=${{ matrix.modeName }}"

      - name: 上传 Windows 安装包 (${{ matrix.mode }}, ${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-${{ matrix.edition }}-windows-${{ matrix.mode }}
          path: evg-base/build/installer/EvergreenSetup*.exe
          if-no-files-found: error

  # ─────────────────────────── 3. 创建 Release ───────────────────────────
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成 Release Notes
        id: notes
        run: |
          echo '## 版本说明' > release-notes.md
          echo '' >> release-notes.md
          echo '- **浙大专用版**（EvergreenSetup-Zju-*.exe / evergreen-zju-*）: 内置浙大校园、教务、智云课堂等模板与数据源，面向浙大学生' >> release-notes.md
          echo '- **通用版**（EvergreenSetup-Std-*.exe / evergreen-std-*）: 不含浙大内容，模板回退 v4，产物更小，面向一般用户' >> release-notes.md
          echo '' >> release-notes.md
          echo '**构建模式**（每个版本同时发布 debug / release 两套）：' >> release-notes.md
          echo '- **release**: AOT 编译 + tree-shake（浙大代码被真正剔除），产物小、性能好，日常使用请安装此版' >> release-notes.md
          echo '- **debug**: JIT 编译、保留完整日志（logcat/stderr 可见），体积大，用于开发者调试/复现问题' >> release-notes.md
          echo '' >> release-notes.md
          echo '## 变更' >> release-notes.md
          echo '' >> release-notes.md
          # 提取 tag 之后的所有提交
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "首个正式发布" >> release-notes.md
          else
            echo "**${PREV_TAG} → ${GITHUB_REF_NAME}**" >> release-notes.md
            echo '' >> release-notes.md
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" >> release-notes.md
          fi
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Evergreen ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_notes }}
          files: |
            artifacts/evergreen-zju-android-debug/app-debug.apk
            artifacts/evergreen-zju-android-release/app-release.apk
            artifacts/evergreen-std-android-debug/app-debug.apk
            artifacts/evergreen-std-android-release/app-release.apk
            artifacts/evergreen-zju-windows-debug/EvergreenSetup*.exe
            artifacts/evergreen-zju-windows-release/EvergreenSetup*.exe
            artifacts/evergreen-std-windows-debug/EvergreenSetup*.exe
            artifacts/evergreen-std-windows-release/EvergreenSetup*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
