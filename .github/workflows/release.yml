# Evergreen Release 工作流
# 打 tag v* 或手动触发，构建 APK + Windows 产物并发布 GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 2.0.0-alpha.1)'
        required: true
        default: '2.0.0-alpha.1'

jobs:
  # ─────────────────────────── 1. 安卓 APK ───────────────────────────
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      # Chaquopy 构建期需要 Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 定位 buildPython 路径
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: 接受 Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('evg-base/android/**/*.gradle*', 'evg-base/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 生成插件 + 脚本资产清单 + pub get
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}/evg-base
        run: |
          flutter pub get
          dart run tool/bundle_plugins.dart
          dart run tool/bundle_scripts.dart

      - name: 构建 APK (debug)
        run: flutter build apk --debug

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-android-debug
          path: evg-base/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # ─────────────────────────── 2. Windows 桌面 ───────────────────────────
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    defaults:
      run:
        working-directory: evg-base
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成插件 + 脚本资产清单 + pub get
        env:
          EVERGREEN_WORKSPACE: ${{ github.workspace }}/evg-base
        run: |
          flutter pub get
          dart run tool/bundle_plugins.dart
          dart run tool/bundle_scripts.dart

      - name: 构建 Windows (Release)
        run: flutter build windows --release

      - name: 下载嵌入 Python 并安装依赖
        shell: pwsh
        run: |
          $pyVer = "3.10.11"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          $dest = "build\greenix_dist\python"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\python-embed.zip"
          Expand-Archive -Path "$env:TEMP\python-embed.zip" -DestinationPath $dest -Force
          # embeddable 默认注释掉 import site → pip 无法工作，启用之
          # （PowerShell -replace 的 ^ 默认非 multiline，不能带行首锚点）
          Get-ChildItem $dest -Filter "*.pth" | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c = $c -replace "#import site", "import site"
            [IO.File]::WriteAllText($_.FullName, $c)
          }
          # embeddable 不带 pip，先经 get-pip.py 引导
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py"
          & "$dest\python.exe" "$env:TEMP\get-pip.py"
          & "$dest\python.exe" -m pip --version
          & "$dest\python.exe" -m pip install -r scripts\requirements.txt

      - name: 构建 Inno Setup 安装包
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc scripts\installer.iss

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-windows-setup
          path: evg-base/build/installer/EvergreenSetup-*.exe
          if-no-files-found: error

  # ─────────────────────────── 3. 创建 Release ───────────────────────────
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成 Release Notes
        id: notes
        run: |
          echo '## 变更' > release-notes.md
          echo '' >> release-notes.md
          # 提取 tag 之后的所有提交
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "首个正式发布" >> release-notes.md
          else
            echo "**${PREV_TAG} → ${GITHUB_REF_NAME}**" >> release-notes.md
            echo '' >> release-notes.md
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" >> release-notes.md
          fi
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Evergreen ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.release_notes }}
          files: |
            artifacts/evergreen-android-debug/app-debug.apk
            artifacts/evergreen-windows-setup/*.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
