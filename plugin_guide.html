<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen 插件开发指南 · 互动版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ffffff; --bg-card: #f8fafc; --text: #1a1a2e; --text-secondary: #3d3d5c;
            --border: #e2e8f0; --accent: #0f7b6e; --accent-light: #1a9c8a;
            --accent-glow: rgba(15, 123, 110, 0.12); --accent-border: rgba(15, 123, 110, 0.25);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.06); --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            --font-serif: 'Georgia', 'Times New Roman', serif; --max-width: 920px;
        }
        [data-theme="dark"] {
            --bg: #0f0f1a; --bg-card: #1a1a2e; --text: #e8e8f0; --text-secondary: #b0b0c8;
            --border: #2d2d44; --accent: #2eccb0; --accent-light: #45d9c0;
            --accent-glow: rgba(46, 204, 176, 0.15); --accent-border: rgba(46, 204, 176, 0.30);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        body {
            font-family: var(--font-sans); background: var(--bg); color: var(--text);
            line-height: 1.7; transition: background var(--transition), color var(--transition);
            padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
        }
        .app { width: 100%; max-width: var(--max-width); margin: 0 auto; padding: 30px 0 60px; }
        .header {
            display: flex; justify-content: space-between; align-items: center; padding-bottom: 24px;
            border-bottom: 2px solid var(--border); margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
        }
        .header-title { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
        .header-title span { color: var(--accent); }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .btn-theme {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; padding: 8px 16px;
            font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 6px;
        }
        .btn-theme:hover { border-color: var(--accent); color: var(--text); background: var(--accent-glow); }
        .step-counter {
            font-size: 0.9rem; color: var(--text-secondary); background: var(--bg-card); padding: 4px 14px;
            border-radius: 30px; border: 1px solid var(--border); font-variant-numeric: tabular-nums;
        }
        .card {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 40px 44px; transition: background var(--transition), border var(--transition), box-shadow var(--transition);
            margin-bottom: 28px; min-height: 360px; position: relative;
        }
        .card::before {
            content: ''; position: absolute; top: -1px; left: 10%; width: 80%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-light), transparent);
            border-radius: 0 0 4px 4px; opacity: 0.6;
        }
        .step-content { animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
        .step-content h1, .step-content h2, .step-content h3 {
            font-family: var(--font-serif); font-weight: 700; letter-spacing: -0.01em;
            margin-top: 0; margin-bottom: 0.6em; color: var(--text);
        }
        .step-content h1 { font-size: 1.9rem; border-left: 4px solid var(--accent); padding-left: 18px; }
        .step-content h2 { font-size: 1.45rem; margin-top: 1.2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
        .step-content h3 { font-size: 1.12rem; margin-top: 1em; color: var(--accent-light); }
        .step-content p { margin-bottom: 1em; color: var(--text-secondary); }
        .step-content ul, .step-content ol { margin: 0.8em 0 1.2em 1.5em; color: var(--text-secondary); }
        .step-content li { margin-bottom: 0.4em; }
        .step-content code {
            background: var(--bg); padding: 0.2em 0.5em; border-radius: 6px; font-size: 0.88em;
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace; border: 1px solid var(--border); color: var(--accent);
        }
        .step-content pre {
            background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px;
            overflow-x: auto; font-size: 0.85rem; line-height: 1.5; font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            color: var(--text); margin: 1.2em 0;
        }
        .step-content pre code { background: transparent; border: none; padding: 0; color: inherit; }
        .step-content table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 0.92rem; }
        .step-content th, .step-content td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .step-content th { background: var(--bg); font-weight: 600; color: var(--text); }
        .step-content td { color: var(--text-secondary); }
        .step-content blockquote {
            border-left: 4px solid var(--accent); background: var(--bg); padding: 12px 20px;
            margin: 1.2em 0; border-radius: 0 8px 8px 0; color: var(--text-secondary);
        }
        .step-content blockquote strong { color: var(--text); }
        .step-content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
        .highlight-box {
            background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 10px;
            padding: 16px 22px; margin: 1.2em 0; color: var(--text-secondary);
        }
        .highlight-box strong { color: var(--accent); }
        .nav-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
        .nav-btn {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 30px; padding: 10px 28px;
            font-size: 0.95rem; font-weight: 500; color: var(--text); cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .nav-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-1px); box-shadow: var(--shadow); }
        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
        .nav-btn .arrow { font-size: 1.2rem; line-height: 1; }
        .nav-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .nav-btn-primary:hover:not(:disabled) { background: var(--accent-light); border-color: var(--accent-light); color: #fff; }
        .nav-dots { display: flex; gap: 8px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: var(--transition); cursor: pointer; }
        .dot.active { background: var(--accent); transform: scale(1.25); box-shadow: 0 0 12px var(--accent-glow); }
        .dot:hover:not(.active) { background: var(--text-secondary); }
        @media (max-width: 640px) {
            .card { padding: 24px 20px; }
            .header-title { font-size: 1.3rem; }
            .step-content h1 { font-size: 1.5rem; padding-left: 12px; }
            .step-content h2 { font-size: 1.2rem; }
            .nav-footer { flex-direction: column; align-items: stretch; }
            .nav-btn { justify-content: center; }
            .nav-dots { justify-content: center; order: -1; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="header">
            <div class="header-title">📘 插件开发指南 <span>· 互动版</span></div>
            <div class="header-controls">
                <span class="step-counter" id="stepCounter">1 / 10</span>
                <button class="btn-theme" id="themeToggle" aria-label="切换主题">
                    <span id="themeIcon">🌙</span> <span id="themeLabel">深色</span>
                </button>
            </div>
        </header>
        <div class="card" id="card">
            <div class="step-content" id="stepContent"></div>
        </div>
        <div class="nav-footer">
            <button class="nav-btn" id="prevBtn" disabled><span class="arrow">←</span> 上一步</button>
            <div class="nav-dots" id="dotsContainer"></div>
            <button class="nav-btn nav-btn-primary" id="nextBtn">下一步 <span class="arrow">→</span></button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const STEPS = [
                {
                    title: '前言 · 认识 Evergreen 插件',
                    content: `
                        <h1>Evergreen 插件开发指南</h1>
                        <p><strong>适用版本：</strong>v2.0（beta 之后的代码基线）<br>
                        <strong>面向读者：</strong>不熟悉编程、但想给 Evergreen 加一个插件的同学；也欢迎懂编程的同学直接跳到 Dart 插件章节。</p>
                        <blockquote>本指南讲「怎么开发插件」，不要求改 Evergreen 的框架源码。所有路径都从<strong>一个文件夹 + 一个 manifest.json</strong>出发。</blockquote>
                        <h2>先看懂三句话</h2>
                        <p>Evergreen 是一个<strong>本地优先、AI 原生</strong>的桌面/移动微工具平台，所有功能都由<strong>插件（plugin）</strong>提供。插件就住在仓库的：</p>
                        <pre>evg-base/plugins/&lt;你的插件id&gt;/
    └── module/
        └── manifest.json     ← 插件的「身份证」</pre>
                        <p>平台启动时会自动扫描 <code>plugins/</code> 下的每个子目录，读到 <code>module/manifest.json</code>，就知道「有这个插件、它叫什么、长什么样、点开去哪里」。</p>
                        <div class="highlight-box">
                            <strong>💡 当前最重要的事实：</strong> 用户侧插件创作已切换为 <strong>HTML 为主</strong>。你写 HTML / CSS / JS，平台内置的
                            <strong>「HTML 插件创作中心」（html-creator）</strong>帮你实时预览、AI 辅助生成、一键导出。
                        </div>
                        <h2>两条创作路径</h2>
                        <table>
                            <thead><tr><th>路径</th><th>你写什么</th><th>定位</th><th>适合谁</th></tr></thead>
                            <tbody>
                                <tr><td><strong>路径一：HTML 插件</strong></td><td>网页（.html/.css/.js）+ manifest</td><td><strong>用户侧主路径</strong>，普通用户入口</td><td>会一点网页 / 想快速做工具 / 完全不会编程但想用 AI 生成</td></tr>
                                <tr><td><strong>路径二：Dart 插件</strong></td><td>Dart/JSON 声明（+ 可选 .exe）</td><td><strong>开发者模式 / 高级能力</strong></td><td>懂编程、要极致性能、要写后端进程</td></tr>
                            </tbody>
                        </table>
                        <p>两条路径<strong>共享同一套「插件目录 + manifest 声明 + 数据中枢」机制</strong>，差别只在「界面由谁画」。数据、设置、AI 能力两条路都能用。</p>
                    `
                },
                {
                    title: '插件的家：目录结构与六维模型',
                    content: `
                        <h1>一个插件的目录长什么样</h1>
                        <p>无论哪条路径，你的插件都是一个文件夹。Evergreen 采用「<strong>六维插件模型</strong>」——一个插件目录可以同时装下面 6 种子目录，互不冲突，平台按子目录自动发现：</p>
                        <table>
                            <thead><tr><th>子目录</th><th>里面放</th><th>被谁加载</th><th>作用</th></tr></thead>
                            <tbody>
                                <tr><td><code>module/</code></td><td><code>manifest.json</code>（HTML 插件还要 <code>index.html</code>）</td><td>ModuleLoader → ModuleRegistry</td><td>一个「页面/模块」，最重要</td></tr>
                                <tr><td><code>agent/</code></td><td><code>manifest.json</code> + <code>.exe</code></td><td>PluginBridge → toolRegistry</td><td>给 AI 加一个可调用的工具</td></tr>
                                <tr><td><code>data/</code></td><td><code>manifest.json</code> + <code>.exe</code></td><td>DataSourceLoader → DataOrchestrator</td><td>自带一个数据源</td></tr>
                                <tr><td><code>config/</code></td><td><code>config.json</code></td><td>SettingsLoader → SharedPreferences</td><td>声明设置项</td></tr>
                                <tr><td><code>theme/</code></td><td><code>theme.json</code></td><td>ThemeLoader → ThemeStore</td><td>一套主题配色</td></tr>
                                <tr><td><code>skill/</code></td><td><code>*.md</code></td><td>SkillLoader → SkillIndex</td><td>给 AI 的技能包</td></tr>
                            </tbody>
                        </table>
                        <div class="highlight-box">
                            <strong>⚠️ 身份证规则：</strong> 正式 id 是 manifest 里的 <code>"id"</code> 字段。强烈建议让<strong>文件夹名与 id 一致</strong>（如文件夹 <code>my-tool</code>，id 也用 <code>"my-tool"</code>）。id 一旦定下别乱改，改了等于换新插件。
                        </div>
                        <h2>平台怎么发现你的插件</h2>
                        <p>扫描规则来自 <code>evg-base/lib/core/module/module_loader.dart</code>：</p>
                        <ul>
                            <li>只认 <code>plugins/&lt;id&gt;/module/manifest.json</code> 这个文件。</li>
                            <li>manifest 里 <code>"type"</code> 必须是 <code>"module"</code>，否则被忽略。</li>
                            <li>解析失败只在日志里警告，<strong>不会</strong>让整个程序崩溃——写错了能安全重试。</li>
                            <li>未知字段一律<strong>静默忽略</strong>（容错设计，不是 bug）。</li>
                        </ul>
                        <h2>Windows 下绝对路径示例</h2>
                        <p>仓库副本在 <code>d:\\evg-workplace\\</code> 时，你的插件最终落在：</p>
                        <pre>d:\\evg-workplace\\evg-base\\plugins\\my-tool\\module\\manifest.json
d:\\evg-workplace\\evg-base\\plugins\\my-tool\\module\\index.html  ← 仅 HTML 插件需要</pre>
                    `
                },
                {
                    title: '开发者模式 & AI 插件创作中心',
                    content: `
                        <h1>项目有「开发者模式」，里面就是 AI 插件创作中心</h1>
                        <p>Evergreen 有 <strong>三种视图模式</strong>（左栏顶部视图图标 → 扇形菜单切换，已持久化记忆）：</p>
                        <table>
                            <thead><tr><th>模式</th><th>枚举</th><th>主区</th><th>说明</th></tr></thead>
                            <tbody>
                                <tr><td>AI 视图</td><td><code>AppMode.ai</code></td><td>AI 助手</td><td>默认模式</td></tr>
                                <tr><td><strong>开发者模式</strong></td><td><code>AppMode.developer</code></td><td><code>/dev-hub</code></td><td>创作中心聚集地</td></tr>
                                <tr><td>插件视图</td><td><code>AppMode.plugins</code></td><td>全部插件侧栏</td><td>浏览/使用所有插件</td></tr>
                            </tbody>
                        </table>
                        <div class="highlight-box">
                            <strong>🔧 开发者模式（/dev-hub）里有 5 个创作中心</strong>（顺序即索引，见 <code>app_mode.dart</code> 的 <code>kDevPluginIds</code>）：<br>
                            主题创作（theme-creator）· <strong>插件制作（html-creator）</strong> · 数据爬取（scraper） · DSH · Skill 创作（skill-creator）<br>
                            深链可直接进入：<code>/dev-hub?plugin=html-creator</code>
                        </div>
                        <h2>AI 插件创作中心 = html-creator</h2>
                        <p><code>html-creator</code> 本身也是一个插件（id：<code>html-creator</code>，<code>template: "html"</code>，路由 <code>/html-creator</code>）。它是<strong>三栏 IDE</strong>：</p>
                        <ul>
                            <li><strong>左栏 · 数据中枢</strong>：浏览所有已注册数据源，把数据接进你的插件。</li>
                            <li><strong>中栏 · 编辑器</strong>：写 HTML / CSS / JS（可拖拽分栏、窄屏自动变 Tab）。</li>
                            <li><strong>右栏 · 实时预览</strong>：WebView 即时渲染，主题色自动注入。</li>
                            <li><strong>AI 面板</strong>：用自然语言让 AI 生成 / 改稿整个插件。</li>
                            <li><strong>一键导出</strong>：把工程写成 <code>plugins/&lt;id&gt;/module/index.html + manifest.json</code>，同时同步到内置资产目录（<code>assets/plugins_bundle/</code>）。</li>
                        </ul>
                        <div class="highlight-box">
                            <strong>✅ 对新手最重要的结论：</strong> 想加插件 → 切到 <strong>开发者模式 → 插件制作（html-creator）</strong> → 写网页或让 AI 生成 → 导出，完事。根本不需要懂 Dart。
                        </div>
                        <p>创作中心的导出逻辑见 <code>evg-base/lib/renderer/templates/v4_modle/components/creative/html-creator/services/html_export_service.dart</code>，它把插件同时写到两个目标：运行期目录 <code>{pluginsDir}/{id}/module/</code> 与内置资产目录 <code>{assetsBundleDir}/{id}/module/</code>。</p>
                    `
                },
                {
                    title: '路径一：HTML 插件（主路径）',
                    content: `
                        <h1>路径一：HTML 插件 = 一个网页 + 一个 manifest</h1>
                        <p>这是当前用户侧主路径。你的插件界面就是一个<strong>普通网页</strong>，平台用内置 WebView 显示，并注入 <code>platform.*</code> 接口读数据、调 AI、读设置。</p>
                        <h2>步骤一：写 manifest（关键字段 template:"html"）</h2>
                        <pre>{
  "schemaVersion": "2.0",
  "type": "module",          ← 必须
  "id": "my-first-tool",     ← 全局唯一，建议与文件夹同名
  "name": "我的数据面板",
  "template": "html",        ← 关键：告诉平台「用网页画我」
  "version": "1.0.0",
  "route": "/my-first-tool", ← 以 / 开头，全局唯一
  "nav": {
    "sidebar": { "section": "自定义", "order": 99 }
  }
}</pre>
                        <p>这个文件放在 <code>plugins/my-first-tool/module/manifest.json</code>。</p>
                        <h2>步骤二：写 index.html</h2>
                        <p>在 <code>module/</code> 里放 <code>index.html</code>（即 <code>module/index.html</code>）。完整网页，任意前端写法：</p>
                        <pre>&lt;!DOCTYPE html&gt;
&lt;html lang="zh-CN"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;我的面板&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;你好，Evergreen&lt;/h1&gt;
  &lt;button onclick="loadData()"&gt;加载数据&lt;/button&gt;
  &lt;pre id="out"&gt;&lt;/pre&gt;
  &lt;script&gt;
    async function loadData() {
      const d = await platform.data.get('my_source');
      document.getElementById('out').textContent = JSON.stringify(d, null, 2);
    }
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>
                        <h2>步骤三：用 platform.* 借平台能力</h2>
                        <p>平台在网页加载时自动注入全局对象 <strong><code>platform</code></strong>（来自 <code>html_modle/bridge_script.dart</code>，Windows 与 Android 同一套 bridge）。</p>
                        <div class="highlight-box">
                            <strong>最关键的一行：</strong> <code>const data = await platform.data.get('数据源名字');</code>
                        </div>
                        <p>主题色会自动注入为 CSS 变量 <code>--evg-*</code>（<code>--evg-background</code>、<code>--evg-text</code>、<code>--evg-accent</code> 等），你在 CSS 里直接用，主题切换时实时更新。</p>
                    `
                },
                {
                    title: 'HTML 插件 JS 桥接 API 速查',
                    content: `
                        <h1>platform.* 速查表</h1>
                        <p>网页里可用的 <code>platform</code> 对象，统一兼容 Windows（webview_windows）与 Android（webview_flutter），不用管底层差异。</p>
                        <h2>读数据 platform.data</h2>
                        <table>
                            <thead><tr><th>方法</th><th>作用</th><th>示例</th></tr></thead>
                            <tbody>
                                <tr><td><code>data.get(name)</code></td><td>拉取数据源（优先缓存）</td><td><code>await platform.data.get('my_source')</code></td></tr>
                                <tr><td><code>data.list()</code></td><td>列出所有已注册数据源</td><td><code>await platform.data.list()</code></td></tr>

            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (currentStep < totalSteps - 1) goToStep(currentStep + 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (currentStep > 0) goToStep(currentStep - 1);
                }
            });

            let isDark = false;

            function setTheme(dark) {
                isDark = dark;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                themeIcon.textContent = dark ? '☀️' : '🌙';
                themeLabel.textContent = dark ? '浅色' : '深色';
                localStorage.setItem('plugin-guide-theme', dark ? 'dark' : 'light');
            }

            themeToggle.addEventListener('click', function() {
                setTheme(!isDark);
            });

            const savedTheme = localStorage.getItem('plugin-guide-theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark);
            }

            buildDots();
            renderStep(currentStep);
        })();
    </script>
</body>
</html>
