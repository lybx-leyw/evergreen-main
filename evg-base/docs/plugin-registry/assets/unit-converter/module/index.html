<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>单位换算</title><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* ── 主题变量 ──
   --evg-* 由 Evergreen bridge 注入（<html> 内联样式），明暗主题实时切换。
   红线：本页不在 :root 重定义 --evg-*，只定义本地别名并带兜底值。 */
:root {
  --bg: var(--evg-background, #f1f4f7);
  --card: var(--evg-surface, #ffffff);
  --ink: var(--evg-text, #25303e);
  --ink-soft: var(--evg-text-secondary, #64748b);
  --accent: var(--evg-accent, #3d6fd0);
  --accent-bg: var(--evg-accent-bg, #e6ecfb);
  --accent-border: var(--evg-accent-border, #c3d2f4);
  --line: var(--evg-border, rgba(37, 48, 62, .09));
  --err: var(--evg-error, #d64545);
  --btn-ink: #ffffff;
}
html { font-size: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.topbar { display: flex; align-items: center; gap: .75rem; padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--card) 72%, transparent); backdrop-filter: blur(.875rem); -webkit-backdrop-filter: blur(.875rem); position: sticky; top: 0; z-index: 5; }
.topbar .ico { font-size: 1.5rem; }
.topbar h1 { font-size: 1.15rem; font-weight: 700; }
.topbar .sub { font-size: .72rem; color: var(--ink-soft); }
.local-badge { margin-left: auto; flex-shrink: 0; font-size: .68rem; color: var(--ink-soft); background: color-mix(in srgb, var(--ink-soft) 10%, transparent); border: 1px solid var(--line); padding: .22rem .6rem; border-radius: 999px; white-space: nowrap; }
.container { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.card h2 { font-size: .95rem; font-weight: 700; margin-bottom: .9rem; display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.cats { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: 1rem; }
.cat { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); font-family: inherit; font-size: .83rem; font-weight: 600; padding: .5rem .95rem; border-radius: .7rem; cursor: pointer; }
.cat.active { color: var(--btn-ink); background: var(--accent); border-color: var(--accent); }
.cat:focus-visible, .swap:focus-visible, .common-item:focus-visible, .hist-item:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent-border); outline-offset: 2px; }
.converter { display: flex; flex-direction: column; gap: .8rem; }
.unit-row { display: flex; gap: .6rem; align-items: center; }
.unit-row .amt { flex: 1; padding: .75rem .85rem; border-radius: .8rem; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--ink); font-family: inherit; font-size: 1.2rem; font-weight: 600; min-width: 0; }
.unit-row .amt:focus { outline: 2px solid var(--accent-border); border-color: var(--accent-border); }
.unit-row select { padding: .65rem .7rem; border-radius: .7rem; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 55%, transparent); color: var(--ink); font-family: inherit; font-size: .9rem; min-width: 7.5rem; }
.unit-row select:focus { outline: 2px solid var(--accent-border); border-color: var(--accent-border); }
.swap { align-self: center; appearance: none; -webkit-appearance: none; border: 1px solid var(--accent-border); background: var(--accent-bg); color: var(--accent); font-family: inherit; font-size: 1.2rem; width: 2.6rem; height: 2.6rem; border-radius: 50%; cursor: pointer; transition: transform .2s ease; }
.swap:hover { transform: rotate(180deg); }
.result { text-align: center; font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; padding: .5rem 0; }
.result .sub { font-size: .82rem; color: var(--ink-soft); font-weight: 500; margin-top: .2rem; }
.common { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.common-item { appearance: none; -webkit-appearance: none; text-align: left; display: flex; flex-direction: column; gap: .2rem; background: color-mix(in srgb, var(--bg) 48%, transparent); border: 1px solid var(--line); border-radius: .7rem; padding: .6rem .75rem; font-size: .8rem; cursor: pointer; font-family: inherit; color: inherit; }
.common-item:hover { border-color: var(--accent-border); }
.common-item .q { color: var(--ink-soft); }
.common-item .a { font-weight: 700; color: var(--accent); }
.history { display: flex; flex-direction: column; gap: .45rem; }
.hist-item { appearance: none; -webkit-appearance: none; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: .6rem; background: color-mix(in srgb, var(--bg) 48%, transparent); border: 1px solid var(--line); border-radius: .7rem; padding: .55rem .75rem; font-size: .82rem; cursor: pointer; font-family: inherit; color: inherit; }
.hist-item:hover { border-color: var(--accent-border); }
.hist-item .q { font-weight: 600; }
.hist-item .t { color: var(--ink-soft); font-size: .7rem; flex-shrink: 0; }
.empty { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 1.1rem 0; }
.note { text-align: center; font-size: .72rem; color: var(--ink-soft); padding: .2rem 0 1.2rem; }
/* Toast（替代 console/alert：可见反馈统一走这里） */
#toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(.75rem); opacity: 0; pointer-events: none; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: .55rem 1.1rem; font-size: .85rem; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.16); transition: opacity .18s ease, transform .18s ease; z-index: 50; max-width: 86vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
/* 内联确认条（替代原生 confirm；Esc 取消） */
#confirm { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.24); z-index: 60; padding: 0 1rem 1.5rem; }
#confirm[hidden] { display: none; }
.confirm-box { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.15rem; max-width: 26rem; width: 100%; box-shadow: 0 .75rem 2rem rgba(0,0,0,.22); }
.confirm-msg { font-size: .9rem; margin-bottom: .8rem; }
.confirm-ops { display: flex; gap: .5rem; justify-content: flex-end; }
.btn { appearance: none; -webkit-appearance: none; border: none; cursor: pointer; font-family: inherit; font-size: .8rem; font-weight: 600; padding: .4rem .85rem; border-radius: .7rem; color: var(--btn-ink); background: var(--accent); transition: transform .15s ease, opacity .15s ease; }
.btn:hover { transform: translateY(-1px); opacity: .92; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); }
.btn.sm { font-size: .75rem; padding: .3rem .7rem; }
@media (max-width: 40rem) {
  .container { padding: 1.1rem .9rem 2.4rem; }
  .topbar { padding: .9rem 1rem; }
  .common { grid-template-columns: 1fr; }
  .unit-row { flex-wrap: wrap; }
  .unit-row .amt { flex: 1 1 100%; }
  .unit-row select { flex: 1 1 100%; min-width: 0; }
}
</style></head><body>
<header class="topbar">
  <span class="ico">📏</span>
  <div><h1>单位换算</h1><div class="sub">长度 · 重量 · 温度 · 面积 · 体积 · 数据量</div></div>
  <span class="local-badge" title="偏好与换算历史经平台存储保存在本机">💾 数据保存在本机</span>
</header>
<main class="container">
  <section class="card">
    <div class="cats" id="cats" role="group" aria-label="换算类别">
      <button class="cat active" data-c="length" type="button">📏 长度</button>
      <button class="cat" data-c="weight" type="button">⚖️ 重量</button>
      <button class="cat" data-c="temp" type="button">🌡️ 温度</button>
      <button class="cat" data-c="area" type="button">🟦 面积</button>
      <button class="cat" data-c="volume" type="button">🧊 体积</button>
      <button class="cat" data-c="data" type="button">💾 数据量</button>
    </div>
    <div class="converter">
      <div class="unit-row">
        <input class="amt" id="in-amt" type="number" value="1" inputmode="decimal" aria-label="输入数值">
        <select id="in-unit" aria-label="源单位"></select>
      </div>
      <button class="swap" id="b-swap" type="button" aria-label="交换单位" title="交换单位">⇅</button>
      <div class="unit-row">
        <input class="amt" id="out-amt" type="number" readonly aria-label="换算结果">
        <select id="out-unit" aria-label="目标单位"></select>
      </div>
      <div class="result"><span id="out-text">—</span><div class="sub" id="out-sub"></div></div>
    </div>
  </section>
  <section class="card">
    <h2>⭐ 常用换算</h2>
    <div class="common" id="common"></div>
  </section>
  <section class="card">
    <h2><span>🕘 换算历史</span><button class="btn ghost sm" id="b-clear-hist" type="button">清空历史</button></h2>
    <div class="history" id="history"></div>
  </section>
  <p class="note">💾 数据保存在本机，偏好与换算历史自动保存</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="confirm" role="alertdialog" aria-modal="true" aria-label="操作确认" hidden>
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-ops">
      <button class="btn ghost sm" id="confirm-cancel" type="button">取消</button>
      <button class="btn danger sm" id="confirm-ok" type="button">确认</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';

  /* ═══════════════════ 平台与常量 ═══════════════════ */
  var P = (typeof platform !== 'undefined') ? platform : null;
  var KEY = 'evg.unit-converter';
  var SCHEMA = 1;
  var MAX_HIST = 12;
  // 各分类：单位名 -> 基准系数（除温度外，1 单位 = factor 基准单位；数据量按 1024 进制）
  var CATS = {
    length: { label: '长度', units: { m: { f: 1, n: '米' }, km: { f: 1000, n: '千米' }, cm: { f: 0.01, n: '厘米' }, mm: { f: 0.001, n: '毫米' }, mile: { f: 1609.344, n: '英里' }, ft: { f: 0.3048, n: '英尺' }, inch: { f: 0.0254, n: '英寸' }, yd: { f: 0.9144, n: '码' } } },
    weight: { label: '重量', units: { kg: { f: 1, n: '千克' }, g: { f: 0.001, n: '克' }, mg: { f: 1e-6, n: '毫克' }, t: { f: 1000, n: '吨' }, lb: { f: 0.45359237, n: '磅' }, oz: { f: 0.028349523, n: '盎司' }, jin: { f: 0.5, n: '斤' } } },
    temp: { label: '温度', units: { C: { n: '摄氏度', k: 'c' }, F: { n: '华氏度', k: 'f' }, K: { n: '开尔文', k: 'k' } }, special: true },
    area: { label: '面积', units: { m2: { f: 1, n: '平方米' }, km2: { f: 1e6, n: '平方千米' }, cm2: { f: 1e-4, n: '平方厘米' }, ha: { f: 10000, n: '公顷' }, mu: { f: 666.6667, n: '亩' }, ft2: { f: 0.092903, n: '平方英尺' } } },
    volume: { label: '体积', units: { L: { f: 1, n: '升' }, mL: { f: 0.001, n: '毫升' }, m3: { f: 1000, n: '立方米' }, cm3: { f: 0.001, n: '立方厘米' }, gal: { f: 3.78541, n: '加仑' }, cup: { f: 0.236588, n: '杯' } } },
    data: { label: '数据量', units: { B: { f: 1, n: '字节' }, KB: { f: 1024, n: '千字节' }, MB: { f: 1048576, n: '兆字节' }, GB: { f: 1073741824, n: '吉字节' }, TB: { f: 1099511627776, n: '太字节' } } }
  };
  var COMMON = {
    length: [
      { q: '1 千米 = ? 米', a: '1000 米', from: 'km', to: 'm', amt: 1 },
      { q: '1 英里 = ? 千米', a: '1.609 千米', from: 'mile', to: 'km', amt: 1 },
      { q: '1 英尺 = ? 厘米', a: '30.48 厘米', from: 'ft', to: 'cm', amt: 1 }
    ],
    weight: [
      { q: '1 千克 = ? 斤', a: '2 斤', from: 'kg', to: 'jin', amt: 1 },
      { q: '1 磅 = ? 千克', a: '0.454 千克', from: 'lb', to: 'kg', amt: 1 },
      { q: '1 吨 = ? 千克', a: '1000 千克', from: 't', to: 'kg', amt: 1 }
    ],
    temp: [
      { q: '0°C = ?°F', a: '32°F', from: 'C', to: 'F', amt: 0 },
      { q: '100°C = ?°F', a: '212°F', from: 'C', to: 'F', amt: 100 },
      { q: '300K = ?°C', a: '26.85°C', from: 'K', to: 'C', amt: 300 }
    ],
    area: [
      { q: '1 亩 = ? 平方米', a: '666.67 平方米', from: 'mu', to: 'm2', amt: 1 },
      { q: '1 公顷 = ? 亩', a: '15 亩', from: 'ha', to: 'mu', amt: 1 },
      { q: '1 平方千米 = ? 公顷', a: '100 公顷', from: 'km2', to: 'ha', amt: 1 }
    ],
    volume: [
      { q: '1 升 = ? 毫升', a: '1000 毫升', from: 'L', to: 'mL', amt: 1 },
      { q: '1 加仑 = ? 升', a: '3.785 升', from: 'gal', to: 'L', amt: 1 },
      { q: '1 立方米 = ? 升', a: '1000 升', from: 'm3', to: 'L', amt: 1 }
    ],
    data: [
      { q: '1 兆字节 = ? 千字节', a: '1024 千字节', from: 'MB', to: 'KB', amt: 1 },
      { q: '1 吉字节 = ? 兆字节', a: '1024 兆字节', from: 'GB', to: 'MB', amt: 1 },
      { q: '1 太字节 = ? 吉字节', a: '1024 吉字节', from: 'TB', to: 'GB', amt: 1 }
    ]
  };

  /* ═══════════════════ 存储（localStorage 由平台 polyfill 自动落盘） ═══════════════════
     预载竞态：bridge 的 localStorage polyfill 为「同步内存 + 异步 storage.list 预载」，
     页面启动时的同步读可能先于预载完成而读到空。成熟做法：启动后再经
     platform.storage.list()/get(KEY) 重读权威存储并合并（偏好采纳权威值、
     历史按 id 并集、at 新者胜）—— 绝不覆盖、绝不丢失用户数据。 */
  var store = { schema: SCHEMA, cat: 'length', from: 'm', to: 'km', history: [] };
  var mutated = false;   // 本会话是否已写存储（决定预载对账策略）
  var curCat = 'length';
  var histTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var elInAmt = $('in-amt'), elInUnit = $('in-unit'), elOutAmt = $('out-amt'), elOutUnit = $('out-unit'),
      elOutText = $('out-text'), elOutSub = $('out-sub'), elCats = $('cats'),
      elCommon = $('common'), elHistory = $('history'), elToast = $('toast'),
      elConfirm = $('confirm'), elConfirmMsg = $('confirm-msg');

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function genId() {
    return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function parseJSON(s) {
    if (typeof s !== 'string' || !s) return null;
    try { var v = JSON.parse(s); return (v && typeof v === 'object') ? v : null; } catch (e) { return null; }
  }
  function firstUnit(cat) { return Object.keys(CATS[cat].units)[0]; }
  // 数值显示：正常区间舍入到 1e-8（消除浮点噪声），极大/极小走科学计数法
  function fmtNum(v) {
    if (!isFinite(v)) return '—';
    if (v === 0) return '0';
    var a = Math.abs(v);
    if (a >= 1e15 || a < 1e-6) return v.toExponential(6);
    var r = Math.round(v * 1e8) / 1e8;
    if (r === 0) r = 0;
    return String(r);
  }

  /* ---------- 规范化 ---------- */
  function normalizeHist(h) {
    if (!h || typeof h !== 'object') return null;
    if (typeof h.id !== 'string' || !h.id) h.id = genId();
    h.cat = CATS[h.cat] ? h.cat : 'length';
    h.from = CATS[h.cat].units[h.from] ? h.from : firstUnit(h.cat);
    h.to = CATS[h.cat].units[h.to] ? h.to : h.from;
    h.amt = isFinite(+h.amt) ? +h.amt : 0;
    h.res = isFinite(+h.res) ? +h.res : 0;
    if (!h.at) h.at = Date.now();
    if (!h.catName) h.catName = CATS[h.cat].label;
    return h;
  }
  function normalizeStore(raw) {
    var out = { schema: SCHEMA, cat: 'length', from: 'm', to: 'km', history: [] };
    if (!raw || typeof raw !== 'object') return out;
    if (CATS[raw.cat]) out.cat = raw.cat;
    if (raw.from && CATS[out.cat].units[raw.from]) out.from = raw.from;
    if (raw.to && CATS[out.cat].units[raw.to]) out.to = raw.to;
    if (Array.isArray(raw.history)) {
      var seen = {};
      raw.history.forEach(function (h) {
        var n = normalizeHist(h);
        if (!n || seen[n.id]) return;
        seen[n.id] = true;
        out.history.push(n);
      });
    }
    return out;
  }

  /* ---------- 持久化 ---------- */
  function loadLocal() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function persist() {
    mutated = true;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 存储失败静默：会话内有效 */ }
  }

  /* ---------- 预载竞态对账（权威重读 + 合并，绝不丢数据） ---------- */
  function mergeHist(localH, remoteH) {
    var byId = {}, order = [];
    (remoteH || []).forEach(function (h) {          // 远端先入（保序）
      if (!h || !h.id || byId[h.id]) return;
      byId[h.id] = h; order.push(h.id);
    });
    (localH || []).forEach(function (h) {           // 本地覆盖：同 id 取 at 新者胜
      if (!h || !h.id) return;
      if (!byId[h.id]) { byId[h.id] = h; order.push(h.id); }
      else {
        var at = byId[h.id].at || 0, bt = h.at || 0;
        if (bt >= at) byId[h.id] = h;
      }
    });
    return order.map(function (id) { return byId[id]; });
  }
  function reconcile(backendRaw) {
    var backend = normalizeStore(parseJSON(backendRaw));
    if (!mutated) {
      // 本会话未写过：以权威后端为准（恢复偏好与更早历史）
      store = backend;
    } else {
      // 本会话已写：偏好保留本地，历史按 id 并集、at 新者胜
      store.history = mergeHist(store.history, backend.history).slice(0, MAX_HIST);
    }
    applyUi();
  }
  function tryReconcile() {
    if (!P || !P.storage || !P.storage.list) return;
    P.storage.list().then(function () {
      // 同一后端 FIFO：list 回调执行时 polyfill 预载回调必已执行（内存态已含持久化数据）
      var p = (P.storage.get && typeof P.storage.get === 'function')
        ? P.storage.get(KEY).then(function (raw) { return raw; }, function () { return null; })
        : Promise.resolve(null);
      p.then(reconcile).catch(function () { /* 对账失败静默：以会话内为准 */ });
    }).catch(function () { /* 预载失败：以会话内为准 */ });
  }

  /* ---------- 换算核心 ---------- */
  function toBase(cat, unit, v) {
    if (cat.special) return v;
    return v * cat.units[unit].f;
  }
  function fromBase(cat, unit, b) {
    if (cat.special) return b;
    return b / cat.units[unit].f;
  }
  // 温度特判（经摄氏度中转）
  function tempToC(v, from) {
    if (from === 'C') return v;
    if (from === 'F') return (v - 32) * 5 / 9;
    return v - 273.15;
  }
  function cTo(v, to) {
    if (to === 'C') return v;
    if (to === 'F') return v * 9 / 5 + 32;
    return v + 273.15;
  }
  function compute() {
    var cat = CATS[curCat];
    var from = elInUnit.value || firstUnit(curCat);
    var to = elOutUnit.value || from;
    var amt = parseFloat(elInAmt.value);
    if (!isFinite(amt)) amt = 0;
    var res = cat.special
      ? cTo(tempToC(amt, from), to)
      : fromBase(cat, to, toBase(cat, from, amt));
    return { from: from, to: to, amt: amt, res: res };
  }
  function renderResult(r) {
    var txt = fmtNum(r.res);
    elOutAmt.value = txt;
    elOutText.textContent = txt + ' ' + r.to;
    elOutSub.textContent = fmtNum(r.amt) + ' ' + r.from + ' = ' + txt + ' ' + r.to + '（' + CATS[curCat].units[r.to].n + '）';
  }
  function doConvertSilent() {
    // 启动 / 对账恢复：只算不改存储（绝不触发落盘覆盖预载数据）
    renderResult(compute());
  }
  function doConvert() {
    // 用户操作：计算 + 落盘偏好 + 防抖记录历史
    var r = compute();
    store.from = r.from; store.to = r.to;
    persist();
    renderResult(r);
    if (histTimer) clearTimeout(histTimer);
    histTimer = setTimeout(function () { recordHistory(r); }, 500);
  }
  function recordHistory(r) {
    var top = store.history[0];
    if (top && top.cat === curCat && top.from === r.from && top.to === r.to) {
      // 同组合：更新最新一条（避免打字过程刷屏历史）
      top.amt = r.amt; top.res = r.res; top.at = Date.now();
    } else {
      store.history.unshift({
        id: genId(), cat: curCat, catName: CATS[curCat].label,
        from: r.from, to: r.to, amt: r.amt, res: r.res, at: Date.now()
      });
    }
    if (store.history.length > MAX_HIST) store.history = store.history.slice(0, MAX_HIST);
    persist();
    renderHistory();
  }
  function findHist(id) {
    for (var i = 0; i < store.history.length; i++) {
      if (store.history[i].id === id) return store.history[i];
    }
    return null;
  }

  /* ---------- 渲染 ---------- */
  function renderCatButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('.cat'), function (el) {
      el.classList.toggle('active', el.getAttribute('data-c') === curCat);
    });
  }
  function renderUnits() {
    var cat = CATS[curCat];
    var opts = Object.keys(cat.units).map(function (k) {
      return '<option value="' + esc(k) + '">' + esc(k) + ' · ' + esc(cat.units[k].n) + '</option>';
    }).join('');
    elInUnit.innerHTML = opts; elOutUnit.innerHTML = opts;
    elInUnit.value = store.from; elOutUnit.value = store.to;
  }
  function renderCommon() {
    var items = COMMON[curCat] || [];
    elCommon.innerHTML = items.map(function (c, i) {
      return '<button type="button" class="common-item" data-cidx="' + i + '">' +
        '<span class="q">' + esc(c.q) + '</span><span class="a">' + esc(c.a) + '</span></button>';
    }).join('');
  }
  function renderHistory() {
    if (!store.history.length) {
      elHistory.innerHTML = '<div class="empty">暂无换算记录，换算一次即可保存</div>';
      return;
    }
    elHistory.innerHTML = store.history.map(function (h) {
      var u = CATS[h.cat] && CATS[h.cat].units;
      var fn = u && u[h.from] ? u[h.from].n : h.from;
      var tn = u && u[h.to] ? u[h.to].n : h.to;
      return '<button type="button" class="hist-item" data-hid="' + esc(h.id) + '" title="点击恢复此换算">' +
        '<span class="q">' + esc(fmtNum(h.amt)) + ' ' + esc(fn) + ' → ' + esc(fmtNum(h.res)) + ' ' + esc(tn) + '</span>' +
        '<span class="t">' + esc(h.catName || '') + '</span></button>';
    }).join('');
  }
  function applyUi() {
    curCat = store.cat;
    renderCatButtons(); renderUnits(); doConvertSilent(); renderCommon(); renderHistory();
  }

  /* ---------- 提示（Toast） ---------- */
  var toastTimer = null;
  function showToast(msg, isErr) {
    elToast.textContent = msg;
    elToast.classList.toggle('err', !!isErr);
    elToast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, 2200);
  }

  /* ---------- 内联确认条（替代原生 confirm；Esc 取消） ---------- */
  var confirmCb = null;
  function askConfirm(msg, cb) {
    elConfirmMsg.textContent = msg;
    elConfirm.hidden = false;
    confirmCb = cb;
    $('confirm-ok').focus();
  }
  function closeConfirm() {
    elConfirm.hidden = true;
    confirmCb = null;
  }
  $('confirm-ok').addEventListener('click', function () {
    var cb = confirmCb; closeConfirm();
    if (cb) cb();
  });
  $('confirm-cancel').addEventListener('click', closeConfirm);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !elConfirm.hidden) closeConfirm();
  });

  /* ---------- 事件绑定 ---------- */
  elCats.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.cat') : null;
    if (!b) return;
    var c = b.getAttribute('data-c');
    if (!CATS[c]) return;
    curCat = c;
    store.cat = c;
    store.from = firstUnit(c);
    store.to = Object.keys(CATS[c].units)[1] || firstUnit(c);
    renderCatButtons(); renderUnits(); doConvert(); renderCommon();
  });

  elInAmt.addEventListener('input', doConvert);
  elInUnit.addEventListener('change', doConvert);
  elOutUnit.addEventListener('change', doConvert);

  $('b-swap').addEventListener('click', function () {
    var a = elInUnit.value, b = elOutUnit.value;
    elInUnit.value = b; elOutUnit.value = a;
    doConvert();
  });

  elCommon.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.common-item') : null;
    if (!b) return;
    var c = (COMMON[curCat] || [])[+b.getAttribute('data-cidx')];
    if (!c) return;
    elInAmt.value = String(c.amt);
    elInUnit.value = c.from; elOutUnit.value = c.to;
    store.from = c.from; store.to = c.to;
    doConvert();
    showToast('已载入常用换算');
  });

  elHistory.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.hist-item') : null;
    if (!b) return;
    var h = findHist(b.getAttribute('data-hid'));
    if (!h) return;
    curCat = h.cat;
    store.cat = h.cat; store.from = h.from; store.to = h.to;
    renderCatButtons(); renderUnits();
    elInAmt.value = String(h.amt);
    doConvert();
    showToast('已恢复历史换算');
  });

  $('b-clear-hist').addEventListener('click', function () {
    if (!store.history.length) { showToast('暂无换算记录'); return; }
    askConfirm('清空全部换算历史？', function () {
      store.history = [];
      persist(); renderHistory();
      showToast('已清空换算历史');
    });
  });

  /* ---------- 启动 ---------- */
  store = normalizeStore(parseJSON(loadLocal()));
  applyUi();
  tryReconcile(); // 预载竞态对账：重读权威存储合并，绝不覆盖用户数据
})();
</script></body></html>
