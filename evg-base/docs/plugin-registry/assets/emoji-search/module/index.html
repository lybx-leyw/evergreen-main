  var CATS = [
    { n: '全部', filter: function () { return true; } },
    { n: '😊 表情', filter: function (e) { return e[3].indexOf('笑') !== -1 || e[3].indexOf('开心') !== -1 || e[3].indexOf('生气') !== -1 || e[3].indexOf('难过') !== -1 || e[3].indexOf('哭') !== -1; } },
    { n: '🐱 动物', filter: function (e) { return e[3].indexOf('宠物') !== -1 || e[3].indexOf('动物') !== -1 || e[3].indexOf('猫') !== -1 || e[3].indexOf('狗') !== -1 || e[3].indexOf('鸟') !== -1 || e[3].indexOf('鱼') !== -1 || e[3].indexOf('虫') !== -1; } },
    { n: '🍎 食物', filter: function (e) { return e[3].indexOf('食物') !== -1 || e[3].indexOf('水果') !== -1 || e[3].indexOf('甜点') !== -1 || e[3].indexOf('饮料') !== -1 || e[3].indexOf('零食') !== -1; } },
    { n: '⚽ 运动', filter: function (e) { return e[3].indexOf('运动') !== -1; } },
    { n: '🌙 自然', filter: function (e) { return e[3].indexOf('天气') !== -1 || e[3].indexOf('月亮') !== -1 || e[3].indexOf('太阳') !== -1 || e[3].indexOf('花') !== -1 || e[3].indexOf('树') !== -1 || e[3].indexOf('草') !== -1; } },
    { n: '🎁 礼物', filter: function (e) { return e[3].indexOf('礼物') !== -1 || e[3].indexOf('生日') !== -1 || e[3].indexOf('庆祝') !== -1 || e[3].indexOf('派对') !== -1; } },
    { n: '🏫 学习', filter: function (e) { return e[3].indexOf('书') !== -1 || e[3].indexOf('学习') !== -1 || e[3].indexOf('学校') !== -1 || e[3].indexOf('笔') !== -1; } },
    { n: '💻 科技', filter: function (e) { return e[3].indexOf('电脑') !== -1 || e[3].indexOf('手机') !== -1 || e[3].indexOf('相机') !== -1 || e[3].indexOf('游戏') !== -1 || e[3].indexOf('机器人') !== -1; } },
    { n: '🏠 生活', filter: function (e) { return e[3].indexOf('家') !== -1 || e[3].indexOf('购物') !== -1 || e[3].indexOf('钱') !== -1 || e[3].indexOf('车') !== -1; } }
  ];

  var curCat = '全部', query = '';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderCats() {
    var el = document.getElementById('cats');
    el.innerHTML = CATS.map(function (c) {
      return '<button type="button" class="cat' + (c.n === curCat ? ' active' : '') + '" data-c="' + esc(c.n) + '">' + esc(c.n) + '</button>';
    }).join('');
  }

  function catFilter(e) {
    if (curCat === '全部') return true;
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i].n === curCat) return CATS[i].filter(e);
    }
    return true;
  }

  function filtered() {
    var q = query.toLowerCase();
    return DATA.filter(function (e) {
      var catOk = catFilter(e);
      var qOk = !q || e[0].toLowerCase().indexOf(q) !== -1 ||
        e[1].toLowerCase().indexOf(q) !== -1 || e[2].indexOf(q) !== -1 ||
        e[3].toLowerCase().indexOf(q) !== -1;
      return catOk && qOk;
    });
  }

  function renderMeta(list) {
    var el = document.getElementById('meta');
    var txt = '';
    if (query || curCat !== '全部') txt = '共 ' + list.length + ' 个结果';
    if (list.length > MAX_RENDER) {
      txt += (txt ? ' · ' : '') + '仅显示前 ' + MAX_RENDER + ' 个，输入关键词可继续缩小范围';
    }
    el.textContent = txt;
  }

  function renderGrid() {
    var el = document.getElementById('grid');
    var list = filtered();
    renderMeta(list);
    if (!list.length) { el.innerHTML = '<div class="empty">没有找到匹配的 Emoji，换个关键词试试 🔍</div>'; return; }
    var shown = list.slice(0, MAX_RENDER);
    el.innerHTML = shown.map(function (e) {
      var fav = store.favorites.indexOf(e[2]) !== -1;
      return '<div class="emoji-card" role="button" tabindex="0" data-e="' + esc(e[2]) + '" title="' + esc(e[0]) + ' ' + e[2] + ' · 点击复制">' +
        '<button type="button" class="star' + (fav ? ' on' : '') + '" data-act="fav" aria-pressed="' + (fav ? 'true' : 'false') + '" aria-label="' + (fav ? '取消收藏 ' : '收藏 ') + esc(e[0]) + '">' + (fav ? '★' : '☆') + '</button>' +
        '<div class="e">' + e[2] + '</div><div class="n">' + esc(e[0]) + '</div></div>';
    }).join('');
  }

  function renderFavs() {
    var el = document.getElementById('favs');
    document.getElementById('favcount').textContent = store.favorites.length + ' 个';
    if (!store.favorites.length) { el.innerHTML = '<span class="empty" style="padding:0">暂无收藏，点卡片右上角 ☆ 收藏常用表情</span>'; return; }
    el.innerHTML = store.favorites.map(function (e) {
      return '<span class="chip" role="button" tabindex="0" data-e="' + esc(e) + '" title="点击复制">' + e +
        '<button type="button" class="x" data-act="unfav" aria-label="取消收藏 ' + e + '">✕</button></span>';
    }).join('');
  }

  function renderRecent() {
    var el = document.getElementById('recent');
    document.getElementById('rcount').textContent = store.recent.length + ' 个';
    if (!store.recent.length) { el.innerHTML = '<span class="empty" style="padding:0">暂无</span>'; return; }
    el.innerHTML = store.recent.map(function (e) {
      return '<span class="chip" role="button" tabindex="0" data-e="' + esc(e) + '" title="点击复制">' + e + '</span>';
    }).join('');
  }

  function toggleFavorite(emoji) {
    var i = store.favorites.indexOf(emoji);
    if (i === -1) { store.favorites = [emoji].concat(store.favorites).slice(0, MAX_FAV); }
    else { store.favorites.splice(i, 1); }
    save(); renderFavs(); renderGrid();
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  // 复制：clipboard API 优先，失败降级 execCommand；仅真实成功才反馈成功并
  // 记入最近使用，失败给出错误提示（反馈真实）。
  function copyText(text) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { resolve(true); })
          .catch(function () { resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.pointerEvents = 'none';
    document.body.appendChild(ta);
    var ok = false;
    try {
      var sel = document.getSelection();
      var prev = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      if (prev && sel) { sel.removeAllRanges(); sel.addRange(prev); }
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function handleCopy(emoji) {
    copyText(emoji).then(function (ok) {
      if (!ok) { showToast('复制失败，请手动复制'); return; }
      store.recent = [emoji].concat(store.recent.filter(function (x) { return x !== emoji; })).slice(0, MAX_RECENT);
      save(); renderRecent();
      if (P && P.emit) { try { P.emit('emoji-search:copy', { emoji: emoji }); } catch (err) {} }
      showToast('已复制 ' + emoji);
    });
  }

  // accent 对比度：accent 上文字色按亮度切换（深色 accent → 白字，浅色 → 黑字）
  function luminance(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    var h = m[1];
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var r = parseInt(h.slice(0, 2), 16) / 255,
        g = parseInt(h.slice(2, 4), 16) / 255,
        b = parseInt(h.slice(4, 6), 16) / 255;
    function lin(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function setAccentInk(hex) {
    var L = luminance(hex);
    // 浅色 accent（L 高）→ 深色文字；深色 accent（L 低）→ 白色文字
    var ink = (L == null) ? '#ffffff' : (L > 0.45 ? '#1a1a1a' : '#ffffff');
    try { document.documentElement.style.setProperty('--accent-ink', ink); } catch (e) {}
  }
  function applyAccentInk() {
    var accent = '';
    try { accent = getComputedStyle(document.documentElement).getPropertyValue('--evg-accent').trim(); } catch (e) {}
    if (accent) { setAccentInk(accent); return; }
    if (P && P.theme && P.theme.getColors) {
      P.theme.getColors().then(function (c) { if (c && c.accent) setAccentInk(c.accent); }).catch(function () {});
    }
  }

  var inSearch = document.getElementById('in-search');
  function clearSearch() {
    inSearch.value = ''; query = ''; curCat = '全部';
    renderCats(); renderGrid();
  }
  inSearch.addEventListener('input', function () { query = this.value.trim(); renderGrid(); });
  inSearch.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { clearSearch(); } });
  document.getElementById('b-clear').addEventListener('click', clearSearch);
  document.getElementById('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.cat');
    if (!b) return;
    curCat = b.getAttribute('data-c');
    renderCats(); renderGrid();
  });

  function copyCard(c) {
    var emoji = c.getAttribute('data-e');
    if (!emoji) return;
    handleCopy(emoji);
    c.classList.add('copied');
    setTimeout(function () { c.classList.remove('copied'); }, 1200);
  }
  document.getElementById('grid').addEventListener('click', function (e) {
    var t = e.target;
    var star = t.closest && t.closest('.star');
    if (star) {
      var card = t.closest('.emoji-card');
      if (card) toggleFavorite(card.getAttribute('data-e'));
      return;
    }
    var c = t.closest && t.closest('.emoji-card');
    if (c) copyCard(c);
  });
  document.getElementById('grid').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target;
    if (t.closest && t.closest('.star')) return; // 星标为原生按钮，交给 click
    var c = t.closest && t.closest('.emoji-card');
    if (!c) return;
    e.preventDefault();
    copyCard(c);
  });

  function chipAction(t) {
    var x = t.closest && t.closest('.x');
    if (x) {
      var chip = t.closest('.chip');
      if (chip) toggleFavorite(chip.getAttribute('data-e'));
      return;
    }
    var s = t.closest && t.closest('[data-e]');
    if (s) handleCopy(s.getAttribute('data-e'));
  }
  function chipKeydown(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target;
    if (t.closest && t.closest('.x')) return;
    var s = t.closest && t.closest('[data-e]');
    if (!s) return;
    e.preventDefault();
    handleCopy(s.getAttribute('data-e'));
  }
  document.getElementById('recent').addEventListener('click', function (e) { chipAction(e.target); });
  document.getElementById('recent').addEventListener('keydown', chipKeydown);
  document.getElementById('favs').addEventListener('click', function (e) { chipAction(e.target); });
  document.getElementById('favs').addEventListener('keydown', chipKeydown);

  renderCats(); renderGrid(); renderFavs(); renderRecent();
  applyAccentInk();
  if (P && P.on) { try { P.on('theme:changed', applyAccentInk); } catch (e) {} }
  syncPersisted();
})();
</script></body></html>
