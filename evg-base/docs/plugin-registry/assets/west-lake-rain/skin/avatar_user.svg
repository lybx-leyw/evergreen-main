<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="西湖烟雨用户头像 - 远山烟雨">
  <!-- 西湖烟雨用户头像：灰蓝圆底 + 远山 + 雨丝剪影，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="wlBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#EDF1F4"/>
      <stop offset="60%" stop-color="#D8E2E8"/>
      <stop offset="100%" stop-color="#BCCFD8"/>
    </radialGradient>
    <linearGradient id="wlMtn" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7E9AA6"/>
      <stop offset="100%" stop-color="#5B7E8C"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#wlBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#5B7E8C" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 远山（两层剪影） -->
  <path d="M14 86 L 40 56 L 58 72 L 74 58 L 88 74 L 102 62 L 114 86 Z" fill="url(#wlMtn)" opacity="0.55"/>
  <path d="M20 92 L 44 68 L 62 80 L 78 66 L 96 80 L 108 70 L 114 92 Z" fill="url(#wlMtn)"/>

  <!-- 雨丝 -->
  <g stroke="#5E727C" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="26" x2="24" y2="44"/>
    <line x1="96" y1="22" x2="90" y2="40"/>
    <line x1="62" y1="18" x2="56" y2="36"/>
  </g>

  <!-- 水面 -->
  <path d="M14 96 Q 40 92 64 96 Q 88 100 114 96 L 114 104 L 14 104 Z" fill="url(#wlMtn)" opacity="0.35"/>
</svg>
