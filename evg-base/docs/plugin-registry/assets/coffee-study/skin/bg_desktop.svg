<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="咖啡店自习对话背景（横屏）">
  <!-- 咖啡店自习主题横屏背景：暖咖渐变 + 咖啡杯蒸汽 + 书堆 + 咖啡豆，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6ED"/>
      <stop offset="55%" stop-color="#F4E9DA"/>
      <stop offset="100%" stop-color="#E8D4BE"/>
    </linearGradient>
    <linearGradient id="cupG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C08552" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7F5228" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="cup">
      <ellipse cx="0" cy="16" rx="96" ry="20" fill="#C08552" fill-opacity="0.14"/>
      <ellipse cx="0" cy="16" rx="96" ry="20" fill="none" stroke="#C08552" stroke-opacity="0.22" stroke-width="3"/>
      <path d="M-52 0 L52 0 C 54 30 42 52 8 58 C 4 59 -4 59 -8 58 C -42 52 -54 30 -52 0 Z" fill="url(#cupG)" stroke="#C08552" stroke-opacity="0.16" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="52" ry="14" fill="#7F5228" fill-opacity="0.18"/>
      <ellipse cx="0" cy="0" rx="38" ry="9" fill="#3E2E22" fill-opacity="0.16"/>
      <path d="M 50 -6 C 84 -12 92 20 58 26" fill="none" stroke="#C08552" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 26 C -4 20 -13 20 -14 27 C -15 34 -7 38 0 42 C 7 38 15 34 14 27 C 13 20 4 20 0 26 Z" fill="#FBF6ED" fill-opacity="0.7"/>
      <path d="M-16 -20 C -26 -38 -8 -52 -18 -68" fill="none" stroke="#C08552" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round"/>
      <path d="M4 -22 C -6 -40 12 -54 2 -70" fill="none" stroke="#C08552" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round"/>
      <path d="M24 -18 C 14 -36 32 -50 22 -66" fill="none" stroke="#C08552" stroke-opacity="0.24" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="books">
      <rect x="-100" y="0" width="200" height="26" rx="8" fill="#8A5A33" fill-opacity="0.20"/>
      <rect x="-100" y="0" width="200" height="4" rx="2" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="-84" y="-24" width="168" height="24" rx="8" fill="#C08552" fill-opacity="0.26"/>
      <rect x="-84" y="-24" width="168" height="4" rx="2" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="-68" y="-46" width="136" height="22" rx="8" fill="#3E2E22" fill-opacity="0.15"/>
      <rect x="-68" y="-46" width="136" height="4" rx="2" fill="#ffffff" fill-opacity="0.4"/>
      <path d="M-6 -46 L 1 -66 L 8 -46 Z" fill="#C08552" fill-opacity="0.32"/>
    </g>
    <g id="bean">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#7F5228" fill-opacity="0.45"/>
      <path d="M-5 -2 Q 0 3 5 -1" fill="none" stroke="#FBF6ED" stroke-opacity="0.65" stroke-width="1.6"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- 柔和光斑 -->
  <circle cx="800" cy="440" r="430" fill="url(#glow)"/>
  <circle cx="200" cy="770" r="250" fill="url(#glow)"/>
  <circle cx="1430" cy="150" r="230" fill="url(#glow)"/>

  <!-- 咖啡杯（右下） -->
  <use href="#cup" transform="translate(1290 700) rotate(4) scale(1.15)"/>
  <!-- 书堆（左下） -->
  <use href="#books" transform="translate(320 700) rotate(-3)"/>

  <!-- 咖啡豆 -->
  <use href="#bean" transform="translate(180 240) rotate(24)"/>
  <use href="#bean" transform="translate(1450 560) rotate(-38)"/>
  <use href="#bean" transform="translate(960 760) rotate(12)"/>
  <use href="#bean" transform="translate(520 500) rotate(-15) scale(0.85)"/>
  <use href="#bean" transform="translate(1180 200) rotate(42) scale(0.85)"/>

  <!-- 点缀圆点 -->
  <circle cx="420" cy="660" r="6" fill="#C08552" fill-opacity="0.14"/>
  <circle cx="1150" cy="620" r="5" fill="#8A5A33" fill-opacity="0.18"/>
  <circle cx="700" cy="840" r="6" fill="#C08552" fill-opacity="0.12"/>
  <circle cx="900" cy="150" r="5" fill="#7F5228" fill-opacity="0.14"/>
  <circle cx="60" cy="540" r="5" fill="#C08552" fill-opacity="0.12"/>
</svg>
