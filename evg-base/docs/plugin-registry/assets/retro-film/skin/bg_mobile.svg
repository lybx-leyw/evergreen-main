<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="复古胶片对话背景（竖屏）">
  <!-- 复古胶片主题竖屏背景：暖米纵向渐变 + 胶片条幅 + 放映光束 + 胶片盘，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F0E5"/>
      <stop offset="60%" stop-color="#ECE1CF"/>
      <stop offset="100%" stop-color="#DDCCB0"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F5228" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3D3226" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beamGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B96A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E8B96A" stop-opacity="0"/>
    </radialGradient>
    <g id="frame">
      <rect x="-40" y="-30" width="80" height="60" rx="5" fill="url(#frameG)" stroke="#3D3226" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="-12" cy="-6" r="9" fill="#E8B96A" fill-opacity="0.55"/>
      <path d="M-34 24 L -8 0 L 10 14 L 26 4 L 38 24 Z" fill="#3D3226" fill-opacity="0.3"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑 -->
  <circle cx="450" cy="620" r="430" fill="url(#glow)"/>
  <circle cx="200" cy="260" r="300" fill="url(#beamGlow)"/>

  <!-- 放映光束（左上→右下） -->
  <polygon points="150,120 780,420 780,660 150,240" fill="#E8B96A" fill-opacity="0.06"/>
  <path d="M150 140 L 780 460 M150 210 L 780 570" stroke="#E8B96A" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round"/>

  <!-- 胶片条幅（右侧竖向） -->
  <g transform="translate(770 60)">
    <rect x="0" y="0" width="130" height="1480" rx="10" fill="#3D3226" fill-opacity="0.15"/>
    <g fill="#F6F0E5" fill-opacity="0.55">
      <rect x="12" y="24" width="12" height="9" rx="3"/>
      <rect x="12" y="120" width="12" height="9" rx="3"/>
      <rect x="12" y="216" width="12" height="9" rx="3"/>
      <rect x="12" y="312" width="12" height="9" rx="3"/>
      <rect x="12" y="408" width="12" height="9" rx="3"/>
      <rect x="12" y="504" width="12" height="9" rx="3"/>
      <rect x="12" y="600" width="12" height="9" rx="3"/>
      <rect x="12" y="696" width="12" height="9" rx="3"/>
      <rect x="12" y="792" width="12" height="9" rx="3"/>
      <rect x="12" y="888" width="12" height="9" rx="3"/>
      <rect x="12" y="984" width="12" height="9" rx="3"/>
      <rect x="12" y="1080" width="12" height="9" rx="3"/>
      <rect x="12" y="1176" width="12" height="9" rx="3"/>
      <rect x="12" y="1272" width="12" height="9" rx="3"/>
      <rect x="12" y="1368" width="12" height="9" rx="3"/>
      <rect x="106" y="24" width="12" height="9" rx="3"/>
      <rect x="106" y="120" width="12" height="9" rx="3"/>
      <rect x="106" y="216" width="12" height="9" rx="3"/>
      <rect x="106" y="312" width="12" height="9" rx="3"/>
      <rect x="106" y="408" width="12" height="9" rx="3"/>
      <rect x="106" y="504" width="12" height="9" rx="3"/>
      <rect x="106" y="600" width="12" height="9" rx="3"/>
      <rect x="106" y="696" width="12" height="9" rx="3"/>
      <rect x="106" y="792" width="12" height="9" rx="3"/>
      <rect x="106" y="888" width="12" height="9" rx="3"/>
      <rect x="106" y="984" width="12" height="9" rx="3"/>
      <rect x="106" y="1080" width="12" height="9" rx="3"/>
      <rect x="106" y="1176" width="12" height="9" rx="3"/>
      <rect x="106" y="1272" width="12" height="9" rx="3"/>
      <rect x="106" y="1368" width="12" height="9" rx="3"/>
    </g>
    <use href="#frame" transform="translate(65 200)"/>
    <use href="#frame" transform="translate(65 470)"/>
    <use href="#frame" transform="translate(65 740)"/>
    <use href="#frame" transform="translate(65 1010)"/>
    <use href="#frame" transform="translate(65 1280)"/>
  </g>

  <!-- 胶片盘（左下） -->
  <g transform="translate(200 1360)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#7F5228" stroke-opacity="0.35" stroke-width="6"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#7F5228" stroke-opacity="0.22" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#7F5228" stroke-opacity="0.4" stroke-width="5"/>
    <circle cx="0" cy="0" r="7" fill="#7F5228" fill-opacity="0.45"/>
    <path d="M0 -62 L 0 -80 M0 62 L 0 80 M-62 0 L -80 0 M62 0 L 80 0" stroke="#7F5228" stroke-opacity="0.3" stroke-width="3"/>
  </g>

  <!-- 散落小画格 -->
  <use href="#frame" transform="translate(360 300) rotate(-6) scale(0.75)"/>
  <use href="#frame" transform="translate(500 840) rotate(5) scale(0.65)"/>

  <!-- 点缀圆点 -->
  <circle cx="230" cy="560" r="6" fill="#7F5228" fill-opacity="0.13"/>
  <circle cx="660" cy="1080" r="5" fill="#3D3226" fill-opacity="0.15"/>
  <circle cx="430" cy="1520" r="6" fill="#7F5228" fill-opacity="0.12"/>
  <circle cx="130" cy="900" r="5" fill="#E8B96A" fill-opacity="0.4"/>
</svg>
