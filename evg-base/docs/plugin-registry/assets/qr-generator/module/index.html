<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成</title>
<style>
/* 插件本地别名（禁止在 :root 重定义 --evg-*，平台注入为准；此处仅做语义别名 + 兜底） */
:root {
  --bg: var(--evg-background, #f2f4f8);
  --card: var(--evg-surface, #ffffff);
  --ink: var(--evg-text, #232b3a);
  --ink-soft: var(--evg-text-secondary, #6a7691);
  --accent: var(--evg-accent, #4a6fd0);
  --accent-bg: var(--evg-accent-bg, #e8edfb);
  --accent-border: var(--evg-accent-border, #c6d2f2);
  --line: var(--evg-border, rgba(35, 43, 58, .09));
  --err: var(--evg-error, #d64545);
  --others: var(--evg-others, #f2b880);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* 键盘可达：仅键盘聚焦时显示轮廓 */
:focus-visible { outline: 2px solid var(--accent-border); outline-offset: 2px; border-radius: .3rem; }
.topbar {
  display: flex; align-items: center; gap: .75rem; padding: 1.1rem 1.5rem;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .5);
  background: color-mix(in srgb, var(--card) 72%, transparent);
  backdrop-filter: blur(.875rem); -webkit-backdrop-filter: blur(.875rem);
  position: sticky; top: 0; z-index: 5;
}
.topbar .ico { font-size: 1.5rem; }
.topbar h1 { font-size: 1.15rem; font-weight: 700; }
.topbar .sub { font-size: .72rem; color: var(--ink-soft); }
.container { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 1rem;
  padding: 1.25rem;
  margin-bottom: 1rem;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
}
.card h2 {
  font-size: .95rem; font-weight: 700; margin-bottom: .9rem;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
}
.card h2 .g { display: flex; align-items: center; gap: .6rem; }
.card h2 .f { font-size: .72rem; color: var(--ink-soft); font-weight: 500; }
textarea {
  width: 100%; min-height: 6.5rem; padding: .65rem .8rem;
  border-radius: .75rem; border: 1px solid var(--line);
  background: rgba(242, 244, 248, .55);
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  color: var(--ink);
  font-family: inherit; font-size: .92rem; resize: vertical;
}
textarea:focus { outline: 2px solid var(--accent-border); border-color: var(--accent-border); }
.stat { margin-top: .5rem; font-size: .72rem; color: var(--ink-soft); min-height: 1.1em; }
.stat.err { color: var(--err); }
.presets { display: flex; gap: .4rem; flex-wrap: wrap; margin: .7rem 0; }
.pchip {
  appearance: none; border: 1px solid var(--line); background: transparent;
  color: var(--ink-soft); font-family: inherit; font-size: .75rem;
  padding: .35rem .7rem; border-radius: 999px; cursor: pointer;
}
.pchip:hover { color: var(--accent); border-color: var(--accent-border); }
.options { display: flex; gap: .9rem; flex-wrap: wrap; align-items: center; margin: .8rem 0; }
.opt { display: flex; align-items: center; gap: .4rem; font-size: .82rem; color: var(--ink-soft); }
.opt select {
  font-family: inherit; font-size: .82rem; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: .5rem;
  padding: .28rem .45rem; cursor: pointer;
}
.opt input[type="checkbox"] { accent-color: var(--accent); }
.opt input[type="color"] {
  width: 2rem; height: 1.5rem; padding: 0 .1rem; border: 1px solid var(--line);
  border-radius: .4rem; background: var(--card); cursor: pointer;
}
.btn {
  appearance: none; border: none; cursor: pointer; font-family: inherit;
  font-size: .85rem; font-weight: 600; padding: .55rem 1.1rem; border-radius: .7rem;
  color: #fff; background: var(--accent);
  transition: transform .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); opacity: .92; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: .4rem .75rem; font-size: .75rem; }
.qr-wrap { text-align: center; padding: 1rem 0; }
.qr-box {
  display: inline-block; background: #ffffff; padding: .7rem;
  border-radius: 1rem; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
  transition: background .2s ease;
}
.qr-box canvas { display: block; width: 100%; max-width: 15rem; height: auto; image-rendering: pixelated; }
.ctrl { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: .9rem; }
.history { display: flex; flex-direction: column; gap: .4rem; }
.hitem {
  display: flex; align-items: center; justify-content: space-between; gap: .6rem;
  width: 100%; text-align: left; font-family: inherit; font-size: .82rem; color: var(--ink);
  background: rgba(242, 244, 248, .48);
  background: color-mix(in srgb, var(--bg) 48%, transparent);
  border: 1px solid var(--line); border-radius: .65rem; padding: .5rem .75rem; cursor: pointer;
}
.hitem:hover { border-color: var(--accent-border); }
.hitem .ht { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitem .t { color: var(--ink-soft); font-size: .7rem; flex-shrink: 0; }
.empty { text-align: center; color: var(--ink-soft); font-size: .85rem; padding: 1rem 0; }
.toast {
  position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%) translateY(.4rem);
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: .7rem;
  padding: .55rem 1rem; font-size: .85rem;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .14);
  opacity: 0; pointer-events: none; z-index: 50; max-width: 80vw;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--err); color: var(--err); }
.toast.warn { border-color: var(--others); color: var(--err); }
@media (max-width: 40rem) {
  .qr-box canvas { max-width: 12rem; }
  .container { padding: 1.25rem .9rem 2.5rem; }
}
</style>
</head>
<body>
<header class="topbar">
  <span class="ico">🔳</span>
  <div><h1>二维码生成</h1><div class="sub">文本 / 链接 / WiFi 一键转二维码</div></div>
</header>
<main class="container">
  <section class="card">
    <h2>✏️ 输入内容</h2>
    <textarea id="in-text" placeholder="输入网址、文本、联系方式…" spellcheck="false"></textarea>
    <div class="stat" id="in-stat" aria-live="polite">0 字符</div>
    <div class="presets" id="presets">
      <button type="button" class="pchip" data-t="https://github.com/lybx-leyw/evergreen-main">Evergreen 仓库</button>
      <button type="button" class="pchip" data-t="https://www.zju.edu.cn/">浙江大学</button>
      <button type="button" class="pchip" data-t="WIFI:T:WPA;S:MyHomeWiFi;P:password123;;">WiFi 示例</button>
      <button type="button" class="pchip" data-t="mailto:hello@example.com">邮箱示例</button>
      <button type="button" class="pchip" data-t="tel:+8613800138000">电话示例</button>
    </div>
    <div class="options">
      <label class="opt">纠错级别
        <select id="o-ecc">
          <option value="0">L（约 7%）</option>
          <option value="1">M（约 15%）</option>
          <option value="2">Q（约 25%）</option>
          <option value="3">H（约 30%）</option>
        </select>
      </label>
      <label class="opt">尺寸
        <select id="o-size">
          <option value="0">小</option>
          <option value="1">中</option>
          <option value="2">大</option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="o-pad" checked> 留白边框</label>
      <label class="opt">前景 <input type="color" id="o-fg" value="#111111"></label>
      <label class="opt">背景 <input type="color" id="o-bg" value="#ffffff"></label>
    </div>
    <div class="qr-wrap">
      <div class="qr-box" id="qr-box"><canvas id="qr" width="320" height="320"></canvas></div>
      <div class="ctrl">
        <button type="button" class="btn" id="b-gen">⚡ 生成二维码</button>
        <button type="button" class="btn ghost" id="b-copy">📋 复制 PNG</button>
        <button type="button" class="btn ghost" id="b-dl">⬇ 下载 PNG</button>
      </div>
    </div>
  </section>
  <section class="card">
    <h2>📜 生成历史 <span class="g"><span class="f" id="hcount">0 条</span><button type="button" class="btn ghost sm" id="b-clear">清空</button></span></h2>
    <div class="history" id="history"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   QR 编码内核（内嵌纯 JS，零外部依赖）
   实现：ISO/IEC 18004 标准 QR 码（Model 2），版本 1-40，纠错级别 L/M/Q/H，
   字节模式 + UTF-8，8 种掩码自动选择（惩罚评分）。
   算法与 Nayuki QR Code generator（qrcodegen）逐位对齐，生成的二维码
   可被标准扫码器识别（已与参考实现做位级一致性验证）。
   ═══════════════════════════════════════════════════════════════════════ */
window.__evgQr = (function () {
  'use strict';

  // 纠错级别索引：0=L 1=M 2=Q 3=H；格式信息中的 ECC 位（L=01 M=00 Q=11 H=10）
  var FORMAT_ECC_BITS = [1, 0, 3, 2];

  // 每块纠错码字数（行 = L/M/Q/H，列 = 版本 1-40）
  var ECC_CODEWORDS_PER_BLOCK = [
    [7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
  ];
  // 纠错块数（行 = L/M/Q/H，列 = 版本 1-40）
  var NUM_ECC_BLOCKS = [
    [1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
  ];

  // 原始数据模块数（含剩余位；ISO/IEC 18004 容量公式）
  function getNumRawDataModules(version) {
    var result = (16 * version + 128) * version + 64;
    if (version >= 2) {
      var numAlign = Math.floor(version / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (version >= 7) result -= 36;
    }
    return result;
  }
  // 数据码字数（不含纠错与剩余位）
  function getNumDataCodewords(version, ecl) {
    return Math.floor(getNumRawDataModules(version) / 8)
      - ECC_CODEWORDS_PER_BLOCK[ecl][version - 1] * NUM_ECC_BLOCKS[ecl][version - 1];
  }
  // 对齐图案位置（升序）
  function getAlignmentPatternPositions(version, size) {
    if (version === 1) return [];
    var numAlign = Math.floor(version / 7) + 2;
    var step = Math.floor((version * 8 + numAlign * 3 + 5) / (numAlign * 4 - 4)) * 2;
    var result = [];
    for (var i = 0; i < numAlign - 1; i++) result.push(size - 7 - i * step);
    result.push(6);
    return result.reverse();
  }

  // GF(2^8/0x11D) 乘法（俄罗斯农夫算法）
  function gfMul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >> 7) * 0x11D);
      z ^= ((y >> i) & 1) * x;
    }
    return z;
  }
  // RS 生成多项式（系数从高次到低次存储，不含首项 1）
  function rsGeneratorPoly(degree) {
    var result = new Array(degree);
    for (var i = 0; i < degree; i++) result[i] = 0;
    result[degree - 1] = 1;
    var root = 1;
    for (var k = 0; k < degree; k++) {
      for (var j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 2);
    }
    return result;
  }
  // RS 余式（综合除法）
  function rsComputeRemainder(data, divisor) {
    var result = new Array(divisor.length);
    for (var i = 0; i < divisor.length; i++) result[i] = 0;
    for (var i2 = 0; i2 < data.length; i2++) {
      var factor = data[i2] ^ result[0];
      result.shift();
      result.push(0);
      for (var j = 0; j < divisor.length; j++) result[j] ^= gfMul(divisor[j], factor);
    }
    return result;
  }
  // 分块 ECC + 交织（短块补 1 字节对齐，交织时跳过）
  function addEccAndInterleave(dataCodewords, version, ecl) {
    var numBlocks = NUM_ECC_BLOCKS[ecl][version - 1];
    var blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl][version - 1];
    var rawCodewords = Math.floor(getNumRawDataModules(version) / 8);
    var numShortBlocks = numBlocks - rawCodewords % numBlocks;
    var shortBlockLen = Math.floor(rawCodewords / numBlocks);
    var blocks = [];
    var rsDiv = rsGeneratorPoly(blockEccLen);
    var k = 0;
    for (var i = 0; i < numBlocks; i++) {
      var len = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
      var dat = dataCodewords.slice(k, k + len);
      k += len;
      var ecc = rsComputeRemainder(dat, rsDiv);
      if (i < numShortBlocks) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var result = [];
    for (var i2 = 0; i2 < blocks[0].length; i2++) {
      for (var j = 0; j < blocks.length; j++) {
        if (i2 !== shortBlockLen - blockEccLen || j >= numShortBlocks) result.push(blocks[j][i2]);
      }
    }
    return result;
  }

  // 格式信息（15 位：BCH(15,5) 纠错 + 异或掩码 0x5412）
  function getFormatBits(ecl, mask) {
    var data = (FORMAT_ECC_BITS[ecl] << 3) | mask;
    var rem = data;
    for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >> 9) * 0x537);
    return ((data << 10) | rem) ^ 0x5412;
  }
  // 版本信息（18 位：BCH(18,6)，仅 v>=7 需要）
  function getVersionBits(version) {
    var rem = version;
    for (var i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >> 11) * 0x1F25);
    return (version << 12) | rem;
  }

  // 8 种掩码图案（参数 x=列, y=行）
  var MASK_PATTERNS = [
    function (x, y) { return (x + y) % 2; },
    function (x, y) { return y % 2; },
    function (x, y) { return x % 3; },
    function (x, y) { return (x + y) % 3; },
    function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2; },
    function (x, y) { return x * y % 2 + x * y % 3; },
    function (x, y) { return (x * y % 2 + x * y % 3) % 2; },
    function (x, y) { return ((x + y) % 2 + x * y % 3) % 2; }
  ];

  // 掩码惩罚评分（N1=3 N2=3 N3=40 N4=10）
  function finderPenaltyAddHistory(runLen, history, size) {
    if (history[0] === 0) runLen += size;
    history.pop();
    history.unshift(runLen);
  }
  function finderPenaltyCountPatterns(history) {
    var n = history[1];
    var core = n > 0 && history[2] === n && history[4] === n && history[5] === n && history[3] === n * 3;
    return ((core && history[0] >= n * 4 && history[6] >= n) ? 1 : 0)
      + ((core && history[6] >= n * 4 && history[0] >= n) ? 1 : 0);
  }
  function finderPenaltyTerminateAndCount(runColor, runLen, history, size) {
    if (runColor) { finderPenaltyAddHistory(runLen, history, size); runLen = 0; }
    runLen += size;
    finderPenaltyAddHistory(runLen, history, size);
    return finderPenaltyCountPatterns(history);
  }
  function getPenaltyScore(mod, size) {
    var result = 0;
    // 行：连续同色 + 查找图案样式
    for (var y = 0; y < size; y++) {
      var runColor = false, runX = 0;
      var history = [0, 0, 0, 0, 0, 0, 0];
      for (var x = 0; x < size; x++) {
        if (mod[y][x] === runColor) {
          runX++;
          if (runX === 5) result += 3; else if (runX > 5) result++;
        } else {
          finderPenaltyAddHistory(runX, history, size);
          if (!runColor) result += finderPenaltyCountPatterns(history) * 40;
          runColor = mod[y][x];
          runX = 1;
        }
      }
      result += finderPenaltyTerminateAndCount(runColor, runX, history, size) * 40;
    }
    // 列：同上
    for (var x2 = 0; x2 < size; x2++) {
      var runColor2 = false, runY = 0;
      var history2 = [0, 0, 0, 0, 0, 0, 0];
      for (var y2 = 0; y2 < size; y2++) {
        if (mod[y2][x2] === runColor2) {
          runY++;
          if (runY === 5) result += 3; else if (runY > 5) result++;
        } else {
          finderPenaltyAddHistory(runY, history2, size);
          if (!runColor2) result += finderPenaltyCountPatterns(history2) * 40;
          runColor2 = mod[y2][x2];
          runY = 1;
        }
      }
      result += finderPenaltyTerminateAndCount(runColor2, runY, history2, size) * 40;
    }
    // 2x2 同色块
    for (var y3 = 0; y3 < size - 1; y3++) {
      for (var x3 = 0; x3 < size - 1; x3++) {
        if (mod[y3][x3] === mod[y3][x3 + 1] && mod[y3][x3] === mod[y3 + 1][x3] && mod[y3][x3] === mod[y3 + 1][x3 + 1]) result += 3;
      }
    }
    // 明暗比例平衡
    var dark = 0;
    for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) if (mod[r][c]) dark++;
    var total = size * size;
    var k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
    result += k * 10;
    return result;
  }

  // UTF-8 编码（含代理对）
  function utf8Encode(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var cp = str.codePointAt(i);
      if (cp > 0xFFFF) i++;
      if (cp < 0x80) out.push(cp);
      else if (cp < 0x800) out.push(0xC0 | (cp >> 6), 0x80 | (cp & 63));
      else if (cp < 0x10000) out.push(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      else out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    }
    return out;
  }

  // 给定纠错级别的最大字节容量（版本 40）
  function maxBytes(ecl) {
    var bits = getNumDataCodewords(40, ecl) * 8;
    var ccBits = 16;
    return Math.floor((bits - 4 - ccBits) / 8);
  }

  // 主入口：字节模式编码任意 UTF-8 文本 → {version, size, mask, ecl, modules(0/1 矩阵)}
  function encode(text, ecl) {
    if (typeof ecl !== 'number' || ecl < 0 || ecl > 3) throw new Error('非法的纠错级别');
    var bytes = utf8Encode(String(text == null ? '' : text));

    // 1. 选择最小可用版本
    var version = -1;
    for (var v = 1; v <= 40; v++) {
      var ccBits = v <= 9 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= getNumDataCodewords(v, ecl) * 8) { version = v; break; }
    }
    if (version < 0) {
      throw new Error('内容过长：当前纠错级别最多约 ' + maxBytes(ecl) + ' 字节，请精简内容或降低纠错级别');
    }
    var size = version * 4 + 17;

    // 2. 数据比特流（字节模式 0100 + 字符数 + 数据）
    var bits = [];
    function appendBits(val, len) {
      for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
    }
    appendBits(4, 4);
    appendBits(bytes.length, version <= 9 ? 8 : 16);
    for (var b = 0; b < bytes.length; b++) appendBits(bytes[b], 8);

    // 3. 终止符 + 补齐到字节 + 交替填充码字
    var dataCapacityBits = getNumDataCodewords(version, ecl) * 8;
    appendBits(0, Math.min(4, dataCapacityBits - bits.length));
    appendBits(0, (8 - bits.length % 8) % 8);
    var padByte = 0xEC;
    while (bits.length < dataCapacityBits) {
      appendBits(padByte, 8);
      padByte ^= 0xEC ^ 0x11;
    }
    var dataCodewords = [];
    for (var d = 0; d < bits.length; d += 8) {
      var byte = 0;
      for (var k = 0; k < 8; k++) byte = (byte << 1) | bits[d + k];
      dataCodewords.push(byte);
    }

    // 4. ECC + 交织
    var allCodewords = addEccAndInterleave(dataCodewords, version, ecl);

    // 5. 矩阵：功能图案 + 数据放置
    var mod = [], isFunc = [];
    for (var y = 0; y < size; y++) { mod.push(new Array(size).fill(false)); isFunc.push(new Array(size).fill(false)); }
    function setFunctionModule(x, y, dark) {
      mod[y][x] = !!dark;
      isFunc[y][x] = true;
    }

    // 时序图案
    for (var t = 0; t < size; t++) {
      setFunctionModule(6, t, t % 2 === 0);
      setFunctionModule(t, 6, t % 2 === 0);
    }
    // 查找图案（含分隔符；中心 (x, y)）
    function drawFinder(x, y) {
      for (var dy = -4; dy <= 4; dy++) {
        for (var dx = -4; dx <= 4; dx++) {
          var xx = x + dx, yy = y + dy;
          if (xx >= 0 && xx < size && yy >= 0 && yy < size) {
            var dist = Math.max(Math.abs(dx), Math.abs(dy));
            setFunctionModule(xx, yy, dist !== 2 && dist !== 4);
          }
        }
      }
    }
    drawFinder(3, 3);
    drawFinder(size - 4, 3);
    drawFinder(3, size - 4);
    // 对齐图案（跳过三个查找图案角）
    var alignPos = getAlignmentPatternPositions(version, size);
    var numAlign = alignPos.length;
    for (var ai = 0; ai < numAlign; ai++) {
      for (var aj = 0; aj < numAlign; aj++) {
        if ((ai === 0 && aj === 0) || (ai === 0 && aj === numAlign - 1) || (ai === numAlign - 1 && aj === 0)) continue;
        drawAlignment(alignPos[ai], alignPos[aj]);
      }
    }
    function drawAlignment(x, y) {
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }
    // 版本信息（v>=7，两处副本）
    if (version >= 7) {
      var vBits = getVersionBits(version);
      for (var vi = 0; vi < 18; vi++) {
        var vbit = ((vBits >> vi) & 1) !== 0;
        var a = size - 11 + vi % 3;
        var b = Math.floor(vi / 3);
        setFunctionModule(a, b, vbit);
        setFunctionModule(b, a, vbit);
      }
    }
    // 格式信息（占位掩码 0 标记功能模块；最终值在掩码选定后写入）
    drawFormatBits(0);
    function drawFormatBits(mask) {
      var fBits = getFormatBits(ecl, mask);
      var i;
      for (i = 0; i < 6; i++) setFunctionModule(8, i, ((fBits >> i) & 1) !== 0);
      setFunctionModule(8, 7, ((fBits >> 6) & 1) !== 0);
      setFunctionModule(8, 8, ((fBits >> 7) & 1) !== 0);
      setFunctionModule(7, 8, ((fBits >> 8) & 1) !== 0);
      for (i = 9; i < 15; i++) setFunctionModule(14 - i, 8, ((fBits >> i) & 1) !== 0);
      for (i = 0; i < 8; i++) setFunctionModule(size - 1 - i, 8, ((fBits >> i) & 1) !== 0);
      for (i = 8; i < 15; i++) setFunctionModule(8, size - 15 + i, ((fBits >> i) & 1) !== 0);
      setFunctionModule(8, size - 8, true); // 暗模块（恒暗）
    }

    // 数据放置（之字形，跳过功能模块；剩余位保持 0）
    // 注意：right 为 for 步进值，调整用副本 pair，避免 JS 循环变量被改写后步进错位
    var bitIdx = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      var pair = right;
      if (pair <= 6) pair -= 1;
      for (var vert = 0; vert < size; vert++) {
        for (var j = 0; j < 2; j++) {
          var x = pair - j;
          var upward = ((pair + 1) & 2) === 0;
          var yy = upward ? size - 1 - vert : vert;
          if (!isFunc[yy][x] && bitIdx < allCodewords.length * 8) {
            mod[yy][x] = ((allCodewords[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1) !== 0;
            bitIdx++;
          }
        }
      }
    }

    // 6. 掩码选择（8 种全部尝试，取惩罚最低）
    function applyMask(mask) {
      var masker = MASK_PATTERNS[mask];
      for (var y2 = 0; y2 < size; y2++) {
        for (var x2 = 0; x2 < size; x2++) {
          if (!isFunc[y2][x2] && masker(x2, y2) === 0) mod[y2][x2] = !mod[y2][x2];
        }
      }
    }
    var bestMask = 0, bestPenalty = Infinity;
    for (var m = 0; m < 8; m++) {
      applyMask(m);
      drawFormatBits(m);
      var p = getPenaltyScore(mod, size);
      if (p < bestPenalty) { bestPenalty = p; bestMask = m; }
      applyMask(m); // 撤销
    }
    applyMask(bestMask);
    drawFormatBits(bestMask);

    // 输出 0/1 矩阵
    var out = [];
    for (var r = 0; r < size; r++) {
      var row = new Array(size);
      for (var c = 0; c < size; c++) row[c] = mod[r][c] ? 1 : 0;
      out.push(row);
    }
    return { version: version, size: size, mask: bestMask, ecl: ecl, modules: out };
  }

  return { encode: encode, maxBytes: maxBytes, ECC_L: 0, ECC_M: 1, ECC_Q: 2, ECC_H: 3 };
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   插件 UI：输入 / 预览 / 历史 / 设置偏好（localStorage 自动受益平台 polyfill；
   启动后用 platform.storage 重读合并，规避 polyfill 预载竞态）。
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var P = (typeof platform !== 'undefined') ? platform : null;
  var KEY = 'evg.qr-generator';
  var HISTORY_MAX = 12;
  var ECC_SHORT = ['L', 'M', 'Q', 'H'];
  var DEFAULT_PREFS = { ecc: 2, size: 1, pad: true, fg: '#111111', bg: '#ffffff' };
  var SIZE_PX = [240, 320, 400];

  function $(id) { return document.getElementById(id); }
  function noop() {}

  function copyPrefs(src) {
    var o = {};
    var v;
    for (var k in DEFAULT_PREFS) {
      v = (src && typeof src[k] !== 'undefined') ? src[k] : DEFAULT_PREFS[k];
      if (k === 'ecc' || k === 'size') {
        v = parseInt(v, 10);
        if (isNaN(v) || v < 0) v = DEFAULT_PREFS[k];
      } else if (k === 'pad') {
        v = !!v;
      } else {
        v = typeof v === 'string' ? v : DEFAULT_PREFS[k];
      }
      o[k] = v;
    }
    return o;
  }
  function validHistoryItem(h) { return !!(h && typeof h.t === 'string'); }

  function loadStore() {
    var s = { history: [], prefs: copyPrefs(null) };
    try {
      var raw = localStorage.getItem(KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && typeof parsed === 'object') {
        if (Array.isArray(parsed.history)) {
          s.history = parsed.history.filter(validHistoryItem).slice(0, HISTORY_MAX);
        }
        if (parsed.prefs && typeof parsed.prefs === 'object') s.prefs = copyPrefs(parsed.prefs);
      }
    } catch (e) { /* 损坏数据按默认处理 */ }
    return s;
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify({ history: store.history, prefs: store.prefs })); } catch (e) {}
  }

  // polyfill 预载竞态：启动后经 platform.storage 重读合并
  // - 平台从未写过该 key → 以插件当前 localStorage 为准，回写替换
  // - 平台写过 → 并集合并（历史去重；偏好仅本会话未改动时采用持久化值）
  function reconcileStorage() {
    if (!P || !P.storage || typeof P.storage.get !== 'function' || typeof P.storage.set !== 'function') return;
    P.storage.get(KEY).then(function (raw) {
      var persisted = null;
      try { persisted = raw ? JSON.parse(raw) : null; } catch (e) {}
      if (!persisted || typeof persisted !== 'object') {
        P.storage.set(KEY, JSON.stringify({ history: store.history, prefs: store.prefs })).catch(noop);
        return;
      }
      var changed = false;
      if (Array.isArray(persisted.history)) {
        var seen = {};
        store.history.forEach(function (h) { seen[h.t + '\u0000' + (h.at || '')] = true; });
        persisted.history.forEach(function (h) {
          if (!validHistoryItem(h)) return;
          var k2 = h.t + '\u0000' + (h.at || '');
          if (!seen[k2]) { seen[k2] = true; store.history.push(h); changed = true; }
        });
        store.history.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
        if (store.history.length > HISTORY_MAX) store.history.length = HISTORY_MAX;
      }
      if (persisted.prefs && typeof persisted.prefs === 'object') {
        for (var k3 in DEFAULT_PREFS) {
          if (typeof persisted.prefs[k3] !== 'undefined' && store.prefs[k3] === DEFAULT_PREFS[k3] && persisted.prefs[k3] !== store.prefs[k3]) {
            store.prefs[k3] = persisted.prefs[k3];
            changed = true;
          }
        }
      }
      if (changed) {
        saveStore();
        applyPrefs();
        renderHistory();
      }
      P.storage.set(KEY, JSON.stringify({ history: store.history, prefs: store.prefs })).catch(noop);
    }).catch(noop);
  }

  // 轻量 toast（替代 alert）
  var toastTimer = null;
  function toast(msg, kind) {
    var t = $('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show' + (kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 颜色工具
  function normalizeColor(v, fallback) {
    return (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v)) ? v.toLowerCase() : fallback;
  }
  function parseRgb(hex) {
    hex = normalizeColor(hex, '#000000');
    return { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) };
  }
  function luminance(hex) {
    var c = parseRgb(hex);
    function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
  }
  function contrastRatio(fg, bg) {
    var l1 = luminance(fg), l2 = luminance(bg);
    var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  function byteLength(s) {
    if (window.TextEncoder) return new TextEncoder().encode(s).length;
    var n = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.codePointAt(i);
      if (c > 0xFFFF) i++;
      n += c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    }
    return n;
  }

  var store = loadStore();
  var prefs = store.prefs;
  var lastQr = null; // 最近一次成功编码结果 {version, size, mask}

  function applyPrefs() {
    $('o-ecc').value = String(prefs.ecc);
    $('o-size').value = String(prefs.size);
    $('o-pad').checked = !!prefs.pad;
    $('o-fg').value = normalizeColor(prefs.fg, DEFAULT_PREFS.fg);
    $('o-bg').value = normalizeColor(prefs.bg, DEFAULT_PREFS.bg);
  }
  function savePrefs() {
    var v;
    v = parseInt($('o-ecc').value, 10);
    prefs.ecc = isNaN(v) || v < 0 ? DEFAULT_PREFS.ecc : v;
    v = parseInt($('o-size').value, 10);
    prefs.size = isNaN(v) || v < 0 ? DEFAULT_PREFS.size : v;
    prefs.pad = $('o-pad').checked;
    prefs.fg = normalizeColor($('o-fg').value, DEFAULT_PREFS.fg);
    prefs.bg = normalizeColor($('o-bg').value, DEFAULT_PREFS.bg);
    saveStore();
  }

  function renderQR() {
    var text = $('in-text').value;
    var fg = normalizeColor(prefs.fg, DEFAULT_PREFS.fg);
    var bg = normalizeColor(prefs.bg, DEFAULT_PREFS.bg);
    var canvas = $('qr');
    var px = SIZE_PX[prefs.size] || SIZE_PX[1];
    canvas.width = px;
    canvas.height = px;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, px, px);
    $('qr-box').style.background = bg;
    lastQr = null;
    var stat = $('in-stat');
    if (!text.trim()) { stat.textContent = '0 字符'; stat.className = 'stat'; return; }
    var res;
    try {
      res = window.__evgQr.encode(text, prefs.ecc);
    } catch (e) {
      stat.textContent = e.message || '生成失败';
      stat.className = 'stat err';
      return;
    }
    stat.className = 'stat';
    var n = res.size + (prefs.pad ? 4 : 0); // 留白边框：每侧 2 模块静区
    var cell = Math.floor(px / n);
    var offset = Math.floor((px - cell * res.size) / 2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = fg;
    for (var r = 0; r < res.size; r++) {
      for (var c = 0; c < res.size; c++) {
        if (res.modules[r][c]) ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);
      }
    }
    lastQr = res;
    var ratio = contrastRatio(fg, bg);
    if (ratio < 2.5) toast('前景/背景对比度过低（' + ratio.toFixed(1) + ':1），二维码可能无法扫码', 'warn');
    stat.textContent = text.length + ' 字符 · ' + byteLength(text) + ' 字节 · v' + res.version
      + ' · 纠错 ' + ECC_SHORT[prefs.ecc] + ' · 对比度 ' + ratio.toFixed(1) + ':1';
  }

  function addHistory(text) {
    var now = new Date();
    function pad2(v) { return (v < 10 ? '0' : '') + v; }
    var ts = pad2(now.getMonth() + 1) + '-' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    store.history.unshift({ t: text, at: ts });
    if (store.history.length > HISTORY_MAX) store.history.length = HISTORY_MAX;
    saveStore();
    renderHistory();
  }

  function renderHistory() {
    var el = $('history');
    $('hcount').textContent = store.history.length + ' 条';
    if (!store.history.length) { el.innerHTML = '<div class="empty">还没有生成记录</div>'; return; }
    el.innerHTML = store.history.map(function (h, i) {
      var short = h.t.length > 42 ? esc(h.t.slice(0, 42)) + '…' : esc(h.t);
      return '<button type="button" class="hitem" data-i="' + i + '" title="点击重新生成">'
        + '<span class="ht">' + short + '</span><span class="t">' + esc(h.at || '') + '</span></button>';
    }).join('');
  }

  // 显式生成：输入 → 渲染 → 记入历史 → 上报事件
  function gen() {
    var text = $('in-text').value.trim();
    if (!text) { toast('请输入要生成二维码的内容', 'err'); return; }
    renderQR();
    if (!lastQr) return; // 生成失败不记历史
    addHistory(text);
    if (P && P.emit) { try { P.emit('qr-generator:generate', { len: text.length }); } catch (e) {} }
  }

  // 事件绑定
  $('b-gen').addEventListener('click', gen);

  var debounceTimer = null;
  $('in-text').addEventListener('input', function () {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderQR, 200);
  });
  $('in-text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); gen(); }
  });

  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('.pchip');
    if (!b) return;
    $('in-text').value = b.getAttribute('data-t');
    gen();
  });

  ['o-ecc', 'o-size', 'o-pad', 'o-fg', 'o-bg'].forEach(function (id) {
    $(id).addEventListener('change', function () { savePrefs(); renderQR(); });
  });

  $('history').addEventListener('click', function (e) {
    var btn = e.target.closest('.hitem');
    if (!btn) return;
    var h = store.history[parseInt(btn.getAttribute('data-i'), 10)];
    if (!h) return;
    $('in-text').value = h.t;
    renderQR();
  });

  $('b-clear').addEventListener('click', function () {
    store.history = [];
    saveStore();
    renderHistory();
    toast('历史已清空');
  });

  $('b-copy').addEventListener('click', function () {
    if (!lastQr) { toast('请先生成二维码', 'err'); return; }
    var canvas = $('qr');
    if (!canvas.toBlob) { toast('当前环境不支持复制图片，请用下载', 'err'); return; }
    canvas.toBlob(function (blob) {
      if (!blob) { toast('复制失败', 'err'); return; }
      if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
          toast('二维码已复制到剪贴板');
        }).catch(function () { toast('复制失败，请改用下载', 'err'); });
      } else {
        toast('当前环境不支持复制图片，请用下载', 'err');
      }
    }, 'image/png');
  });

  $('b-dl').addEventListener('click', function () {
    if (!lastQr) { toast('请先生成二维码', 'err'); return; }
    var canvas = $('qr');
    var now = new Date();
    function pad2(v) { return (v < 10 ? '0' : '') + v; }
    var name = 'qrcode-' + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate())
      + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + '.png';
    var a = document.createElement('a');
    a.download = name;
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // 初始化
  applyPrefs();
  $('in-text').value = 'https://github.com/lybx-leyw/evergreen-main';
  renderQR();
  renderHistory();
  reconcileStorage();
})();
</script>
