<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="深海用户头像 - 小鱼">
  <!-- 深海用户头像：深海蓝圆底 + 小鱼剪影 + 气泡，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1C4470"/>
      <stop offset="60%" stop-color="#102E50"/>
      <stop offset="100%" stop-color="#0A1A2F"/>
    </radialGradient>
    <linearGradient id="auFish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFE0F8"/>
      <stop offset="100%" stop-color="#7FBCEA"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#48A1EA" stroke-opacity="0.22" stroke-width="2"/>

  <!-- 小鱼（中心 64,66） -->
  <g transform="translate(64 66)">
    <path d="M-34 0 L -48 -12 L -46 12 Z" fill="url(#auFish)" opacity="0.85"/>
    <ellipse cx="6" cy="0" rx="36" ry="20" fill="url(#auFish)" opacity="0.85"/>
    <path d="M-12 -14 C 6 -24 24 -20 34 -10" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="-4" r="2.6" fill="#0A1A2F"/>
    <path d="M-22 10 C -14 16 -4 18 6 16" fill="none" stroke="#0A1A2F" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 气泡 -->
  <circle cx="40" cy="40" r="5" fill="none" stroke="#BFE0F8" stroke-opacity="0.5" stroke-width="1.6"/>
  <circle cx="38.5" cy="38.5" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="88" cy="88" r="7" fill="none" stroke="#BFE0F8" stroke-opacity="0.4" stroke-width="1.6"/>
  <circle cx="86" cy="86" r="2" fill="#ffffff" opacity="0.55"/>
  <circle cx="92" cy="44" r="3.5" fill="none" stroke="#BFE0F8" stroke-opacity="0.45" stroke-width="1.4"/>
</svg>
