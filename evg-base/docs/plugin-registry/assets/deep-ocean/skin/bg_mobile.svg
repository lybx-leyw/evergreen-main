<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="深海对话背景（竖屏）">
  <!-- 深海主题竖屏背景：深海蓝纵向渐变 + 天光射线 + 层浪 + 水母气泡 + 鱼，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1A2F"/>
      <stop offset="55%" stop-color="#0D2442"/>
      <stop offset="100%" stop-color="#14345C"/>
    </linearGradient>
    <linearGradient id="jellyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48A1EA" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2C6CA8" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="surfaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8D4F5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A8D4F5" stop-opacity="0"/>
    </radialGradient>
    <g id="bubble">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#E4EEF8" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="-4" cy="-4" r="3.5" fill="#ffffff" fill-opacity="0.55"/>
    </g>
    <g id="fish">
      <path d="M-20 0 C -20 -12 12 -16 26 -7 C 34 -3 34 3 26 7 C 12 16 -20 12 -20 0 Z" fill="#E4EEF8" fill-opacity="0.16"/>
      <path d="M-20 0 L -32 -10 L -30 10 Z" fill="#E4EEF8" fill-opacity="0.16"/>
      <circle cx="16" cy="-2" r="2.2" fill="#E4EEF8" fill-opacity="0.35"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 水面柔光（顶部） -->
  <circle cx="450" cy="240" r="520" fill="url(#surfaceGlow)"/>
  <circle cx="450" cy="680" r="430" fill="url(#glow)"/>

  <!-- 天光射线 -->
  <g fill="#ffffff" fill-opacity="0.045">
    <polygon points="60,0 180,0 330,760 0,760"/>
    <polygon points="300,0 390,0 560,820 200,820"/>
    <polygon points="520,0 630,0 820,800 420,800"/>
    <polygon points="740,0 880,0 900,560 680,560"/>
  </g>

  <!-- 层浪 -->
  <path d="M0 1180 q225 -40 450 0 q225 40 450 0" fill="none" stroke="#48A1EA" stroke-opacity="0.12" stroke-width="3"/>
  <path d="M0 1290 q225 -36 450 0 q225 36 450 0" fill="none" stroke="#48A1EA" stroke-opacity="0.09" stroke-width="3"/>
  <path d="M0 1410 q225 -32 450 0 q225 32 450 0" fill="none" stroke="#48A1EA" stroke-opacity="0.07" stroke-width="3"/>
  <path d="M0 1520 q225 -28 450 0 q225 28 450 0" fill="none" stroke="#48A1EA" stroke-opacity="0.05" stroke-width="3"/>

  <!-- 水母（中部） -->
  <g transform="translate(620 620) rotate(-4) scale(1.15)">
    <path d="M-42 0 C -42 -52 42 -52 42 0 C 32 12 10 16 0 16 C -10 16 -32 12 -42 0 Z" fill="url(#jellyG)"/>
    <ellipse cx="0" cy="-6" rx="26" ry="10" fill="#ffffff" fill-opacity="0.14"/>
    <path d="M-22 14 C -28 42 -16 60 -24 86" fill="none" stroke="#48A1EA" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-8 15 C -12 44 0 62 -6 90" fill="none" stroke="#48A1EA" stroke-opacity="0.24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 15 C 4 44 16 62 10 90" fill="none" stroke="#48A1EA" stroke-opacity="0.24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 14 C 16 42 28 60 20 86" fill="none" stroke="#48A1EA" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 鱼（左下） -->
  <use href="#fish" transform="translate(260 880) rotate(-6)"/>
  <use href="#fish" transform="translate(330 940) rotate(6) scale(0.8)"/>
  <use href="#fish" transform="translate(760 1120) rotate(-10) scale(0.75)"/>

  <!-- 气泡（上升） -->
  <use href="#bubble" transform="translate(140 1300)"/>
  <use href="#bubble" transform="translate(240 980) scale(0.75)"/>
  <use href="#bubble" transform="translate(190 660) scale(0.55)"/>
  <use href="#bubble" transform="translate(700 1480) scale(1.1)"/>
  <use href="#bubble" transform="translate(780 880) scale(0.7)"/>
  <use href="#bubble" transform="translate(740 480) scale(0.55)"/>
  <use href="#bubble" transform="translate(450 300) scale(0.5)"/>
</svg>
