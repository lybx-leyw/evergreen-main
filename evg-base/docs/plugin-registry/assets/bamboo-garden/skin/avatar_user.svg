<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="竹林用户头像 - 竹枝">
  <!-- 竹林用户头像：浅绿圆底 + 竹枝竹叶剪影，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F4FAEC"/>
      <stop offset="60%" stop-color="#D8ECC2"/>
      <stop offset="100%" stop-color="#BCDC9E"/>
    </radialGradient>
    <linearGradient id="auStem" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6B9652"/>
      <stop offset="100%" stop-color="#3D6A2E"/>
    </linearGradient>
    <linearGradient id="auLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB35F"/>
      <stop offset="100%" stop-color="#4C7C39"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#4C7C39" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 竹枝（竹节 + 竹叶） -->
  <g>
    <rect x="55" y="34" width="18" height="44" rx="9" fill="url(#auStem)"/>
    <rect x="55" y="78" width="18" height="44" rx="9" fill="url(#auStem)"/>
    <path d="M55 80 L 73 80" stroke="#2F5324" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M60 34 L 60 122" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M62 46 C 88 30, 104 38, 118 56 C 98 62, 78 58, 62 46 Z" fill="url(#auLeaf)"/>
    <path d="M62 56 C 88 42, 104 50, 118 68 C 98 72, 78 68, 62 56 Z" fill="url(#auLeaf)" transform="scale(1 -1) translate(0 -112)"/>
    <path d="M66 92 C 44 82, 30 88, 20 100 C 40 106, 54 102, 66 92 Z" fill="url(#auLeaf)"/>
  </g>

  <!-- 点缀芽点 -->
  <circle cx="42" cy="40" r="3" fill="#4C7C39" opacity="0.35"/>
  <circle cx="88" cy="106" r="2.5" fill="#4C7C39" opacity="0.3"/>
</svg>
