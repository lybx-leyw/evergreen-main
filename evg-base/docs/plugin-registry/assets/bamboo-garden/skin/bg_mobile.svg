<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="竹林对话背景（竖屏）">
  <!-- 竹林主题竖屏背景：浅绿纵向渐变 + 右侧竹丛 + 左下小竹 + 柔光，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF3"/>
      <stop offset="60%" stop-color="#EBF3E1"/>
      <stop offset="100%" stop-color="#D6E8C5"/>
    </linearGradient>
    <linearGradient id="stalkG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B9652" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#90BE70" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4C7C39" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82B562" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#4C7C39" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="stalk">
      <rect x="-13" y="-560" width="26" height="150" rx="12" fill="url(#stalkG)"/>
      <rect x="-13" y="-398" width="26" height="150" rx="12" fill="url(#stalkG)"/>
      <rect x="-13" y="-236" width="26" height="150" rx="12" fill="url(#stalkG)"/>
      <rect x="-13" y="-74" width="26" height="150" rx="12" fill="url(#stalkG)"/>
      <path d="M-13 -406 L 13 -406 M-13 -244 L 13 -244 M-13 -82 L 13 -82" stroke="#4C7C39" stroke-opacity="0.26" stroke-width="2.5"/>
      <path d="M-4 -560 L -4 -30" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g id="leafPair">
      <path d="M0 0 C 26 -14, 52 -8, 74 10 C 50 20, 24 16, 0 0 Z" fill="url(#leafG)"/>
      <path d="M0 0 C 26 16, 50 22, 74 10 C 50 6, 24 2, 0 0 Z" fill="url(#leafG)" transform="scale(1 -1)"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（中心偏上，衬托消息区） -->
  <circle cx="450" cy="620" r="430" fill="url(#glow)"/>
  <circle cx="160" cy="1430" r="300" fill="url(#glow)"/>
  <circle cx="770" cy="200" r="260" fill="url(#glow)"/>

  <!-- 右侧大竹丛 -->
  <g transform="translate(800 1580) rotate(4)">
    <use href="#stalk" transform="translate(0 0) scale(1.7)"/>
    <use href="#stalk" transform="translate(-80 60) rotate(-4) scale(1.4)"/>
    <use href="#leafPair" transform="translate(0 -480) rotate(30) scale(1.6)"/>
    <use href="#leafPair" transform="translate(-70 -620) rotate(-24) scale(1.3)"/>
  </g>

  <!-- 左下小竹丛 -->
  <g transform="translate(150 1520)">
    <use href="#stalk" transform="translate(0 0) rotate(-5) scale(1.1)"/>
    <use href="#stalk" transform="translate(60 30) rotate(2) scale(0.9)"/>
    <use href="#leafPair" transform="translate(-6 -300) rotate(-34)"/>
  </g>

  <!-- 顶部小枝 -->
  <g transform="translate(300 160) rotate(14)">
    <use href="#leafPair" transform="translate(0 0) scale(0.7)"/>
  </g>

  <!-- 点缀圆点 -->
  <circle cx="220" cy="560" r="6" fill="#4C7C39" fill-opacity="0.11"/>
  <circle cx="650" cy="980" r="7" fill="#6B9652" fill-opacity="0.13"/>
  <circle cx="430" cy="1520" r="5" fill="#4C7C39" fill-opacity="0.10"/>
  <circle cx="130" cy="900" r="5" fill="#90BE70" fill-opacity="0.12"/>
  <circle cx="820" cy="760" r="5" fill="#82B562" fill-opacity="0.11"/>
</svg>
