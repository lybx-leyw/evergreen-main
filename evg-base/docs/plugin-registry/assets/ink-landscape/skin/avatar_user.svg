<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="水墨丹青用户头像 - 远山">
  <!-- 水墨丹青用户头像：宣纸圆底 + 远山 + 朱砂日 + 飞鸟，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="60%" stop-color="#EAE6DA"/>
      <stop offset="100%" stop-color="#D9D4C4"/>
    </radialGradient>
    <linearGradient id="auMt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8F8B80"/>
      <stop offset="100%" stop-color="#4C4A45"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#4C4A45" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 远山 -->
  <path d="M14 100 L 46 52 L 72 100 Z" fill="url(#auMt)" opacity="0.55"/>
  <path d="M52 100 L 82 58 L 114 100 Z" fill="url(#auMt)" opacity="0.85"/>

  <!-- 朱砂日 -->
  <circle cx="84" cy="58" r="13" fill="#C0573F" opacity="0.8"/>
  <circle cx="84" cy="58" r="18" fill="#C0573F" opacity="0.2"/>

  <!-- 飞鸟 -->
  <path d="M42 40 Q 47 35 52 39 Q 57 35 62 40" fill="none" stroke="#4C4A45" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

  <!-- 水纹 -->
  <path d="M30 108 q 12 -4 24 0 q 12 4 24 0 q 12 -4 24 0" fill="none" stroke="#4C4A45" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
