<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="落日余晖对话背景（横屏）">
  <!-- 落日余晖主题横屏背景：暖橙渐变 + 云层落日 + 山影 + 飞鸟 + 霞光，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF4ED"/>
      <stop offset="55%" stop-color="#FBE5D8"/>
      <stop offset="100%" stop-color="#F4CCB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8744F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8744F" stop-opacity="0"/>
    </radialGradient>
    <g id="bird">
      <path d="M0 0 Q 8 -8 16 -1 Q 24 -8 32 0" fill="none" stroke="#45261E" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- 柔和光斑 -->
  <circle cx="800" cy="420" r="430" fill="url(#glow)"/>
  <circle cx="800" cy="600" r="330" fill="url(#sunGlow)"/>

  <!-- 云层落日 -->
  <circle cx="800" cy="580" r="150" fill="#E8744F" fill-opacity="0.40"/>
  <circle cx="800" cy="580" r="150" fill="none" stroke="#E8744F" stroke-opacity="0.30" stroke-width="4"/>
  <!-- 云带（切日） -->
  <rect x="640" y="510" width="200" height="18" rx="9" fill="#FBE5D8" fill-opacity="0.9"/>
  <rect x="660" y="556" width="250" height="22" rx="11" fill="#F9DCCB" fill-opacity="0.85"/>
  <rect x="630" y="606" width="180" height="16" rx="8" fill="#FBE5D8" fill-opacity="0.9"/>
  <!-- 霞光细云 -->
  <path d="M 220 240 L 520 240" stroke="#E8744F" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"/>
  <path d="M 1080 180 L 1440 180" stroke="#E8744F" stroke-opacity="0.20" stroke-width="9" stroke-linecap="round"/>
  <path d="M 120 340 L 340 340" stroke="#E8744F" stroke-opacity="0.15" stroke-width="7" stroke-linecap="round"/>

  <!-- 飞鸟 -->
  <use href="#bird" transform="translate(560 330)"/>
  <use href="#bird" transform="translate(680 370) scale(0.75)"/>
  <use href="#bird" transform="translate(1000 300) scale(0.9)"/>
  <use href="#bird" transform="translate(1120 340) scale(0.6)"/>

  <!-- 山影 -->
  <path d="M0 800 L 260 660 L 560 810 L 880 670 L 1200 820 L 1440 700 L 1600 790 L 1600 900 L 0 900 Z" fill="#A74C35" fill-opacity="0.14"/>
  <path d="M0 860 L 300 760 L 640 870 L 980 760 L 1320 880 L 1600 790 L 1600 900 L 0 900 Z" fill="#45261E" fill-opacity="0.16"/>

  <!-- 点缀圆点 -->
  <circle cx="420" cy="640" r="6" fill="#A74C35" fill-opacity="0.14"/>
  <circle cx="1180" cy="620" r="5" fill="#E8744F" fill-opacity="0.2"/>
  <circle cx="700" cy="840" r="6" fill="#A74C35" fill-opacity="0.12"/>
  <circle cx="900" cy="150" r="5" fill="#E8744F" fill-opacity="0.18"/>
  <circle cx="1460" cy="480" r="5" fill="#A74C35" fill-opacity="0.12"/>
</svg>
