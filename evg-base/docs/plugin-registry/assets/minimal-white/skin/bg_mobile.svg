<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="极简白对话背景（竖屏）">
  <!-- 极简白主题竖屏背景：纯白纵向渐变 + 极简几何线条（圆环/弧线/点），
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8F8F8"/>
      <stop offset="100%" stop-color="#EFEFEF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 大圆环（右上） -->
  <circle cx="720" cy="280" r="170" fill="none" stroke="#1C1C1C" stroke-opacity="0.06" stroke-width="2.5"/>
  <circle cx="720" cy="280" r="136" fill="none" stroke="#1C1C1C" stroke-opacity="0.04" stroke-width="2"/>

  <!-- 同心圆环（左下） -->
  <circle cx="190" cy="1330" r="80" fill="none" stroke="#1C1C1C" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="190" cy="1330" r="108" fill="none" stroke="#1C1C1C" stroke-opacity="0.04" stroke-width="2"/>

  <!-- 弧线（中下） -->
  <path d="M 260 1120 A 300 300 0 0 1 760 960" fill="none" stroke="#6E6E6E" stroke-opacity="0.10" stroke-width="3" stroke-linecap="round"/>

  <!-- 细线 -->
  <path d="M 300 240 L 560 240" fill="none" stroke="#1C1C1C" stroke-opacity="0.10" stroke-width="2"/>
  <path d="M 520 620 L 720 620" fill="none" stroke="#6E6E6E" stroke-opacity="0.08" stroke-width="2"/>

  <!-- 点缀点 -->
  <circle cx="220" cy="420" r="6" fill="#1C1C1C" fill-opacity="0.5"/>
  <circle cx="720" cy="980" r="5" fill="#1C1C1C" fill-opacity="0.35"/>
  <circle cx="460" cy="760" r="2.5" fill="#6E6E6E" fill-opacity="0.35"/>
  <circle cx="640" cy="420" r="2" fill="#6E6E6E" fill-opacity="0.3"/>
  <circle cx="320" cy="1520" r="2.5" fill="#6E6E6E" fill-opacity="0.3"/>
  <circle cx="120" cy="800" r="2" fill="#6E6E6E" fill-opacity="0.28"/>
  <circle cx="800" cy="1450" r="2" fill="#6E6E6E" fill-opacity="0.28"/>
  <circle cx="560" cy="1080" r="2" fill="#6E6E6E" fill-opacity="0.25"/>
</svg>
