<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="极简白用户头像 - 弯月">
  <!-- 极简白用户头像：浅灰圆底 + 黑色弯月，留白极简，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#E2E2E2"/>
    </radialGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#1C1C1C" stroke-opacity="0.12" stroke-width="2"/>

  <!-- 弯月 -->
  <circle cx="66" cy="64" r="30" fill="#1C1C1C"/>
  <circle cx="78" cy="54" r="26" fill="url(#auBg)"/>

  <!-- 点缀 -->
  <circle cx="96" cy="92" r="2.5" fill="#6E6E6E" fill-opacity="0.6"/>
  <circle cx="38" cy="38" r="1.8" fill="#6E6E6E" fill-opacity="0.5"/>
</svg>
