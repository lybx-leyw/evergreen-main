<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图书馆深夜用户头像 - 夜读">
  <!-- 图书馆深夜用户头像：深夜蓝圆底 + 摊开的书 + 台灯暖光 + 弯月，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3B4662"/>
      <stop offset="60%" stop-color="#29334A"/>
      <stop offset="100%" stop-color="#1E2430"/>
    </radialGradient>
    <linearGradient id="auPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F4F8"/>
      <stop offset="100%" stop-color="#B9C2D4"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#F0B35A" stroke-opacity="0.22" stroke-width="2"/>

  <!-- 暖光 -->
  <circle cx="64" cy="64" r="42" fill="#F0B35A" fill-opacity="0.22"/>

  <!-- 摊开的书（中心 64,74） -->
  <g transform="translate(64 74)">
    <ellipse cx="0" cy="12" rx="40" ry="7" fill="#10141E" fill-opacity="0.5"/>
    <path d="M0 -12 C -13 -12 -30 -8 -42 0 L -36 20 C -24 14 -12 12 0 12 Z" fill="url(#auPage)"/>
    <path d="M0 -12 C 13 -12 30 -8 42 0 L 36 20 C 24 14 12 12 0 12 Z" fill="url(#auPage)"/>
    <path d="M0 -12 L 0 12" stroke="#8A94A8" stroke-width="2"/>
    <path d="M-26 -3 L -16 -3 M-26 2 L -12 2 M-26 7 L -18 7" stroke="#8A94A8" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M26 -3 L 16 -3 M26 2 L 12 2 M26 7 L 18 7" stroke="#8A94A8" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 弯月 -->
  <path d="M 96 34 A 11 11 0 1 1 86 54 A 8.6 8.6 0 1 0 96 34 Z" fill="#F0B35A" fill-opacity="0.9"/>

  <!-- 星点 -->
  <circle cx="34" cy="38" r="1.8" fill="#F0B35A" opacity="0.8"/>
  <circle cx="92" cy="100" r="1.5" fill="#E8EAF0" opacity="0.6"/>
</svg>
