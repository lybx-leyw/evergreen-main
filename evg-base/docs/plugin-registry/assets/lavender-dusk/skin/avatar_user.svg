<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="薰衣草暮色用户头像 - 薰衣草">
  <!-- 薰衣草暮色用户头像：浅紫圆底 + 薰衣草花穗剪影，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FBF8FF"/>
      <stop offset="60%" stop-color="#E8DDFA"/>
      <stop offset="100%" stop-color="#D5C3EF"/>
    </radialGradient>
    <linearGradient id="auBlo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B7ED0"/>
      <stop offset="100%" stop-color="#6C54A4"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#6C54A4" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 薰衣草（中心 64,88） -->
  <g transform="translate(64 88)">
    <path d="M0 0 C 2 -34 0 -68 7 -100" fill="none" stroke="#7A68A8" stroke-opacity="0.8" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="url(#auBlo)">
      <ellipse cx="3" cy="-20" rx="6.5" ry="8"/>
      <ellipse cx="-3" cy="-31" rx="6.5" ry="8"/>
      <ellipse cx="4" cy="-42" rx="6" ry="7.5"/>
      <ellipse cx="-2" cy="-53" rx="5.5" ry="7"/>
      <ellipse cx="3" cy="-64" rx="5" ry="6.5"/>
      <ellipse cx="0" cy="-75" rx="4.5" ry="6"/>
      <ellipse cx="2" cy="-86" rx="4" ry="5.5"/>
      <ellipse cx="1" cy="-96" rx="3.5" ry="4.5"/>
    </g>
    <ellipse cx="-6" cy="-6" rx="7" ry="3.5" fill="#6C54A4" opacity="0.5" transform="rotate(-30 -6 -6)"/>
    <ellipse cx="6" cy="-9" rx="7" ry="3.5" fill="#6C54A4" opacity="0.5" transform="rotate(28 6 -9)"/>
  </g>

  <!-- 暮光点缀 -->
  <circle cx="34" cy="36" r="3" fill="#A58CD8" opacity="0.6"/>
  <circle cx="94" cy="96" r="2.5" fill="#A58CD8" opacity="0.5"/>
  <circle cx="92" cy="42" r="2" fill="#9B7ED0" opacity="0.45"/>
</svg>
