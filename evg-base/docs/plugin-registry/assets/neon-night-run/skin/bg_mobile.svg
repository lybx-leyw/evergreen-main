<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="荧光夜跑对话背景（竖屏）">
  <!-- 荧光夜跑主题竖屏背景：深紫纵向渐变 + 荧光跑道 + 夜跑者光轨 + 霓虹光斑，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14101F"/>
      <stop offset="55%" stop-color="#1C1730"/>
      <stop offset="100%" stop-color="#2A2150"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DF3B8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4DF3B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <g id="dotM">
      <circle cx="0" cy="0" r="11" fill="#4DF3B8" fill-opacity="0.14"/>
      <circle cx="0" cy="0" r="4.5" fill="#4DF3B8" fill-opacity="0.8"/>
    </g>
    <g id="dotP">
      <circle cx="0" cy="0" r="11" fill="#7B61FF" fill-opacity="0.13"/>
      <circle cx="0" cy="0" r="4.5" fill="#7B61FF" fill-opacity="0.75"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（中心偏上） -->
  <circle cx="450" cy="620" r="430" fill="url(#glow)"/>
  <circle cx="200" cy="1380" r="320" fill="url(#mintGlow)"/>
  <circle cx="740" cy="280" r="280" fill="url(#purpleGlow)"/>

  <!-- 荧光跑道（透视弯道） -->
  <g fill="none" stroke-linecap="round">
    <path d="M-60 1180 Q 450 1130 960 1180" stroke="#4DF3B8" stroke-opacity="0.10" stroke-width="4"/>
    <path d="M-60 1260 Q 450 1210 960 1260" stroke="#4DF3B8" stroke-opacity="0.09" stroke-width="4"/>
    <path d="M-60 1340 Q 450 1290 960 1340" stroke="#4DF3B8" stroke-opacity="0.08" stroke-width="4"/>
    <path d="M-60 1420 Q 450 1370 960 1420" stroke="#4DF3B8" stroke-opacity="0.07" stroke-width="4"/>
    <path d="M-60 1500 Q 450 1450 960 1500" stroke="#4DF3B8" stroke-opacity="0.06" stroke-width="4"/>
  </g>
  <!-- 跑道中线 -->
  <path d="M-60 1310 Q 450 1260 960 1310" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="18 14"/>

  <!-- 夜跑者（荧光光轨） -->
  <g transform="translate(470 1290)">
    <path d="M-110 0 C -70 -14 -30 -6 0 0" fill="none" stroke="#4DF3B8" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
    <path d="M-70 0 C -45 -8 -20 -4 0 0" fill="none" stroke="#4DF3B8" stroke-opacity="0.8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-24" r="8.5" fill="#4DF3B8" fill-opacity="0.9"/>
    <path d="M0 -15 L 2 4 M 2 4 L -5 17 M 2 4 L 10 13 M -2 10 L -12 15" fill="none" stroke="#4DF3B8" stroke-opacity="0.85" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-4" cy="-26" r="13" fill="#4DF3B8" fill-opacity="0.15"/>
  </g>

  <!-- 光点 -->
  <use href="#dotM" transform="translate(180 420)"/>
  <use href="#dotM" transform="translate(700 860)"/>
  <use href="#dotM" transform="translate(560 1580)"/>
  <use href="#dotP" transform="translate(360 200)"/>
  <use href="#dotP" transform="translate(800 540)"/>
  <use href="#dotP" transform="translate(100 1020)"/>
  <use href="#dotP" transform="translate(760 1500)"/>
</svg>
