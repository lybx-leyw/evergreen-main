@media (prefers-color-scheme: dark) {

<header class="topbar">

  var resetArmed = false, resetTimer = null;

  var ALL_KEYS = ['score', 'best', 'streak', 'bestStreak', 'answered', 'correct', 'seen', 'roundLeft'];
  function markTouched() { for (var i = 0; i < ALL_KEYS.length; i++) touched[ALL_KEYS[i]] = true; }

  // 载入存档：先读 polyfill 内存（可能为空，预载异步晚于首帧），
  // 再经权威通道 platform.storage.get 校准一次，避免首帧默认值覆盖旧存档。
  var store = QuizCore.normalizeState(safeParse(readRaw()));
  if (store.roundLeft < 1) { store.score = 0; store.roundLeft = QuizCore.ROUND_LEN; }
  if (P && P.storage && P.storage.get) {
    P.storage.get(KEY).then(function (v) {
      if (typeof v !== 'string' || !v) return;
      var saved = QuizCore.normalizeState(safeParse(v));
      store = QuizCore.mergeState(store, saved, touched);
      if (store.roundLeft < 1) { store.score = 0; store.roundLeft = QuizCore.ROUND_LEN; }
      renderStats(); renderProgress();
    }).catch(function () { /* 核心未就绪等：保持当前内存态（会话内有效） */ });
  }

  var nextIndex = QuizCore.makeOrder(BANK.length, Math.random);

  function pickQuestion() {
    var i = nextIndex();
    var q = BANK[i];
    return {
      q: q,
      distractors: QuizCore.pickDistractors(BANK.length, i, 3, Math.random).map(function (j) { return BANK[j].w; }),
      mask: mode === 'fill' ? QuizCore.pickMask(q.w, Math.random) : null
    };
  }

  function renderQuestion() {
    current = pickQuestion();
    answered = false;
    var idiomEl = document.getElementById('q-idiom');
    var hintEl = document.getElementById('q-hint');
    var optsEl = document.getElementById('options');
    var explain = document.getElementById('explain');
    explain.classList.add('hidden');
    explain.textContent = '';

    if (mode === 'guess') {
      idiomEl.textContent = '？ ？ ？ ？';
      hintEl.textContent = '释义：' + current.q.d;
      var opts = QuizCore.shuffle([current.q.w].concat(current.distractors), Math.random);
      optsEl.innerHTML = opts.map(function (o) {
        return '<button class="opt" type="button" data-w="' + esc(o) + '">' + esc(o) + '</button>';
      }).join('');
    } else {
      var word = current.q.w;
      var shown = word.slice(0, current.mask.index) + '＿' + word.slice(current.mask.index + 1);
      idiomEl.textContent = shown;
      hintEl.textContent = '补全成语（释义：' + current.q.d + '）';
      var cands = QuizCore.pickFillCandidates(FILL_POOL, current.mask.char, 4, Math.random);
      optsEl.innerHTML = cands.map(function (c) {
        return '<button class="opt ch" type="button" data-c="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('');
    }
    var nextBtn = document.getElementById('b-next');
    nextBtn.disabled = true;
    nextBtn.textContent = '下一题 ▶';
    roundFinished = false;
    var first = optsEl.querySelector('.opt');
    if (first) first.focus({ preventScroll: true });
  }

  function answer(payload) {
    if (answered) return;
    answered = true;
    var correct;
    if (mode === 'guess') {
      correct = QuizCore.evaluateGuess(current.q.w, payload);
      renderGuessResult(correct, payload);
    } else {
      correct = QuizCore.evaluateFill(current.q.w, current.mask.index, payload);
      renderFillResult(correct, payload, current.mask.char);
    }
    store = QuizCore.applyAnswer(store, current.q, correct);
    markTouched();
    roundFinished = store.roundLeft < 1;
    if (roundFinished) {
      lastRoundScore = store.score;
      // 存档直接开启新局（score 归零、剩余题数回满），内存留在结算态
      store.score = 0;
      store.roundLeft = QuizCore.ROUND_LEN;
    }
    save();
    renderStats();
    renderProgress();
    var nextBtn = document.getElementById('b-next');
    nextBtn.disabled = false;
    nextBtn.textContent = roundFinished ? '查看成绩 ▶' : '下一题 ▶';
    nextBtn.focus();
    if (P && P.emit) { try { P.emit('idiom-quiz:answer', { correct: correct, score: store.score, best: store.best }); } catch (e) {} }
  }

  function renderGuessResult(correct, picked) {
    var opts = document.querySelectorAll('#options .opt');
    Array.prototype.forEach.call(opts, function (o) {
      if (o.getAttribute('data-w') === current.q.w) o.classList.add('correct');
      if (!correct && o.getAttribute('data-w') === picked) o.classList.add('wrong');
      o.disabled = true;
    });
    var ex = document.getElementById('explain');
    ex.innerHTML = '<b>' + esc(current.q.w) + '</b>：' + esc(current.q.d) + (correct ? '（回答正确 🎉）' : '');
    ex.classList.remove('hidden');
  }

  function renderFillResult(correct, picked, maskChar) {
    var opts = document.querySelectorAll('#options .opt');
    Array.prototype.forEach.call(opts, function (o) {
      if (o.getAttribute('data-c') === maskChar) o.classList.add('correct');
      if (!correct && o.getAttribute('data-c') === picked) o.classList.add('wrong');
      o.disabled = true;
    });
    var ex = document.getElementById('explain');
    ex.innerHTML = '<b>' + esc(current.q.w) + '</b>：' + esc(current.q.d) + (correct ? '（回答正确 🎉）' : '（正确答案是「' + esc(maskChar) + '」）');
    ex.classList.remove('hidden');
  }

  function gradeNote(score) {
    if (score >= 90) return '学富五车，出口成章！';
    if (score >= 70) return '才思敏捷，成语信手拈来！';
    if (score >= 40) return '渐入佳境，再接再厉！';
    return '熟能生巧，再来一局练练手吧。';
  }

  function showResult() {
    document.getElementById('quiz-card').classList.add('hidden');
    var r = document.getElementById('result');
    document.getElementById('r-score').textContent = lastRoundScore;
    document.getElementById('r-best').textContent = store.best;
    document.getElementById('r-streak').textContent = store.bestStreak;
    document.getElementById('r-note').textContent = gradeNote(lastRoundScore);
    r.classList.remove('hidden');
    document.getElementById('b-restart').focus();
  }

  function startRound() {
    store.score = 0;
    store.roundLeft = QuizCore.ROUND_LEN;
    save();
    document.getElementById('result').classList.add('hidden');
    document.getElementById('quiz-card').classList.remove('hidden');
    renderStats();
    renderProgress();
    renderQuestion();
  }

  function renderStats() {
    document.getElementById('score').textContent = store.score;
    document.getElementById('streak').textContent = store.streak;
    document.getElementById('st-best').textContent = store.best;
    document.getElementById('st-answered').textContent = store.answered;
    document.getElementById('st-correct').textContent = store.correct;
    document.getElementById('st-rate').textContent = store.answered ? Math.round(store.correct / store.answered * 100) + '%' : '0%';
    document.getElementById('st-seen').textContent = Object.keys(store.seen).length + '/' + BANK.length;
  }

  function renderProgress() {
    var now = Math.min(QuizCore.ROUND_LEN, Math.max(1, QuizCore.ROUND_LEN - store.roundLeft + 1));
    document.getElementById('q-now').textContent = now;
  }

  // 交互
  document.getElementById('options').addEventListener('click', function (e) {
    var b = e.target.closest('.opt');
    if (!b || answered) return;
    if (mode === 'guess') answer(b.getAttribute('data-w'));
    else answer(b.getAttribute('data-c'));
  });

  document.getElementById('b-next').addEventListener('click', function () {
    if (roundFinished) { showResult(); return; }
    renderQuestion();
  });

  document.getElementById('b-restart').addEventListener('click', startRound);

  document.getElementById('modes').addEventListener('click', function (e) {
    var b = e.target.closest('.mode');
    if (!b) return;
    mode = b.getAttribute('data-m');
    Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (x) { x.classList.toggle('active', x === b); });
    renderQuestion();
  });

  // 重置记录：两段式确认，避免误触（不使用 alert/confirm 原生弹窗）
  document.getElementById('b-reset').addEventListener('click', function () {
    var btn = document.getElementById('b-reset');
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = '再次点击确认重置';
      btn.classList.add('danger');
      resetTimer = setTimeout(function () {
        resetArmed = false;
        btn.textContent = '重置记录';
        btn.classList.remove('danger');
      }, 3000);
      return;
    }
    if (resetTimer) clearTimeout(resetTimer);
    resetArmed = false;
    btn.textContent = '重置记录';
    btn.classList.remove('danger');
    store = QuizCore.defaults();
    touched = {};
    save();
    startRound();
  });

  renderStats();
  renderProgress();
  renderQuestion();
})();
</script></body></html>
