<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="赛博霓虹对话背景（竖屏）">
  <!-- 赛博霓虹主题竖屏背景：深紫纵向渐变 + 透视网格 + 霓虹光环/六边形 + 光点，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0B1E"/>
      <stop offset="55%" stop-color="#16112A"/>
      <stop offset="100%" stop-color="#221B48"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <g id="ring">
      <circle cx="0" cy="0" r="120" fill="none" stroke="#00E5FF" stroke-opacity="0.08" stroke-width="14"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="3"/>
    </g>
    <g id="hex">
      <path d="M0 -26 L22.5 -13 L22.5 13 L0 26 L-22.5 13 L-22.5 -13 Z" fill="#FF6EC7" fill-opacity="0.05"/>
      <path d="M0 -26 L22.5 -13 L22.5 13 L0 26 L-22.5 13 L-22.5 -13 Z" fill="none" stroke="#FF6EC7" stroke-opacity="0.36" stroke-width="2.5"/>
    </g>
    <g id="dot">
      <circle cx="0" cy="0" r="13" fill="#00E5FF" fill-opacity="0.15"/>
      <circle cx="0" cy="0" r="5" fill="#00E5FF" fill-opacity="0.7"/>
    </g>
    <g id="dotM">
      <circle cx="0" cy="0" r="12" fill="#FF6EC7" fill-opacity="0.12"/>
      <circle cx="0" cy="0" r="4.5" fill="#FF6EC7" fill-opacity="0.6"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（中心偏上） -->
  <circle cx="450" cy="620" r="430" fill="url(#glow)"/>
  <circle cx="150" cy="1420" r="300" fill="url(#neonGlow)"/>
  <circle cx="760" cy="240" r="260" fill="url(#neonGlow)"/>

  <!-- 透视网格（灭点 450,400） -->
  <g stroke="#00E5FF" stroke-opacity="0.06" stroke-width="2">
    <path d="M60 1600 L450 400 M160 1600 L450 400 M260 1600 L450 400 M360 1600 L450 400"/>
    <path d="M460 1600 L450 400 M560 1600 L450 400 M660 1600 L450 400 M760 1600 L450 400 M860 1600 L450 400"/>
    <path d="M0 430 L900 430 M0 520 L900 520 M0 630 L900 630 M0 760 L900 760 M0 920 L900 920 M0 1100 L900 1100 M0 1320 L900 1320"/>
  </g>

  <!-- 霓虹光环 -->
  <use href="#ring" transform="translate(190 1180) scale(1.3)"/>
  <use href="#ring" transform="translate(730 520)"/>
  <use href="#ring" transform="translate(680 1380) scale(0.7)"/>
  <use href="#ring" transform="translate(260 340) scale(0.5)"/>

  <!-- 六边形 -->
  <use href="#hex" transform="translate(280 640)"/>
  <use href="#hex" transform="translate(700 960) scale(1.1)"/>
  <use href="#hex" transform="translate(520 280) scale(0.6)"/>

  <!-- 光点 -->
  <use href="#dot" transform="translate(140 800)"/>
  <use href="#dot" transform="translate(760 720)"/>
  <use href="#dot" transform="translate(500 1500)"/>
  <use href="#dotM" transform="translate(300 220)"/>
  <use href="#dotM" transform="translate(780 1560)"/>
  <use href="#dotM" transform="translate(430 860)"/>
</svg>
