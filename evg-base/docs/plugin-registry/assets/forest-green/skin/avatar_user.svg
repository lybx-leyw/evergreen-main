<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="森林绿意用户头像 - 松树">
  <!-- 森林绿意用户头像：浅绿圆底 + 松树剪影 + 暖阳，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F1F8EC"/>
      <stop offset="60%" stop-color="#D5E9CA"/>
      <stop offset="100%" stop-color="#BBD8AB"/>
    </radialGradient>
    <linearGradient id="auTree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A8A5C"/>
      <stop offset="100%" stop-color="#2B5C3A"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#3A764C" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 松树（中心 64,88） -->
  <g transform="translate(64 88)">
    <rect x="-5" y="-14" width="10" height="14" fill="#6B4A2F" fill-opacity="0.5"/>
    <path d="M0 -96 L 34 -28 L -34 -28 Z" fill="url(#auTree)"/>
    <path d="M0 -70 L 40 -10 L -40 -10 Z" fill="url(#auTree)"/>
    <path d="M0 -44 L 46 8 L -46 8 Z" fill="url(#auTree)"/>
  </g>

  <!-- 暖阳 -->
  <circle cx="30" cy="34" r="11" fill="#F6C96E" opacity="0.75"/>
  <circle cx="30" cy="34" r="11" fill="none" stroke="#F6C96E" stroke-opacity="0.5" stroke-width="2"/>

  <!-- 飞鸟 -->
  <path d="M84 40 Q 91 33 98 39 Q 105 33 112 40" fill="none" stroke="#2B5C3A" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
