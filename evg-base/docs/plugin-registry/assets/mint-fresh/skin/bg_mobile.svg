<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="薄荷清新对话背景（竖屏）">
  <!-- 薄荷清新主题竖屏背景：浅薄荷纵向渐变 + 薄荷叶片 + 气泡 + 柔光，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4FCF8"/>
      <stop offset="60%" stop-color="#E6F7EE"/>
      <stop offset="100%" stop-color="#D0ECDE"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC08F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#106B56" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="leafG2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AA97E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E8A68" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="leaf">
      <path d="M0 -120 C 72 -90, 94 10, 12 98 C -10 113, -10 113, -12 98 C -94 10, -72 -90, 0 -120 Z" fill="url(#leafG)"/>
      <path d="M0 -110 C 3 -56, 3 24, -3 90" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="leafS">
      <path d="M0 -80 C 48 -60, 62 8, 8 65 C -7 75, -7 75, -8 65 C -62 8, -48 -60, 0 -80 Z" fill="url(#leafG2)"/>
      <path d="M0 -72 C 2 -36, 2 16, -2 58" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="bubble">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#106B56" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" fill-opacity="0.6"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（中心偏上） -->
  <circle cx="450" cy="620" r="430" fill="url(#glow)"/>
  <circle cx="160" cy="1430" r="300" fill="url(#glow)"/>
  <circle cx="770" cy="200" r="260" fill="url(#glow)"/>

  <!-- 薄荷叶 -->
  <g transform="translate(740 330) rotate(24)">
    <use href="#leaf" transform="translate(0 0) scale(1.25)"/>
  </g>
  <g transform="translate(190 1220) rotate(-26)">
    <use href="#leaf" transform="translate(0 0) scale(1.2)"/>
  </g>
  <g transform="translate(680 1080) rotate(12)">
    <use href="#leafS" transform="translate(0 0) scale(1.05)"/>
  </g>
  <g transform="translate(220 420) rotate(-40)">
    <use href="#leafS" transform="translate(0 0) scale(0.9)"/>
  </g>

  <!-- 薄荷小枝（左上） -->
  <g transform="translate(220 200) rotate(-24)">
    <path d="M0 0 C 2 -40 6 -70 14 -100" fill="none" stroke="#106B56" stroke-opacity="0.25" stroke-width="3.5" stroke-linecap="round"/>
    <use href="#leafS" transform="translate(8 -60) rotate(40) scale(0.5)"/>
    <use href="#leafS" transform="translate(-6 -70) rotate(-140) scale(0.5)"/>
  </g>

  <!-- 气泡 -->
  <use href="#bubble" transform="translate(240 560)"/>
  <use href="#bubble" transform="translate(660 940) scale(1.1)"/>
  <use href="#bubble" transform="translate(430 1520) scale(0.8)"/>
  <use href="#bubble" transform="translate(130 900) scale(0.7)"/>
  <use href="#bubble" transform="translate(810 760) scale(0.9)"/>
  <use href="#bubble" transform="translate(520 300) scale(0.65)"/>

  <!-- 点缀圆点 -->
  <circle cx="350" cy="760" r="6" fill="#106B56" fill-opacity="0.12"/>
  <circle cx="720" cy="560" r="7" fill="#3AA97E" fill-opacity="0.14"/>
  <circle cx="560" cy="1220" r="5" fill="#106B56" fill-opacity="0.10"/>
  <circle cx="110" cy="300" r="5" fill="#1E8A68" fill-opacity="0.13"/>
</svg>
