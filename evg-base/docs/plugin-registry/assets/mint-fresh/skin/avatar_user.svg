<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="薄荷清新用户头像 - 薄荷叶">
  <!-- 薄荷清新用户头像：浅薄荷圆底 + 薄荷叶片剪影 + 气泡，
       28px 圆头像裁切下依然清晰。 -->
  <defs>
    <radialGradient id="auBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F2FBF6"/>
      <stop offset="60%" stop-color="#CFEDDE"/>
      <stop offset="100%" stop-color="#AFE0C8"/>
    </radialGradient>
    <linearGradient id="auLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B987"/>
      <stop offset="100%" stop-color="#106B56"/>
    </linearGradient>
  </defs>

  <!-- 圆底 -->
  <circle cx="64" cy="64" r="60" fill="url(#auBg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#106B56" stroke-opacity="0.18" stroke-width="2"/>

  <!-- 薄荷叶（中心 64,70） -->
  <g transform="translate(64 70)">
    <path d="M0 -56 C 34 -42, 44 4, 6 46 C -4 52, -4 52, -6 46 C -44 4, -34 -42, 0 -56 Z" fill="url(#auLeaf)"/>
    <path d="M0 -50 C 2 -26, 2 12, -2 42" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 小枝 -->
  <path d="M64 78 C 64 86 66 92 70 98" fill="none" stroke="#0E5A48" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>

  <!-- 气泡 -->
  <circle cx="36" cy="38" r="4.5" fill="none" stroke="#106B56" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="34.5" cy="36.5" r="1.3" fill="#ffffff" opacity="0.7"/>
  <circle cx="92" cy="94" r="6" fill="none" stroke="#106B56" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="90" cy="92" r="1.7" fill="#ffffff" opacity="0.65"/>
</svg>
