<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意空状态图标 - 绿芽">
  <!-- R2-4 空状态装饰图标：横竖屏一致的单一图标（不区分方向）。
       绿意主题：柔光圆盘 + 主叶片 + 双嫩芽 + 露珠。 -->
  <defs>
    <radialGradient id="ecBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#eafff3"/>
      <stop offset="60%" stop-color="#d4f7e4"/>
      <stop offset="100%" stop-color="#b6efd0"/>
    </radialGradient>
    <linearGradient id="ecLeaf" x1="18%" y1="8%" x2="82%" y2="95%">
      <stop offset="0%" stop-color="#6fe3a0"/>
      <stop offset="45%" stop-color="#2fbf71"/>
      <stop offset="100%" stop-color="#0f9d58"/>
    </linearGradient>
    <linearGradient id="ecSprout" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7fe9ab"/>
      <stop offset="100%" stop-color="#16b865"/>
    </linearGradient>
  </defs>

  <!-- 柔光圆盘 -->
  <circle cx="100" cy="100" r="88" fill="url(#ecBg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#0f9d58" stroke-opacity="0.15" stroke-width="2"/>

  <!-- 主叶片（绿意不息） -->
  <g transform="translate(100 114)">
    <path d="M0 -62 C 37 -46, 48 5, 6 51 C -5 59, -5 59, -6 51 C -46 6, -34 -42, 0 -62 Z"
          fill="url(#ecLeaf)"/>
    <!-- 主叶脉 -->
    <path d="M0 -56 C 2 -28, 2 12, -2 46" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
    <!-- 侧脉 左 -->
    <path d="M-1 -36 C -13 -28, -22 -18, -30 -6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <path d="M-1 -14 C -11 -8, -20 0, -27 9" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <!-- 侧脉 右 -->
    <path d="M1 -36 C 13 -28, 22 -18, 30 -6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <path d="M1 -14 C 11 -8, 20 0, 27 9" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 双嫩芽 -->
  <path d="M60 116 C 52 98, 40 88, 34 90 C 38 102, 48 112, 60 116 Z" fill="url(#ecSprout)"/>
  <path d="M140 116 C 148 98, 160 88, 166 90 C 162 102, 152 112, 140 116 Z" fill="url(#ecSprout)"/>

  <!-- 露珠点缀 -->
  <circle cx="152" cy="70" r="5" fill="#16c784" fill-opacity="0.85"/>
  <circle cx="150" cy="68" r="1.6" fill="#ffffff" fill-opacity="0.9"/>
</svg>
