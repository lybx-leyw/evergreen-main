<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意对话背景（横屏）">
  <!-- R2-4 对话背景图（横屏/宽屏 imageDesktop）：浅绿渐变 + 半透明叶片
       装饰，整体低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0faf2"/>
      <stop offset="55%" stop-color="#e2f5e8"/>
      <stop offset="100%" stop-color="#cdeed8"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fe3a0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f9d58" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fbf71" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#16c784" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（提亮中心，衬托消息区） -->
  <circle cx="800" cy="450" r="430" fill="url(#glow)"/>
  <circle cx="180" cy="780" r="260" fill="url(#glow)"/>
  <circle cx="1460" cy="140" r="240" fill="url(#glow)"/>

  <!-- 左上大叶片 -->
  <g transform="translate(230 200) rotate(-24)">
    <path d="M0 -150 C 90 -112, 118 12, 15 122 C -12 141, -12 141, -15 122 C -118 12, -90 -112, 0 -150 Z"
          fill="url(#leaf1)"/>
    <path d="M0 -138 C 4 -70, 4 30, -4 112" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 右下叶片 -->
  <g transform="translate(1330 710) rotate(30)">
    <path d="M0 -120 C 72 -90, 94 10, 12 98 C -10 113, -10 113, -12 98 C -94 10, -72 -90, 0 -120 Z"
          fill="url(#leaf2)"/>
    <path d="M0 -110 C 3 -56, 3 24, -3 90" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 中上小叶片 -->
  <g transform="translate(1010 130) rotate(12)">
    <path d="M0 -80 C 48 -60, 62 8, 8 65 C -7 75, -7 75, -8 65 C -62 8, -48 -60, 0 -80 Z"
          fill="url(#leaf1)"/>
    <path d="M0 -72 C 2 -36, 2 16, -2 58" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 右下小嫩芽 -->
  <g transform="translate(210 170) rotate(-40)">
    <path d="M0 -46 C 26 -34, 34 4, 4 36 C -3 41, -3 41, -4 36 C -34 4, -26 -34, 0 -46 Z" fill="url(#leaf2)"/>
  </g>

  <!-- 点缀圆点 -->
  <circle cx="420" cy="640" r="7" fill="#0f9d58" fill-opacity="0.14"/>
  <circle cx="1180" cy="620" r="9" fill="#16c784" fill-opacity="0.16"/>
  <circle cx="700" cy="830" r="6" fill="#0f9d58" fill-opacity="0.12"/>
  <circle cx="140" cy="420" r="5" fill="#2fbf71" fill-opacity="0.15"/>
  <circle cx="1500" cy="460" r="6" fill="#16c784" fill-opacity="0.14"/>
  <circle cx="900" cy="150" r="5" fill="#2fbf71" fill-opacity="0.12"/>
</svg>
