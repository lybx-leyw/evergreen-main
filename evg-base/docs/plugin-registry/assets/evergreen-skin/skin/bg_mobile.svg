<svg width="900" height="1600" viewBox="0 0 900 1600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意对话背景（竖屏）">
  <!-- R2-4 对话背景图（竖屏 imageMobile）：浅绿纵向渐变 + 半透明叶片装饰，
       低对比度，叠加渲染层 35% 白遮罩后消息文字清晰可读。 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2fbf4"/>
      <stop offset="60%" stop-color="#e3f6e9"/>
      <stop offset="100%" stop-color="#cdeed8"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fe3a0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0f9d58" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2fbf71" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#16c784" stop-opacity="0.09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#bgGrad)"/>

  <!-- 柔和光斑（中心偏上，衬托消息区） -->
  <circle cx="450" cy="640" r="430" fill="url(#glow)"/>
  <circle cx="160" cy="1400" r="300" fill="url(#glow)"/>
  <circle cx="780" cy="200" r="260" fill="url(#glow)"/>

  <!-- 右侧大叶片 -->
  <g transform="translate(760 300) rotate(28)">
    <path d="M0 -150 C 90 -112, 118 12, 15 122 C -12 141, -12 141, -15 122 C -118 12, -90 -112, 0 -150 Z"
          fill="url(#leaf1)"/>
    <path d="M0 -138 C 4 -70, 4 30, -4 112" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 左下叶片 -->
  <g transform="translate(180 1180) rotate(-30)">
    <path d="M0 -130 C 78 -98, 102 10, 13 106 C -11 122, -11 122, -13 106 C -102 10, -78 -98, 0 -130 Z"
          fill="url(#leaf2)"/>
    <path d="M0 -120 C 3 -60, 3 26, -3 98" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 中上小叶片 -->
  <g transform="translate(300 160) rotate(14)">
    <path d="M0 -80 C 48 -60, 62 8, 8 65 C -7 75, -7 75, -8 65 C -62 8, -48 -60, 0 -80 Z"
          fill="url(#leaf1)"/>
    <path d="M0 -72 C 2 -36, 2 16, -2 58" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 底部小嫩芽 -->
  <g transform="translate(700 1420) rotate(38)">
    <path d="M0 -46 C 26 -34, 34 4, 4 36 C -3 41, -3 41, -4 36 C -34 4, -26 -34, 0 -46 Z" fill="url(#leaf2)"/>
  </g>

  <!-- 点缀圆点 -->
  <circle cx="220" cy="560" r="7" fill="#0f9d58" fill-opacity="0.13"/>
  <circle cx="640" cy="980" r="8" fill="#16c784" fill-opacity="0.15"/>
  <circle cx="420" cy="1520" r="6" fill="#0f9d58" fill-opacity="0.12"/>
  <circle cx="130" cy="900" r="5" fill="#2fbf71" fill-opacity="0.14"/>
  <circle cx="820" cy="760" r="5" fill="#16c784" fill-opacity="0.13"/>
</svg>
