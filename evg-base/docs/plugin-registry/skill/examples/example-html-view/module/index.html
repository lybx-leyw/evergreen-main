<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>我的成绩单</title><style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 墨白极简（DeepSeek Harness 风格）：墨（近黑）与白为主，绿色仅少量强调 */
  --bg: #fafafa;
  --bg-2: #f4f4f5;
  --ink: #17181a;
  --ink-soft: #4b5563;
  --ink-faint: #9ca3af;
  --accent: #16a34a;                     /* 绿意 · 少量强调 */
  --accent-deep: #15803d;
  --accent-soft: #f0fdf4;
  --card: #ffffff;
  --line: rgba(17, 24, 39, 0.08);
  --shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 1px 3px rgba(17, 24, 39, 0.06);
  --shadow-hover: 0 4px 12px rgba(17, 24, 39, 0.08), 0 2px 4px rgba(17, 24, 39, 0.04);

  /* 成绩等级色：数据语义色（低饱和），F 级跟随主题错误色 */
  --A: #2f9e44;                          /* 优秀 · 绿 */
  --B: #4a7dbf;                          /* 良好 · 蓝 */
  --C: #a8924a;                          /* 中等 · 琥珀 */
  --D: #b07643;                          /* 及格 · 橙 */
  --F: var(--evg-error);                 /* 不及格 · 主题错误红 */

  /* 字号刻度 */
  --fs-2xs: 0.72rem;
  --fs-xs: 0.75rem;      /* 12px */
  --fs-sm: 0.8125rem;    /* 13px */
  --fs-md: 0.875rem;     /* 14px */
  --fs-base: 0.9375rem;  /* 15px */
  --fs-lg: 1.0625rem;    /* 17px */
  --fs-xl: 1.25rem;      /* 20px */
  --fs-2xl: 1.875rem;    /* 30px */
  --fs-3xl: 2.125rem;    /* 34px */

  /* 圆角 / 间距刻度 */
  --radius-lg: 1rem;
  --radius-md: 0.75rem;
  --radius-sm: 0.5625rem;
  --space-2xs: 0.25rem;
  --space-xs: 0.375rem;
  --space-sm: 0.5rem;
  --space-md: 0.75rem;
  --space-lg: 1rem;
  --space-xl: 1.25rem;
  --space-2xl: 1.5rem;
  --space-3xl: 2rem;
}

html { font-size: 16px; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
  background: #fafafa;                   /* 墨白：纯纸白底 */
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--ink);
  font-size: var(--fs-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶部 ---------- */
.topbar {
  background: color-mix(in srgb, var(--evg-surface) 70%, transparent);
  backdrop-filter: blur(0.875rem);
  -webkit-backdrop-filter: blur(0.875rem);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.topbar-inner {
  max-width: 75rem;
  margin: 0 auto;
  padding: 1.25rem 1.75rem;
  display: flex;
  align-items: center;
}
.brand { display: flex; align-items: center; gap: 0.875rem; }
.brand-mark {
  width: 2.875rem; height: 2.875rem;
  border-radius: 0.8125rem;
  background: #ffffff;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.brand-mark svg { display: block; width: 100%; height: 100%; }
/* 「黑白放映」：logo 以墨白（灰度）呈现，周期性"放映"彩色版；悬停常显彩色 */
.brand-mark .logo-reel {
  filter: grayscale(1);
  transition: filter 0.6s ease;
  animation: logoReel 12s ease-in-out infinite;
}
.brand-mark:hover .logo-reel { filter: grayscale(0); animation-play-state: paused; }
@keyframes logoReel {
  0%, 16% { filter: grayscale(1); }
  28%, 56% { filter: grayscale(0); }
  72%, 100% { filter: grayscale(1); }
}
.topbar h1 {
  font-size: clamp(1.1rem, 2.2vw, 1.25rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.brand-sub {
  font-size: var(--fs-2xs);
  color: var(--ink-faint);
  margin-top: 0.1875rem;
}

/* ---------- 布局 ---------- */
.container {
  max-width: 75rem;
  margin: 0 auto;
  padding: 1.875rem 1.75rem 3.5rem;
}

/* ---------- AI 学业分析 ---------- */
.ai-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.125rem 1.375rem;
  box-shadow: var(--shadow);
  backdrop-filter: blur(0.625rem);
  -webkit-backdrop-filter: blur(0.625rem);
  margin-bottom: 1.25rem;
  position: relative;
  overflow: hidden;
}
.ai-card::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 0.3125rem;
  background: linear-gradient(180deg, var(--accent), transparent);
  pointer-events: none;
}
.ai-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255, 255, 255, 0.10);
  pointer-events: none;
}
.ai-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.ai-head-text { min-width: 0; }
.ai-title {
  font-size: var(--fs-lg);
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.ai-icon {
  width: 1.75rem; height: 1.75rem;
  border-radius: 0.5rem;
  background: #17181a;
  color: #ffffff;
  font-size: 0.9375rem;
  display: inline-flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.ai-sub { font-size: var(--fs-xs); color: var(--ink-faint); margin-top: 0.3125rem; }
.ai-btn {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #ffffff;
  background: #17181a;                   /* 墨色主按钮 */
  border-radius: 999px;
  padding: 0.625rem 1.25rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4375rem;
  box-shadow: none;
  transition: background 0.16s ease, transform 0.16s ease, opacity 0.16s ease;
}
.ai-btn:hover { background: #2d2f33; transform: translateY(-0.125rem); box-shadow: none; }
.ai-btn:active { transform: translateY(0); }
.ai-btn:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
.ai-btn:focus-visible { outline: 2px solid var(--evg-accent-border); outline-offset: 2px; }

.ai-body { margin-top: 1.125rem; border-top: 1px dashed var(--evg-accent-border); padding-top: 1.125rem; }

/* 思考中状态 */
.ai-thinking { text-align: center; padding: 1.75rem 1rem 1.5rem; }
.ai-thinking-icon {
  font-size: 1.625rem;
  display: inline-block;
  animation: spin 2.4s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ai-thinking p { margin-top: 0.75rem; font-size: var(--fs-sm); color: var(--ink-soft); }
.ai-dots { margin-top: 0.875rem; display: flex; justify-content: center; gap: 0.375rem; }
.ai-dots i {
  width: 0.4375rem; height: 0.4375rem;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1s infinite ease-in-out;
}
.ai-dots i:nth-child(2) { animation-delay: 0.15s; }
.ai-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); opacity: 0.45; }
  50% { transform: translateY(-0.375rem); opacity: 1; }
}

/* 分析报告 */
.ai-verdict {
  display: flex;
  align-items: flex-start;
  gap: 0.875rem;
  background: color-mix(in srgb, var(--evg-surface) 78%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0.9375rem 1.125rem;
  animation: aiReveal 0.4s ease both;
}
.ai-v-badge {
  flex-shrink: 0;
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0.3125rem 0.6875rem;
  border-radius: 999px;
  white-space: nowrap;
}
.ai-v-badge.vA { color: var(--A); background: color-mix(in srgb, var(--A) 14%, transparent); border: 1px solid color-mix(in srgb, var(--A) 34%, transparent); }
.ai-v-badge.vB { color: var(--B); background: color-mix(in srgb, var(--B) 14%, transparent); border: 1px solid color-mix(in srgb, var(--B) 34%, transparent); }
.ai-v-badge.vC { color: var(--C); background: color-mix(in srgb, var(--C) 14%, transparent); border: 1px solid color-mix(in srgb, var(--C) 34%, transparent); }
.ai-v-badge.vD { color: var(--D); background: color-mix(in srgb, var(--D) 14%, transparent); border: 1px solid color-mix(in srgb, var(--D) 34%, transparent); }
.ai-v-text { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.65; }
.ai-v-text b { color: var(--ink); font-weight: 700; }

.ai-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.875rem;
  margin-top: 0.875rem;
}
.ai-box {
  background: color-mix(in srgb, var(--evg-surface) 68%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0.9375rem 1.0625rem;
  animation: aiReveal 0.4s ease both;
}
.ai-box-title {
  font-size: var(--fs-sm);
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 0.625rem;
  display: flex;
  align-items: center;
  gap: 0.375rem;
}
.ai-chips { display: flex; flex-direction: column; gap: 0.4375rem; }
.ai-chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.625rem;
  font-size: var(--fs-xs);
  padding: 0.375rem 0.625rem;
  border-radius: 0.4375rem;
  background: color-mix(in srgb, var(--evg-background) 60%, transparent);
  border: 1px solid color-mix(in srgb, var(--evg-text-secondary) 14%, transparent);
}
.ai-chip-name { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-chip-val { color: var(--ink-soft); font-weight: 600; flex-shrink: 0; }
.ai-chip.up .ai-chip-val { color: var(--A); }
.ai-chip.down .ai-chip-val { color: var(--D); }

/* 迷你走势 / 学科结构 */
.ai-bars { display: flex; flex-direction: column; gap: 0.5rem; }
.ai-bar-row { display: flex; align-items: center; gap: 0.5rem; }
.ai-bar-label { width: 4.75rem; font-size: var(--fs-2xs); color: var(--ink-faint); text-align: right; flex-shrink: 0; }
.ai-bar-track { flex: 1; height: 0.5625rem; border-radius: 0.3125rem; background: color-mix(in srgb, var(--evg-text-secondary) 10%, transparent); overflow: hidden; }
.ai-bar-fill { height: 100%; border-radius: 0.3125rem; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--evg-background))); min-width: 0.25rem; }
.ai-bar-val { width: 2.375rem; font-size: var(--fs-2xs); color: var(--ink-soft); font-weight: 600; flex-shrink: 0; }

.ai-suggest {
  margin-top: 0.875rem;
  background: color-mix(in srgb, var(--evg-surface) 68%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 0.9375rem 1.0625rem;
  animation: aiReveal 0.4s ease both;
}
.ai-suggest ol { margin: 0.125rem 0 0 1.125rem; padding: 0; }
.ai-suggest li {
  font-size: var(--fs-sm);
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 0.375rem;
}
.ai-suggest li:last-child { margin-bottom: 0; }
.ai-suggest li::marker { color: var(--accent); font-weight: 700; }
.ai-suggest li b { color: var(--ink); }

@keyframes aiReveal {
  from { opacity: 0; transform: translateY(0.5rem); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 概览统计（2×2） ---------- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.375rem;
  box-shadow: var(--shadow);
  backdrop-filter: blur(0.625rem);
  -webkit-backdrop-filter: blur(0.625rem);
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.stat-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255, 255, 255, 0.10);
  pointer-events: none;
}
.stat-card:hover { transform: translateY(-0.125rem); box-shadow: var(--shadow-hover); }
.stat-label {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: var(--space-sm);
}
.stat-value {
  font-size: clamp(1.625rem, 2.6vw, 1.875rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1.1;
}
.stat-value .unit {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--ink-faint);
  margin-left: 0.1875rem;
  letter-spacing: 0;
}
.stat-foot {
  margin-top: 0.5625rem;
  font-size: var(--fs-xs);
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-foot .accent { color: var(--accent); font-weight: 600; }
.stat-accent { color: var(--accent) !important; }

/* ---------- 图表卡片（分布 + 走势） ---------- */
.dist-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.125rem 1.375rem 1rem;
  box-shadow: var(--shadow);
  backdrop-filter: blur(0.625rem);
  -webkit-backdrop-filter: blur(0.625rem);
  margin-bottom: 1.25rem;
  position: relative;
  overflow: hidden;
}
.dist-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255, 255, 255, 0.10);
  pointer-events: none;
}
.dist-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.875rem;
  flex-wrap: wrap;
}
.dist-title { font-size: var(--fs-md); font-weight: 700; letter-spacing: -0.01em; }
.dist-note { font-size: var(--fs-xs); color: var(--ink-faint); }
.dist-bar {
  display: flex;
  gap: 0.1875rem;
  height: 0.625rem;
  border-radius: 0.375rem;
  overflow: hidden;
  background: color-mix(in srgb, var(--evg-text-secondary) 10%, transparent);
  pointer-events: none;
}
.seg { height: 100%; min-width: 0.1875rem; }
.seg-A { background: var(--A); }
.seg-B { background: var(--B); }
.seg-C { background: var(--C); }
.seg-D { background: var(--D); }
.seg-F { background: var(--F); }
.dist-legend {
  display: flex;
  gap: 1.125rem;
  flex-wrap: wrap;
  margin-top: 0.75rem;
}
.lg-item {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.78125rem;
  color: var(--ink-soft);
}
.lg-item b { color: var(--ink); font-weight: 700; }
.lg-item em { font-style: normal; color: var(--ink-faint); font-size: 0.72rem; }
.dot { width: 0.5625rem; height: 0.5625rem; border-radius: 50%; display: inline-block; pointer-events: none; }
.dot-A { background: var(--A); }
.dot-B { background: var(--B); }
.dot-C { background: var(--C); }
.dot-D { background: var(--D); }
.dot-F { background: var(--F); }

/* ---------- 折线图（SVG 用 viewBox 坐标，随容器等比缩放） ---------- */
.chart {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
}
.chart-grid { stroke: color-mix(in srgb, var(--evg-text-secondary) 16%, transparent); stroke-width: 1; }
.chart-axis { fill: var(--ink-faint); font-size: 11; text-anchor: end; }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { fill: color-mix(in srgb, var(--evg-accent) 16%, transparent); }
.chart-dot { fill: var(--accent); stroke: rgba(255, 255, 255, 0.92); stroke-width: 1.5; }
.chart-val { fill: var(--ink-soft); font-size: 11.5; font-weight: 600; text-anchor: middle; }
.chart-label { fill: var(--ink-faint); font-size: 11; text-anchor: middle; }

/* ---------- 分节标题 ---------- */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 1rem 0;
  flex-wrap: wrap;
}
.section-head h2 { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.015em; }
.section-count {
  font-size: 0.78125rem;
  color: var(--ink-faint);
  background: color-mix(in srgb, var(--evg-accent) 12%, transparent);
  border: 1px solid var(--line);
  padding: 0.25rem 0.625rem;
  border-radius: 999px;
}
.toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; position: relative; z-index: 6; }

/* ---------- 自定义下拉 ---------- */
.dropdown { position: relative; }
.dd-btn {
  appearance: none;
  -webkit-appearance: none;
  background: color-mix(in srgb, var(--evg-surface) 88%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.75rem;
  font-size: var(--fs-sm);
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  min-height: 2.25rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.dd-btn:hover { border-color: var(--evg-accent-border); }
.dd-btn:focus {
  outline: 2px solid var(--evg-accent-border);
  border-color: var(--evg-accent-border);
}
.dd-arrow { font-size: 0.625rem; color: var(--ink-faint); margin-left: 0.125rem; }
.dd-menu {
  position: absolute;
  top: calc(100% + 0.375rem);
  left: 0;
  z-index: 50;
  min-width: 10.75rem;
  margin: 0;
  padding: 0.3125rem;
  list-style: none;
  background: var(--evg-surface);
  border: 1px solid var(--line);
  border-radius: 0.625rem;
  box-shadow: 0 0.5rem 1.5rem rgba(17, 24, 39, 0.12);
  max-height: 17.5rem;
  overflow: auto;
}
.dd-item {
  padding: 0.5rem 0.75rem;
  font-size: var(--fs-sm);
  color: var(--ink);
  border-radius: 0.4375rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s ease;
}
.dd-item:hover { background: var(--evg-accent-bg); }
.dd-item.is-active {
  color: var(--accent);
  font-weight: 600;
  background: var(--evg-accent-bg);
}

/* ---------- 课程列表（一行一个 · 横向卡片） ---------- */
.course-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.75rem;
}
.course-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1rem 1.5rem 1rem 1.75rem;
  box-shadow: var(--shadow);
  backdrop-filter: blur(0.625rem);
  -webkit-backdrop-filter: blur(0.625rem);
  position: relative;
  overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(10rem, 1fr) auto;
  align-items: center;
  gap: 1.5rem;
}
.course-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--radius-lg);
  border: 1px solid rgba(255, 255, 255, 0.10);
  pointer-events: none;
}
.course-card:hover {
  transform: translateY(-0.125rem);
  box-shadow: var(--shadow-hover);
}
.course-card::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 0.25rem;
  background: linear-gradient(180deg, var(--accent), var(--accent-soft));
  opacity: 0.9;
  pointer-events: none;
}

.course-info { min-width: 0; }
.course-name {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.course-meta { margin-top: 0.375rem; display: flex; align-items: center; gap: 0.5rem; }
.course-term {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--accent);
  background: var(--evg-accent-bg);
  border: 1px solid var(--evg-accent-border);
  padding: 0.125rem 0.5625rem;
  border-radius: 999px;
}

  function renderStats(s) {

    var topScore = s.maxScore !== null ? s.maxScore : '—';
    var html =
      '<div class="stat-card">' +
        '<div class="stat-label">课程门数</div>' +
        '<div class="stat-value">' + s.count + '<span class="unit">门</span></div>' +
        '<div class="stat-foot">总学分 <span class="accent">' + s.totalCredit.toFixed(1) + '</span></div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">加权平均绩点</div>' +
        '<div class="stat-value stat-accent">' + (s.avgGpa !== null ? s.avgGpa.toFixed(2) : '—') + '</div>' +
        '<div class="stat-foot">5 分制 · 按学分加权</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">平均成绩</div>' +
        '<div class="stat-value">' + (s.avgScore !== null ? s.avgScore.toFixed(1) : '—') + '<span class="unit">分</span></div>' +
        '<div class="stat-foot">共 ' + s.scoreCount + ' 次有效成绩</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label">最高成绩</div>' +
        '<div class="stat-value stat-accent">' + topScore + '<span class="unit">分</span></div>' +
        '<div class="stat-foot">' + esc(topName) + '</div>' +
      '</div>';
    document.getElementById('stats').innerHTML = html;
  }

  /* ---------- 渲染：等级分布 ---------- */
  function renderDist(buckets) {
    var el = document.getElementById('dist');
    if (!el) return;
    var total = buckets.A + buckets.B + buckets.C + buckets.D + buckets.F;
    if (total === 0) { hide(el); return; }
    var meta = [
      { k: 'A', label: '优秀', cls: 'A' },
      { k: 'B', label: '良好', cls: 'B' },
      { k: 'C', label: '中等', cls: 'C' },
      { k: 'D', label: '及格', cls: 'D' },
      { k: 'F', label: '不及格', cls: 'F' }
    ];
    var segs = '', legend = '';
    meta.forEach(function (m) {
      var n = buckets[m.k] || 0;
      segs += '<span class="seg seg-' + m.cls + '" style="flex:' + Math.max(n, 0.01) + '"></span>';
      legend += '<span class="lg-item"><i class="dot dot-' + m.cls + '"></i>' + m.label +
        ' <b>' + n + '</b><em>' + (total > 0 ? Math.round(n / total * 100) + '%' : '—') + '</em></span>';
    });
    el.innerHTML =
      '<div class="dist-top">' +
        '<span class="dist-title">成绩等级分布</span>' +
        '<span class="dist-note">共 ' + total + ' 门 · 按课程成绩分档</span>' +
      '</div>' +
      '<div class="dist-bar">' + segs + '</div>' +
      '<div class="dist-legend">' + legend + '</div>';
    show(el);
  }

  /* ---------- 渲染：学期绩点走势 ---------- */
  function buildTrend(items) {
    var map = {};
    items.forEach(function (it) {
      var g5 = gpa5Of(it);
      if (g5 === null) return;
      var credit = toNum(it.xf) || 0;
      var t = termOf(it);
      if (!map[t]) map[t] = { credit: 0, w: 0, n: 0 };
      map[t].credit += credit;
      map[t].w += g5 * credit;
      map[t].n++;
    });
    var terms = Object.keys(map);
    terms.sort(function (a, b) {
      var ka = termRank(a), kb = termRank(b);
      if (ka >= 0 && kb >= 0) return ka - kb;
      if (ka < 0) return 1;
      if (kb < 0) return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    return terms.map(function (t) {
      var m = map[t];
      return { term: t, gpa5: m.credit > 0 ? m.w / m.credit : null, n: m.n };
    }).filter(function (x) { return x.gpa5 !== null; });
  }

  function renderTrend(series) {
    var el = document.getElementById('trend');
    if (!el) return;
    if (series.length === 0) { hide(el); return; }

    var W = 1100, H = 250, padL = 46, padR = 24, padT = 30, padB = 42;
    var cw = W - padL - padR, ch = H - padT - padB;
    var yMin = 0, yMax = 5;

    function X(i) {
      if (series.length === 1) return padL + cw / 2;
      return padL + (cw * i) / (series.length - 1);
    }
    function Y(v) { return padT + ch * (1 - (v - yMin) / (yMax - yMin)); }

    var grid = '';
    for (var g = 0; g <= 5; g++) {
      var gy = Y(g);
      grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" class="chart-grid"></line>' +
              '<text x="' + (padL - 8) + '" y="' + (gy + 4).toFixed(1) + '" class="chart-axis">' + g + '</text>';
    }

    var pts = series.map(function (s, i) {
      return X(i).toFixed(1) + ',' + Y(s.gpa5).toFixed(1);
    });

    var chart = '';
    if (pts.length >= 2) {
      chart += '<polygon class="chart-area" points="' + padL + ',' + Y(0).toFixed(1) + ' ' + pts.join(' ') + ' ' + X(series.length - 1).toFixed(1) + ',' + Y(0).toFixed(1) + '"></polygon>';
      chart += '<polyline class="chart-line" points="' + pts.join(' ') + '"></polyline>';
    }
    series.forEach(function (s, i) {
      var cx = X(i).toFixed(1), cy = Y(s.gpa5).toFixed(1);
      chart += '<circle cx="' + cx + '" cy="' + cy + '" r="4.5" class="chart-dot"></circle>' +
               '<text x="' + cx + '" y="' + (Y(s.gpa5) - 10).toFixed(1) + '" class="chart-val">' + s.gpa5.toFixed(2) + '</text>' +
               '<text x="' + cx + '" y="' + (H - padB + 18) + '" class="chart-label">' + esc(shortTerm(s.term)) + '</text>';
    });

    el.innerHTML =
      '<div class="dist-top">' +
        '<span class="dist-title">学期绩点走势</span>' +
        '<span class="dist-note">各学期加权平均绩点 · 5 分制</span>' +
      '</div>' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="学期绩点走势折线图">' +
        grid + chart +
      '</svg>';
    show(el);
  }

  /* ---------- 渲染：课程列表（一行一个 · 横向卡片） ---------- */
  function renderCourses(items) {
    var grid = document.getElementById('course-grid');
    var count = document.getElementById('course-count');
    if (count) count.textContent = items.length + ' 门课程';

    var empty = document.getElementById('empty');
    if (items.length === 0) {
      grid.innerHTML = '';
      show(empty);
      return;
    }
    hide(empty);

    var html = items.map(function (it) {
      var name = it.kcmc || '未命名课程';
      var score = toNum(it.cj);
      var gpa = toNum(it.jd);
      var credit = toNum(it.xf);
      var term = termOf(it);

      var badge, scoreHtml, barHtml;
      if (score !== null) {
        var g = gradeOf(score);
        badge = '<span class="grade-badge grade-' + g.cls + '">' + g.label + '</span>';
        scoreHtml = '<div class="course-score">' + Math.round(score) + '<span class="unit">分</span></div>';
        barHtml = '<div class="score-bar-track"><div class="score-bar bar-' + g.cls + '" style="width:' + barWidth(score) + '"></div></div>';
      } else {
        badge = '<span class="grade-badge grade-F">暂无</span>';
        scoreHtml = '<div class="course-score muted">—</div>';
        barHtml = '<div class="score-bar-track dim"></div>';
      }

      return '' +
        '<div class="course-card">' +
          '<div class="course-info">' +
            '<div class="course-name">' + esc(name) + '</div>' +
            '<div class="course-meta"><span class="course-term">' + esc(term) + '</span></div>' +
          '</div>' +
          '<div class="course-score-wrap">' +
            scoreHtml +
            barHtml +
          '</div>' +
          '<div class="course-side">' +
            badge +
            '<div class="course-side-meta">' +
              '<div class="course-gpa">绩点 <b>' + (gpa !== null ? gpa.toFixed(1) : '—') + '</b></div>' +
              '<div class="course-credit">学分 <b>' + (credit !== null ? credit.toFixed(1) : '—') + '</b></div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    grid.innerHTML = html;
  }

  /* ---------- 汇总视图 ---------- */
  function getVisible() {
    var list = allItems;
    if (termFilter !== 'all') {
      list = list.filter(function (it) { return termOf(it) === termFilter; });
    }
    return sortItems(list, sortMode);
  }

  function renderAll() {
    var visible = getVisible();
    var stats = buildStats(visible);
    renderStats(stats);
    renderDist(stats.buckets);
    renderCourses(visible);
  }

  function renderEmpty() {
    document.getElementById('stats').innerHTML =
      '<div class="stat-card">' +
        '<div class="stat-label">课程门数</div>' +
        '<div class="stat-value">0<span class="unit">门</span></div>' +
        '<div class="stat-foot">暂无数据</div>' +
      '</div>';
    hide(document.getElementById('dist'));
    hide(document.getElementById('trend'));
    renderCourses([]);
  }

  /* ================= AI 学业分析 ================= */

  // 学科分类（启发式关键词匹配）
  var CATS = [
    { name: '数理基础', keys: ['微积分', '线性代数', '高等数学', '数学', '概率', '统计', '物理', '化学', '力学', '电磁', '光学', '热学', '代数', '生物'] },
    { name: '计算机', keys: ['程序', 'C语言', 'C++', 'Java', 'Python', '数据结构', '算法', '计算机', '软件', '网络', '人工智能', '机器学习', '数据库'] },
    { name: '语言外语', keys: ['英语', '外语', '日语', '德语', '法语', '西班牙语', '写作', '语文', '阅读'] },
    { name: '人文社科', keys: ['心理', '哲学', '历史', '社会', '政治', '经济', '管理', '法律', '文学', '音乐', '小提琴', '艺术', '美术', '体育', '形势与政策', '思修', '军事', '伦理'] },
    { name: '工程实践', keys: ['实验', '工程', '设计', '实践', '制造', '电路', '电子', '机械'] }
  ];

  function catOf(name) {
    var s = String(name || '');
    for (var i = 0; i < CATS.length; i++) {
      for (var k = 0; k < CATS[i].keys.length; k++) {
        if (s.indexOf(CATS[i].keys[k]) !== -1) return CATS[i].name;
      }
    }
    return '其他';
  }

  // 学期绩点序列 + 趋势方向
  function analyzeTrend(items) {
    var map = {};
    items.forEach(function (it) {
      var g = gpa5Of(it);
      if (g === null) return;
      var c = toNum(it.xf) || 0;
      var t = termOf(it);
      if (!map[t]) map[t] = { w: 0, c: 0 };
      map[t].w += g * c;
      map[t].c += c;
    });
    var terms = Object.keys(map);
    terms.sort(function (a, b) {
      var ka = termRank(a), kb = termRank(b);
      if (ka >= 0 && kb >= 0) return ka - kb;
      if (ka < 0) return 1;
      if (kb < 0) return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
    var pts = terms.map(function (t) {
      return { term: t, gpa: map[t].c > 0 ? map[t].w / map[t].c : null };
    }).filter(function (p) { return p.gpa !== null; });

    var dir = 'flat';
    if (pts.length >= 2) {
      var mid = Math.floor(pts.length / 2);
      var avg = function (arr) {
        var s = 0;
        arr.forEach(function (p) { s += p.gpa; });
        return s / arr.length;
      };
      var d = avg(pts.slice(mid)) - avg(pts.slice(0, mid));
      if (d > 0.05) dir = 'up';
      else if (d < -0.05) dir = 'down';
    }
    return { dir: dir, pts: pts };
  }

  function buildSuggestions(ctx) {
    var s = [];
    var w = ctx.weaknesses[0];
    if (w) {
      s.push('重点复盘「' + w.name + '」（' + Math.round(w.score) + ' 分）' + (w.major ? '，作为主修课程' : '') + '，建议整理错题、预约答疑，避免影响后续高阶课程。');
    }
    var weakCat = null;
    for (var i = ctx.cats.length - 1; i >= 0; i--) {
      if (ctx.cats[i].n >= 2 && (ctx.avgScore === null || ctx.cats[i].avg < ctx.avgScore - 2)) {
        weakCat = ctx.cats[i];
        break;
      }
    }
    if (weakCat) {
      s.push('「' + weakCat.name + '」类课程平均 ' + weakCat.avg.toFixed(1) + ' 分，低于整体平均，建议针对该方向增加练习量或调整学习方法。');
    }
    if (ctx.trend.dir === 'down' && ctx.trend.pts.length >= 2) {
      var p = ctx.trend.pts;
      s.push('学期绩点由 ' + shortTerm(p[0].term) + ' 的 ' + p[0].gpa.toFixed(2) + ' 降至 ' + p[p.length - 1].gpa.toFixed(2) + '，建议适当控制单学期学分，聚焦核心课程攻坚。');
    } else if (ctx.trend.dir === 'up') {
      var q = ctx.trend.pts;
      s.push('学期绩点呈上升趋势（' + q[0].gpa.toFixed(2) + ' → ' + q[q.length - 1].gpa.toFixed(2) + '），节奏良好，可在有余力时挑战高阶课程或科研训练。');
    }
    var majorRatio = ctx.totalCredit > 0 ? ctx.majorCredit / ctx.totalCredit : null;
    if (majorRatio !== null && majorRatio < 0.4 && ctx.totalCredit > 0) {
      s.push('主修课程学分占比仅 ' + Math.round(majorRatio * 100) + '%，后续选课可向专业核心课程倾斜，夯实专业基础。');
    }
    if (s.length < 2 && ctx.avgGpa !== null && ctx.avgGpa >= 4.0) {
      s.push('整体成绩亮眼，可尝试学科竞赛、科研训练等拓展性活动，把学业优势转化为竞争力。');
    }
    if (s.length === 0) {
      s.push('整体学业表现平稳，保持现有节奏，并为下一学期制定明确的目标课程计划。');
    }
    return s.slice(0, 4);
  }

  function analyze(items) {
    var totalCredit = 0, w5 = 0, c5 = 0, scoreSum = 0, scoreCount = 0, majorCredit = 0;
    var maxS = -Infinity, maxC = null, minS = Infinity, minC = null;
    var catStats = {};

    items.forEach(function (it) {
      var s = toNum(it.cj);
      var c = toNum(it.xf) || 0;
      var g = gpa5Of(it);
      totalCredit += c;
      if (it.major) majorCredit += c;
      if (g !== null) { w5 += g * c; c5 += c; }
      if (s !== null) {
        scoreSum += s;
        scoreCount++;
        if (s > maxS) { maxS = s; maxC = it; }
        if (s < minS) { minS = s; minC = it; }
      }
      var cat = catOf(it.kcmc);
      if (!catStats[cat]) catStats[cat] = { w: 0, c: 0, n: 0 };
      if (s !== null) {
        catStats[cat].w += s * (c || 1);
        catStats[cat].c += (c || 1);
        catStats[cat].n++;
      }
    });

    var avgGpa = c5 > 0 ? w5 / c5 : null;
    var avgScore = scoreCount > 0 ? scoreSum / scoreCount : null;

    var level, lvCls;
    if (avgGpa !== null && avgGpa >= 4.5) { level = '顶尖'; lvCls = 'vA'; }
    else if (avgGpa !== null && avgGpa >= 4.0) { level = '优秀'; lvCls = 'vA'; }
    else if (avgGpa !== null && avgGpa >= 3.5) { level = '良好'; lvCls = 'vB'; }
    else if (avgGpa !== null && avgGpa >= 3.0) { level = '中等'; lvCls = 'vC'; }
    else { level = '基础待夯实'; lvCls = 'vD'; }

    // 优势 / 待提升
    var scored = items.filter(function (it) { return toNum(it.cj) !== null; })
      .map(function (it) {
        return { name: it.kcmc || '未命名课程', score: toNum(it.cj), major: !!it.major };
      })
      .sort(function (a, b) { return b.score - a.score; });
    var strengths = scored.slice(0, 3);

    var weaknesses = [];
    var weakCut = avgScore !== null ? avgScore - 1 : 80;
    for (var i = scored.length - 1; i >= 0; i--) {
      if (weaknesses.length >= 3) break;
      if (scored[i].score <= weakCut) weaknesses.push(scored[i]);
    }
    if (weaknesses.length === 0 && scored.length) weaknesses.push(scored[scored.length - 1]);

    // 学科结构
    var cats = Object.keys(catStats).map(function (k) {
      var st = catStats[k];
      return { name: k, avg: st.c > 0 ? st.w / st.c : null, n: st.n };
    }).filter(function (c) { return c.avg !== null && c.n >= 1; })
      .sort(function (a, b) { return b.avg - a.avg; });

    var trend = analyzeTrend(items);

    return {
      n: items.length,
      avgGpa: avgGpa,
      avgScore: avgScore,
      maxC: maxC, maxS: maxS, minC: minC, minS: minS,
      majorCredit: majorCredit,
      totalCredit: totalCredit,
      level: level, lvCls: lvCls,
      strengths: strengths,
      weaknesses: weaknesses,
      cats: cats,
      trend: trend,
      suggestions: buildSuggestions({
        weaknesses: weaknesses, cats: cats, trend: trend,
        avgScore: avgScore, avgGpa: avgGpa,
        majorCredit: majorCredit, totalCredit: totalCredit
      })
    };
  }

  function renderAnalysis(r) {
    var el = document.getElementById('ai-body');
    if (!el) return;
    var html = '';

    // 总评
    var verdict = '综合 ' + r.n + ' 门课程，加权绩点 <b>' +
      (r.avgGpa !== null ? r.avgGpa.toFixed(2) : '—') + '</b>（5 分制），平均分 <b>' +
      (r.avgScore !== null ? r.avgScore.toFixed(1) : '—') + '</b>。';
    if (r.maxC && r.minC && r.maxS !== -Infinity && r.minS !== Infinity) {
      verdict += '最高 <b>' + Math.round(r.maxS) + '</b> 分（' + esc(r.maxC.kcmc) + '），最低 <b>' + Math.round(r.minS) + '</b> 分（' + esc(r.minC.kcmc) + '）。';
    }
    html += '<div class="ai-verdict" style="animation-delay:0.02s">' +
      '<span class="ai-v-badge ' + r.lvCls + '">学业评定 · ' + r.level + '</span>' +
      '<p class="ai-v-text">' + verdict + '</p>' +
    '</div>';

    // 优势 / 待提升
    var strengthHtml = r.strengths.map(function (x, i) {
      return '<div class="ai-chip up" style="animation-delay:' + (0.08 + i * 0.05).toFixed(2) + 's">' +
        '<span class="ai-chip-name">' + esc(x.name) + '</span>' +
        '<span class="ai-chip-val">' + Math.round(x.score) + ' 分</span></div>';
    }).join('');
    if (!strengthHtml) strengthHtml = '<div class="ai-chip"><span class="ai-chip-name">暂无成绩记录</span></div>';

    var weakHtml = r.weaknesses.map(function (x, i) {
      return '<div class="ai-chip down" style="animation-delay:' + (0.08 + i * 0.05).toFixed(2) + 's">' +
        '<span class="ai-chip-name">' + esc(x.name) + '</span>' +
        '<span class="ai-chip-val">' + Math.round(x.score) + ' 分</span></div>';
    }).join('');
    if (!weakHtml) weakHtml = '<div class="ai-chip"><span class="ai-chip-name">无明显短板，表现均衡</span></div>';

    html += '<div class="ai-grid">' +
      '<div class="ai-box" style="animation-delay:0.1s"><div class="ai-box-title">💪 优势科目</div><div class="ai-chips">' + strengthHtml + '</div></div>' +
      '<div class="ai-box" style="animation-delay:0.16s"><div class="ai-box-title">🎯 待提升</div><div class="ai-chips">' + weakHtml + '</div></div>' +
    '</div>';

    // 学期走势 / 学科结构
    var trendHtml = '';
    if (r.trend.pts.length > 0) {
      trendHtml = '<div class="ai-bars">' + r.trend.pts.map(function (p) {
        var w = Math.max(6, Math.round((p.gpa / 5) * 100)) + '%';
        return '<div class="ai-bar-row">' +
          '<span class="ai-bar-label">' + esc(shortTerm(p.term)) + '</span>' +
          '<span class="ai-bar-track"><span class="ai-bar-fill" style="width:' + w + '"></span></span>' +
          '<span class="ai-bar-val">' + p.gpa.toFixed(2) + '</span></div>';
      }).join('') + '</div>';
    } else {
      trendHtml = '<div class="ai-chip"><span class="ai-chip-name">暂无学期数据</span></div>';
    }

    var catHtml = '';
    if (r.cats.length > 0) {
      var maxAvg = r.cats[0].avg || 1;
      catHtml = '<div class="ai-bars">' + r.cats.slice(0, 4).map(function (c) {
        var w = Math.max(8, Math.round((c.avg / maxAvg) * 100)) + '%';
        return '<div class="ai-bar-row">' +
          '<span class="ai-bar-label">' + esc(c.name) + '</span>' +
          '<span class="ai-bar-track"><span class="ai-bar-fill" style="width:' + w + '"></span></span>' +
          '<span class="ai-bar-val">' + c.avg.toFixed(1) + '</span></div>';
      }).join('') + '</div>';
    } else {
      catHtml = '<div class="ai-chip"><span class="ai-chip-name">暂无分类数据</span></div>';
    }

    html += '<div class="ai-grid">' +
      '<div class="ai-box" style="animation-delay:0.22s"><div class="ai-box-title">📈 学期走势</div>' + trendHtml + '</div>' +
      '<div class="ai-box" style="animation-delay:0.28s"><div class="ai-box-title">🗂️ 学科结构</div>' + catHtml + '</div>' +
    '</div>';

    // 建议
    var sugHtml = '<ol>' + r.suggestions.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>';
    html += '<div class="ai-suggest" style="animation-delay:0.34s"><div class="ai-box-title">💡 学习建议</div>' + sugHtml + '</div>';

    el.innerHTML = html;
    show(el); // 确保 AI 结果区域可见（修复 hidden 类冲突）
  }

  function runAI() {
    var btn = document.getElementById('ai-btn');
    var body = document.getElementById('ai-body');
    if (!btn || !body || allItems.length === 0) return;
    if (btn.getAttribute('data-busy') === '1') return;

    var label = btn.querySelector('.ai-btn-label');
    btn.setAttribute('data-busy', '1');
    btn.disabled = true;
    label.textContent = 'AI 分析中…';
    show(body);
    body.innerHTML =
      '<div class="ai-thinking">' +
        '<span class="ai-thinking-icon">✦</span>' +
        '<p>正在读取成绩数据并生成洞察报告…</p>' +
        '<div class="ai-dots"><i></i><i></i><i></i></div>' +
      '</div>';

    // 本地智能引擎即时计算，延时仅用于呈现"分析中"状态
    setTimeout(function () {
      renderAnalysis(analyze(allItems));
      label.textContent = '重新分析';
      btn.disabled = false;
      btn.setAttribute('data-busy', '0');
    }, 900);
  }

  /* ---------- 初始化 ---------- */
  function init() {
    document.getElementById('stats').innerHTML = skeletonStats();
    document.getElementById('course-grid').innerHTML = skeletonCards();

    var aiBtn = document.getElementById('ai-btn');
    if (aiBtn) aiBtn.addEventListener('click', runAI);

    setupDropdown('sort-btn', 'sort-menu', function (v) {
      sortMode = v;
      renderAll();
    });
    setupDropdown('term-btn', 'term-menu', function (v) {
      termFilter = v;
      renderAll();
    });

    // 数据源结构：{ grades: [...] } — 修正字段名与数据源名
    platform.data.get(SOURCE).then(function (d) {
      allItems = (d && Array.isArray(d.grades)) ? d.grades :
                 (d && Array.isArray(d.items)) ? d.items : [];
      if (allItems.length === 0) {
        renderEmpty();
        if (aiBtn) {
          aiBtn.disabled = true;
          var l = aiBtn.querySelector('.ai-btn-label');
          if (l) l.textContent = '暂无数据可分析';
        }
        return;
      }
      populateTermMenu(allItems);
      renderAll();
      renderTrend(buildTrend(allItems));
      // 数据就绪后自动生成一次 AI 分析，结果立即可见
      runAI();
    }).catch(function (e) {
      document.getElementById('stats').innerHTML =
        '<div class="error-card">' +
          '<div class="error-title">⚠️ 数据加载失败</div>' +
          '<div class="error-msg">' + esc(e && e.message ? e.message : String(e)) + '</div>' +
        '</div>';
      document.getElementById('course-grid').innerHTML = '';
      if (aiBtn) {
        aiBtn.disabled = true;
        var l = aiBtn.querySelector('.ai-btn-label');
        if (l) l.textContent = '数据加载失败';
      }
    });
  }

  init();
})();

</script>
</body></html>
