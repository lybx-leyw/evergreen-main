<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学在浙大自动签到</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: var(--evg-background);
  --ink: var(--evg-text);
  --ink-soft: var(--evg-text-secondary);
  --ink-faint: color-mix(in srgb, var(--evg-text-secondary) 55%, transparent);
  --accent: var(--evg-accent);
  --accent-soft: var(--evg-accent-bg, color-mix(in srgb, var(--evg-accent) 14%, transparent));
  --card: var(--evg-surface);
  --line: var(--evg-border);
  --error: var(--evg-error);
  --ok: #52b788;
  --warn: #d9a441;
  --fs-xs: 0.75rem; --fs-sm: 0.8125rem; --fs-md: 0.875rem; --fs-lg: 1.0625rem; --fs-xl: 1.375rem;
  --radius: 0.875rem;
  --shadow: 0 0.5rem 1.25rem rgba(0,0,0,0.18);
}
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  background:
    radial-gradient(48rem 22rem at 90% -10%, var(--accent-soft), transparent 60%),
    linear-gradient(160deg, var(--bg), color-mix(in srgb, var(--bg) 82%, var(--accent)));
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--ink);
  font-size: var(--fs-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.topbar {
  background: color-mix(in srgb, var(--evg-surface) 70%, transparent);
  backdrop-filter: blur(0.875rem);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 56rem; margin: 0 auto; padding: 1.1rem 1.5rem;
  display: flex; align-items: center; gap: 0.8rem;
}
.brand-mark {
  width: 2.6rem; height: 2.6rem; border-radius: 0.75rem;
  background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--bg)));
  color: var(--evg-text);
  font-size: 1.2rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 0.3rem 0.7rem color-mix(in srgb, var(--accent) 35%, transparent);
}
.brand h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--ink-faint); margin-top: 0.15rem; }
.container { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.1rem 1.3rem;
  margin-bottom: 1rem;
}
.hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.hero-left { min-width: 0; }
.status-pill {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-size: var(--fs-sm); font-weight: 700;
  padding: 0.3rem 0.85rem; border-radius: 999px;
  border: 1px solid transparent;
}
.pill-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: currentColor; }
.st-running { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.st-paused  { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.st-off     { color: var(--ink-faint); background: color-mix(in srgb, var(--ink-faint) 12%, transparent); border-color: var(--line); }
.st-error   { color: var(--error); background: color-mix(in srgb, var(--error) 12%, transparent); border-color: color-mix(in srgb, var(--error) 35%, transparent); }
.hero-title { font-size: var(--fs-lg); font-weight: 700; margin-top: 0.55rem; }
.hero-sub { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 0.25rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: 0.7rem; margin-top: 1rem; }
.metric {
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  border: 1px solid var(--line);
  border-radius: 0.65rem; padding: 0.6rem 0.8rem;
}
.metric .k { font-size: var(--fs-xs); color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.metric .v { font-size: 1.02rem; font-weight: 700; margin-top: 0.15rem; word-break: break-all; }
.metric .v.ok { color: var(--ok); }
.metric .v.warn { color: var(--warn); }

.error-box {
  display: none;
  background: color-mix(in srgb, var(--error) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--error) 32%, transparent);
  border-radius: 0.7rem;
  padding: 0.7rem 0.9rem;
  margin-top: 0.85rem;
  font-size: var(--fs-sm);
  color: var(--error);
  word-break: break-all;
}

.controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; border: none; cursor: pointer; font-family: inherit;
  font-size: var(--fs-sm); font-weight: 600;
  color: var(--evg-text);
  background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 78%, var(--bg)));
  border-radius: 999px; padding: 0.55rem 1.1rem;
  display: inline-flex; align-items: center; gap: 0.4rem;
  box-shadow: 0 0.3rem 0.7rem color-mix(in srgb, var(--accent) 32%, transparent), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}
.btn:hover { transform: translateY(-0.08rem); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.55; cursor: default; transform: none; }
.btn.ghost {
  background: color-mix(in srgb, var(--evg-surface) 85%, transparent);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.ghost:hover { border-color: var(--accent); }
select {
  appearance: none; -webkit-appearance: none;
  background: color-mix(in srgb, var(--evg-surface) 88%, transparent);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0.5rem 2rem 0.5rem 0.9rem;
  font-family: inherit; font-size: var(--fs-sm); color: var(--ink);
  cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
    linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
  background-position: calc(100% - 1rem) 55%, calc(100% - 0.72rem) 55%;
  background-size: 0.28rem 0.28rem; background-repeat: no-repeat;
}
select:focus { outline: 2px solid var(--evg-accent-border, var(--accent)); }

.section-title { font-size: var(--fs-md); font-weight: 700; margin-bottom: 0.65rem; display: flex; align-items: center; gap: 0.4rem; }
.history { list-style: none; }
.history li {
  display: flex; align-items: flex-start; gap: 0.6rem;
  padding: 0.55rem 0.1rem;
  border-bottom: 1px dashed color-mix(in srgb, var(--line) 70%, transparent);
  font-size: var(--fs-sm);
}
.history li:last-child { border-bottom: none; }
.h-flag { flex-shrink: 0; font-size: var(--fs-xs); font-weight: 700; padding: 0.12rem 0.55rem; border-radius: 999px; margin-top: 0.05rem; }
.h-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.h-fail { color: var(--error); background: color-mix(in srgb, var(--error) 12%, transparent); }
.h-info { color: var(--ink-faint); background: color-mix(in srgb, var(--ink-faint) 12%, transparent); }
.h-body { min-width: 0; color: var(--ink-soft); }
.h-body b { color: var(--ink); font-weight: 600; }
.h-time { flex-shrink: 0; margin-left: auto; font-size: var(--fs-xs); color: var(--ink-faint); }

.hint { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.7; }
.hint code {
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  border: 1px solid var(--line); border-radius: 0.3rem;
  padding: 0.05rem 0.35rem; font-size: 0.78rem; color: var(--accent);
}
.empty { text-align: center; padding: 1.6rem 0 0.8rem; color: var(--ink-faint); font-size: var(--fs-sm); }
.footer { text-align: center; padding: 1rem 0 1.5rem; color: var(--ink-faint); font-size: var(--fs-xs); }
.skeleton { height: 0.9rem; border-radius: 0.4rem; margin-bottom: 0.5rem;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ink-faint) 8%, transparent), color-mix(in srgb, var(--ink-faint) 18%, transparent), color-mix(in srgb, var(--ink-faint) 8%, transparent));
  background-size: 200% 100%; animation: shimmer 1.3s infinite linear; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@media (max-width: 40rem) { .container { padding: 1.1rem 0.9rem 2.5rem; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark">签</div>
    <div class="brand">
      <h1>学在浙大自动签到</h1>
      <div class="brand-sub">雷达点名 · 数字点名 · 钉钉通知</div>
    </div>
  </div>
</header>

<main class="container">

  <section class="card hero">
    <div class="hero-left">
      <span class="status-pill st-off" id="pill"><span class="pill-dot"></span><span id="pill-text">加载中…</span></span>
      <div class="hero-title" id="hero-title">正在读取状态…</div>
      <div class="hero-sub" id="hero-sub">首次加载需要几秒钟</div>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="btn-checkin" disabled>⚡ 立即签到</button>
      <button type="button" class="btn ghost" id="btn-toggle" disabled>暂停监控</button>
    </div>
    <div class="error-box" id="error-box"></div>
  </section>

  <section class="card">
    <div class="grid" id="metrics">
      <div class="metric"><div class="k">最近检查</div><div class="v" id="m-checked">—</div></div>
      <div class="metric"><div class="k">轮询间隔</div><div class="v" id="m-interval">—</div></div>
      <div class="metric"><div class="k">雷达地点</div><div class="v" id="m-location">—</div></div>
      <div class="metric"><div class="k">累计轮询</div><div class="v" id="m-polls">—</div></div>
    </div>
    <div class="controls" style="margin-top:0.9rem">
      <label style="font-size:var(--fs-sm);color:var(--ink-soft)">雷达签到地点</label>
      <select id="loc-select" disabled></select>
    </div>
  </section>

  <section class="card">
    <div class="section-title">📋 最近记录</div>
    <ul class="history" id="history">
      <li><div class="skeleton" style="width:100%"></div></li>
    </ul>
  </section>

  <section class="card">
    <div class="section-title">💡 使用说明</div>
    <div class="hint" id="setup-hint"></div>
  </section>

</main>

<footer class="footer">Powered by Evergreen · 学在浙大自动签到 · worker 常驻监控</footer>

<script>
(function () {
  'use strict';
  var WORKER = 'autosign-worker';
  var LOCATIONS = {
    ZJGD1: '紫金港 · 东一教学楼', ZJGX1: '紫金港 · 西教学楼', ZJGB1: '紫金港 · 段永平教学楼',
    ZJG4: '紫金港 · 大西区', YQ4: '玉泉 · 教四', YQ1: '玉泉 · 教一', YQ7: '玉泉 · 教七',
    YQSS: '玉泉 · 宿舍区', ZJ1: '之江校区 1', ZJ2: '之江校区 2', HJC1: '华家池校区 1', HJC2: '华家池校区 2'
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function setPill(cls, text) {
    var pill = $('pill');
    pill.className = 'status-pill ' + cls;
    $('pill-text').textContent = text;
  }

  function render(payload) {
    var d = (payload && payload.data) ? payload.data : payload;
    if (!d || typeof d !== 'object') return;

    // 状态
    if (d.error) {
      setPill('st-error', '异常');
      $('hero-title').textContent = '监控遇到问题';
      $('hero-sub').textContent = '请检查下方错误信息与设置';
      $('error-box').style.display = 'block';
      $('error-box').textContent = d.error;
    } else if (d.running === true) {
      setPill('st-running', '运行中');
      $('hero-title').textContent = '监控运行中，发现点名将自动应答';
      $('hero-sub').textContent = d.enabled === false
        ? '注意：当前「自动签到开关」已关闭，仅检查不应答'
        : '最近检查 ' + (d.checkedAt || d.lastPoll || '—');
      $('error-box').style.display = 'none';
    } else if (d.enabled === false) {
      setPill('st-paused', '已暂停');
      $('hero-title').textContent = '自动签到已暂停';
      $('hero-sub').textContent = '点击「恢复监控」继续自动应答点名';
      $('error-box').style.display = 'none';
    } else {
      setPill('st-off', '未运行');
      $('hero-title').textContent = '后台监控进程未运行';
      $('hero-sub').textContent = '点击「立即签到」拉起 worker 并执行一轮检查';
      $('error-box').style.display = 'none';
    }

    // 指标
    $('m-checked').textContent = esc(d.checkedAt || d.lastPoll || '—');
    $('m-interval').textContent = d.interval ? d.interval + ' 秒' : '—';
    $('m-location').textContent = esc(LOCATIONS[d.location] || d.location || '—');
    $('m-polls').textContent = d.pollCount || 0;

    // 按钮
    $('btn-checkin').disabled = false;
    var t = $('btn-toggle');
    t.disabled = false;
    t.textContent = d.enabled === false ? '▶ 恢复监控' : '⏸ 暂停监控';

    // 地点下拉
    var sel = $('loc-select');
    sel.disabled = false;
    if (sel.options.length === 0) {
      var keys = Object.keys(LOCATIONS);
      for (var i = 0; i < keys.length; i++) {
        var opt = document.createElement('option');
        opt.value = keys[i];
        opt.textContent = LOCATIONS[keys[i]];
        sel.appendChild(opt);
      }
    }
    sel.value = d.location && LOCATIONS[d.location] ? d.location : sel.value;

    // 历史
    var hist = (d.history && d.history.length) ? d.history : (d.events || []);
    var ul = $('history');
    if (!hist.length) {
      ul.innerHTML = '<div class="empty">暂无签到记录 —— 有新的课堂点名时这里会实时更新</div>';
      return;
    }
    ul.innerHTML = hist.slice().reverse().map(function (h) {
      var flag, body;
      if (typeof h === 'string') {
        flag = '<span class="h-flag h-info">事件</span>';
        body = '<span>' + esc(h) + '</span>';
        return '<li>' + flag + '<div class="h-body">' + body + '</div></li>';
      }
      if (h.ok) { flag = '<span class="h-flag h-ok">已签到</span>'; }
      else if (h.type === 'unknown') { flag = '<span class="h-flag h-info">跳过</span>'; }
      else { flag = '<span class="h-flag h-fail">失败</span>'; }
      var label = (h.type === 'radar' ? '雷达点名' : h.type === 'number' ? '数字点名' : '点名') +
        ' #' + (h.rid != null ? h.rid : '?');
      var detail = h.detail ? ' · <span style="color:var(--ink-faint)">' + esc(h.detail) + '</span>' : '';
      body = '<b>' + esc(label) + '</b> 《' + esc(h.course || '') + '》 ' + esc(h.title || '') + detail;
      return '<li>' + flag + '<div class="h-body">' + body + '</div>' +
        '<span class="h-time">' + esc(h.at || '') + '</span></li>';
    }).join('');
  }

  function showWorkerError(e) {
    setPill('st-error', '不可用');
    $('hero-title').textContent = '后台 worker 未就绪';
    $('hero-sub').textContent = '无法启动常驻监控进程';
    $('error-box').style.display = 'block';
    $('error-box').textContent = '错误：' + esc(e && e.message ? e.message : String(e)) +
      '。请确认插件已安装到 plugins/ 目录、Python 可用，并已重启 Evergreen。';
  }

  function buildHint() {
    $('setup-hint').innerHTML =
      '1. 在 <b>设置</b> 面板配置内置项：<code>ZJU_USERNAME</code>（学号）与 <code>ZJU_PASSWORD</code>（统一认证密码）——凭证只存本地，脚本通过三级降级读取，绝不硬编码。<br>' +
      '2. 可选：配置 <code>DINGTALK_WEBHOOK</code>（+ <code>DINGTALK_SECRET</code> 加签），签到成功/失败实时推送钉钉。<br>' +
      '3. 插件设置项：<code>AUTOSIGN_RADAR_LOCATION</code>（雷达地点，默认紫金港东一）、<code>AUTOSIGN_POLL_INTERVAL</code>（轮询间隔）、<code>AUTOSIGN_ENABLED</code>（总开关）。<br>' +
      '4. 打开本页即自动拉起后台监控进程（worker 常驻 stdio 后端）；状态实时推送到页面，「立即签到」可随时触发一轮即时检查。';
  }

  function handleWorkerLine(payload) {
    // process:output 事件：每行是一条 JSON（state/event/notice）。
    if (!payload || !payload.line) return;
    var line = String(payload.line);
    var msg;
    try { msg = JSON.parse(line); } catch (e) { return; }
    if (!msg || typeof msg !== 'object') return;

    if (msg.type === 'state') {
      render({ data: msg.data });
    } else if (msg.type === 'event') {
      // 签到事件：追加到历史，并刷新状态
      render({ data: msg.data });
      platform.process.write(WORKER, 'status\n').catch(function () {});
    } else if (msg.type === 'notice') {
      $('hero-sub').textContent = String(msg.data || '');
    }
  }

  function startWorker() {
    // 主动拉起常驻 worker（stdio 后端进程）。
    if (!platform.process || !platform.process.start) {
      showWorkerError({ message: '当前 Evergreen 版本不支持常驻进程（platform.process）' });
      return;
    }
    platform.process.start(WORKER, {}).then(function () {
      setPill('st-running', '运行中');
      $('hero-sub').textContent = '后台监控进程已启动';
      $('btn-checkin').disabled = false;
      // 主动查询一次状态
      platform.process.write(WORKER, 'status\n').catch(function () {});
    }).catch(function (e) {
      showWorkerError(e);
    });
  }

  function init() {
    buildHint();

    // 监听 worker 的 stdout 行（process:output 事件）与退出（process:exit）。
    if (platform.process && platform.process.onOutput) {
      platform.process.onOutput(handleWorkerLine);
    }
    if (platform.process && platform.process.onExit) {
      platform.process.onExit(function (payload) {
        setPill('st-off', '已退出');
        $('hero-title').textContent = '后台监控进程已退出';
        $('hero-sub').textContent = '重开本页可重新拉起 worker';
      });
    }

    startWorker();

    $('btn-checkin').addEventListener('click', function () {
      $('btn-checkin').disabled = true;
      // 通知 worker 立即执行一轮检查（worker 经 process:output 回报结果）。
      platform.process.write(WORKER, 'checkin\n')
        .then(function () {
          setTimeout(function () { $('btn-checkin').disabled = false; }, 600);
        })
        .catch(function (e) {
          $('btn-checkin').disabled = false;
          showWorkerError(e);
        });
    });

    $('btn-toggle').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      platform.settings.get('AUTOSIGN_ENABLED').then(function (cur) {
        var next = String(cur).trim().toLowerCase() === 'true' ? 'false' : 'true';
        return platform.settings.set('AUTOSIGN_ENABLED', next);
      }).then(function () {
        // 切开关后让 worker 立即读新配置并回报状态
        return platform.process.write(WORKER, 'status\n').catch(function () {});
      }).then(function () {
        btn.disabled = false;
      }).catch(function (e) {
        btn.disabled = false;
        showWorkerError(e);
      });
    });

    $('loc-select').addEventListener('change', function () {
      var sel = this;
      platform.settings.set('AUTOSIGN_RADAR_LOCATION', sel.value).then(function () {
        platform.process.write(WORKER, 'status\n').catch(function () {});
      }).catch(function (e) { showWorkerError(e); });
    });
  }

  init();
})();
</script>
</body>
</html>
