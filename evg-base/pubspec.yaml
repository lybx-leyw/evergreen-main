name: evergreen_base
description: Evergreen 2.0 — 双轨架构平台底层（core 声明层 + renderer 渲染层）
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 + 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # 网络 + 存储
  dio: ^5.9.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  # SSO 会话持久化（zju_modle 认证层，PersistCookieJar 跨重启保活）
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0

  # ── Windows 平台实现（显式依赖，避免 pub cache 损坏导致缺失） ──
  shared_preferences_windows: ^2.1.0
  path_provider_windows: ^2.1.0
  url_launcher_windows: ^3.1.0

  # WebView — HTML 模块内嵌渲染 + 爬虫生成器内嵌浏览器
  webview_flutter: ^4.10.0

  # 桌面窗口
  window_manager: ^0.4.0
  screen_retriever_windows: ^0.2.2

  # 工具
  uuid: ^4.5.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  meta: ^1.3.0
  archive: ^3.4.0
  crypto: ^3.0.3

  # 系统通知——数据变更 diff 通知（Android 状态栏 + Windows Toast）
  # 22.x 修复 Windows FFI 插件在 release/AOT 构建下的兼容问题；
  # 要求 Dart >=3.10（Flutter >=3.38），当前 CI/本地工具链已满足。
  flutter_local_notifications: ^22.3.0

  # 视频播放（跨平台 media_kit，基于 libmpv）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.9
  media_kit_libs_video: ^1.0.5

  # 渲染——Markdown / 数学 / 代码 / HTML / 图表 / 字体
  # fl_chart: zju_modle scores GPA 仪表盘图表（B3-scores，抄参考工程 core/features/scores）
  fl_chart: ^0.69.0
  flutter_markdown: ^0.7.6
  flutter_math_fork: ^0.7.0
  markdown: ^7.0.0
  flutter_widget_from_html: ^0.15.0
  flutter_highlight: ^0.7.0
  flutter_mermaid: ^0.1.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  file_picker: ^8.0.0
  re_editor: ^0.10.0
  webview_windows: ^0.4.0

  # 真终端（xterm UI + flutter_pty 伪终端后端）
  xterm: ^4.0.0
  flutter_pty: ^0.4.2

  # Diff 算法（Myers diff，用于技术规划编辑器的版本对比）
  diff_match_patch: ^0.4.1

  # 文件监控 —— 全流程插件创作流：监控 plugins/ 目录变化，触发热加载
  watcher: ^1.1.0

  # 扫码（M3 scanner：Android/iOS/Web 摄像头；桌面无相机 → 优雅降级，R5/R9）
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# 临时规避：上游 flutter_local_notifications_windows 的 FFI 插件在 Windows
# Release/AOT 下触发 gen_snapshot 崩溃（NativeLaunchDetails illegal cid）。
# 这里用本地 no-op stub 替换，保留 Android 通知能力，Windows Toast 暂禁用。
dependency_overrides:
  flutter_local_notifications_windows:
    path: windows_notifications_stub

