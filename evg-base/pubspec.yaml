    - assets/plugins_bundle/theme-creator/module/manifest.json

    # <<<PLUGIN_ASSETS_END<<<

    # >>>SCRIPTS_ASSETS_START>>>
    - assets/scripts_bundle/evg_lib/__init__.py
    - assets/scripts_bundle/evg_lib/cas.py
