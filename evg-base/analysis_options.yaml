include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # 未使用导入/变量 → warning（非 error，避免阻断调试中的半成品）
    unused_import: warning
    unused_local_variable: warning
    # 缺失返回 → error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/ephemeral/**"
    - "**/stub/**"
    - "build/**"
    - "scripts/**"
    # ── 嵌套子包：各有独立 pubspec + analysis_options，须在其包根独立分析 ──
    # lib/core 本身即嵌套包（含 agent/config/data/module/theme 子包与 stub 目录），
    # 根包上下文分析会命中子包 stub 配置（package:flutter 解析失败），产生海量
    # 级联假错误（2026-07-25 基线 25,577 条中约 2.4 万条属此噪声）。
    # 根包 analyze 只覆盖根包实际代码（lib 顶层 + test/ + tool/）；
    # 嵌套子包质量门禁：cd <子包> && dart analyze / flutter test。
    - "lib/core/**"
    - "lib/renderer/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # ── 代码风格 ──
    - always_declare_return_types
    - annotate_overrides
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_brace_in_string_interps

    # ── 导入 ──
    - avoid_relative_lib_imports
    - directives_ordering
    - sort_constructors_first

    # ── 最佳实践 ──
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - empty_statements
    - hash_and_equals
    - no_duplicate_case_values
    - prefer_adjacent_string_concatenation
    - prefer_collection_literals
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_null_aware_operators
    - unnecessary_null_checks
    - use_build_context_synchronously
    - use_key_in_widget_constructors
    - use_super_parameters

    # ── 文档（对齐 CLAUDE.md 注释规范） ──
    - package_api_docs
    - public_member_api_docs
