<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 — V2</title>
<style>
:root {
  /* 背景 */
  --evg-bg-primary: #0d1117;
  --evg-bg-secondary: #161b22;
  --evg-bg-tertiary: #1c2128;

  /* 边框 */
  --evg-border-default: #30363d;
  --evg-border-accent: #1f6feb;
  --evg-border-success: #3fb950;

  /* 文字 */
  --evg-text-primary: #c9d1d9;
  --evg-text-secondary: #8b949e;
  --evg-text-tertiary: #484f58;

  /* 强调色 */
  --evg-accent-blue: #58a6ff;
  --evg-accent-blue-bg: #1f6feb22;
  --evg-accent-blue-border: #1f6feb44;

  /* 状态色 */
  --evg-state-success: #3fb950;
  --evg-state-success-bg: #3fb95022;
  --evg-state-success-border: #3fb95044;
  --evg-state-error: #ff7b72;

  /* 按钮 */
  --evg-button-green: #238636;
  --evg-button-bg: #21262d;

  /* 代码 */
  --evg-code-kw: #ff7b72;
  --evg-code-fn: #d2a8ff;
  --evg-code-str: #a5d6ff;
  --evg-code-num: #79c0ff;
  --evg-code-cmt: #8b949e;

  /* 间距 */
  --evg-space-xs: 4.0px;
  --evg-space-sm: 6.0px;
  --evg-space-md: 8.0px;
  --evg-space-lg: 12.0px;
  --evg-space-xl: 16.0px;
  --evg-space-xxl: 24.0px;

  /* 圆角 */
  --evg-radius-sm: 3.0px;
  --evg-radius-md: 4.0px;
  --evg-radius-lg: 6.0px;
  --evg-radius-xl: 8.0px;
  --evg-radius-xxl: 12.0px;
  --evg-radius-round: 20.0px;

  /* 字体 */
  --evg-font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --evg-font-mono: 'Cascadia Code', 'Fira Code', monospace;
  --evg-font-size-xs: 9.0px;
  --evg-font-size-sm: 10.0px;
  --evg-font-size-base: 11.0px;
  --evg-font-size-md: 12.0px;
  --evg-font-size-lg: 13.0px;
  --evg-font-size-xl: 14.0px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--evg-bg-primary); color: var(--evg-text-primary);
}

/* ── Shell: 侧边栏 + 内容区 ── */
#evg-app { display: flex; flex-direction: column; height: 100vh; }
.evg-shell { display: flex; flex: 1; overflow: hidden; }
.evg-sidebar {
  width: 200px; flex-shrink: 0; background: var(--evg-bg-secondary);
  border-right: 1px solid var(--evg-border-default); display: flex; flex-direction: column; overflow-y: auto;
}
.evg-sidebar-header {
  padding: 12px; font-size: 12px; font-weight: 700; color: var(--evg-accent-blue);
  border-bottom: 1px solid var(--evg-border-default); text-transform: uppercase; letter-spacing: .5px;
}
.evg-nav-item {
  display: block; padding: 8px 12px; color: var(--evg-text-secondary); text-decoration: none;
  font-size: 13px; border-left: 2px solid transparent; transition: all .15s;
}
.evg-nav-item:hover, .evg-nav-item.active { color: var(--evg-text-primary); border-left-color: var(--evg-accent-blue); background: var(--evg-bg-tertiary); }
.evg-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Tab 页签 ── */
.evg-tabs {
  display: flex; gap: 2px; padding: 4px 8px 0;
  background: var(--evg-bg-secondary); border-bottom: 1px solid var(--evg-border-default); flex-shrink: 0;
}
.evg-tab {
  padding: 6px 14px; border: 1px solid transparent; border-radius: 6px 6px 0 0;
  background: transparent; color: var(--evg-text-secondary); cursor: pointer; font-size: 12px;
}
.evg-tab:hover { color: var(--evg-text-primary); background: var(--evg-bg-tertiary); }
.evg-tab.active { color: var(--evg-accent-blue); background: var(--evg-bg-primary); border-color: var(--evg-border-default); border-bottom-color: var(--evg-bg-primary); }

/* ── 页面 & 布局 ── */
.evg-pages { flex: 1; overflow: hidden; }
.evg-page { height: 100%; }
.evg-page.active { display: block !important; }
.evg-layout { width: 100%; height: 100%; padding: 8px; overflow: auto; }

/* ── Slot 卡片 ── */
.evg-slot {
  border: 1px solid var(--evg-border-default); border-radius: 8px;
  background: var(--evg-bg-secondary); overflow: hidden; display: flex; flex-direction: column;
}
.evg-slot-header {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: var(--evg-bg-tertiary); border-bottom: 1px solid var(--evg-border-default); font-size: 11px;
  flex-shrink: 0;
}
.evg-slot-name { color: var(--evg-text-primary); font-weight: 600; }
.evg-slot-type { color: var(--evg-accent-blue); font-size: 10px; }
.evg-slot-body { flex: 1; overflow: auto; }
.evg-badge {
  background: var(--evg-accent-blue-bg); color: var(--evg-accent-blue); padding: 1px 6px; border-radius: 8px;
  font-size: 10px; border: 1px solid var(--evg-accent-blue-border); white-space: nowrap;
}
.evg-badge-listen {
  background: var(--evg-state-success-bg); color: var(--evg-state-success); padding: 1px 6px; border-radius: 8px;
  font-size: 10px; border: 1px solid var(--evg-state-success-border); white-space: nowrap;
}

/* ── 组件通用 ── */
.evg-comp { width: 100%; height: 100%; display: flex; flex-direction: column; }
.evg-comp-title { font-size:13px; font-weight:600; color:var(--evg-text-primary); padding:8px 12px 4px; }
.evg-empty { padding: 40px; text-align: center; color: var(--evg-text-secondary); }

/* ── Chat ── */
.evg-comp-chat { display: flex; flex-direction: column; }
.evg-chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.evg-msg { display: flex; gap: 8px; align-items: flex-start; }
.evg-msg.user { flex-direction: row-reverse; }
.evg-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--evg-border-accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.evg-msg.user .evg-avatar { background: var(--evg-state-success); }
.evg-bubble { background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); border-radius: 12px; padding: 8px 12px; font-size: 13px; line-height: 1.6; max-width: 80%; }
.evg-msg.user .evg-bubble { background: var(--evg-accent-blue-bg); border-color: var(--evg-accent-blue-border); }
.evg-chat-input { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--evg-border-default); background: var(--evg-bg-secondary); }
.evg-chat-input input { flex: 1; padding: 8px 12px; background: var(--evg-bg-primary); border: 1px solid var(--evg-border-default); border-radius: 6px; color: var(--evg-text-primary); font-size: 13px; }
.evg-chat-input button { padding: 6px 16px; background: var(--evg-button-green); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 12px; }
.evg-quick-replies { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px; }
.evg-quick-reply { background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); border-radius: 12px; padding: 3px 10px; font-size: 11px; color: var(--evg-accent-blue); cursor: pointer; white-space: nowrap; }

/* ── Code Editor ── */
.evg-comp-code { display: flex; flex-direction: column; }
.evg-code-header { display: flex; justify-content: space-between; padding: 6px 12px; background: var(--evg-bg-tertiary); border-bottom: 1px solid var(--evg-border-default); font-size: 12px; color: var(--evg-text-secondary); }
.evg-code-lang { color: var(--evg-accent-blue); }
.evg-code-body { display: flex; flex: 1; overflow: auto; }
.evg-code-lines { padding: 8px 10px; color: var(--evg-text-tertiary); font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; text-align: right; background: var(--evg-bg-primary); min-width: 36px; user-select: none; }
.evg-code-pre { flex: 1; padding: 8px 12px; background: var(--evg-bg-primary); color: var(--evg-text-primary); font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; overflow: auto; margin: 0; }
.evg-kw { color: var(--evg-code-kw); }
.evg-fn { color: var(--evg-code-fn); }
.evg-str { color: var(--evg-code-str); }
.evg-num { color: var(--evg-code-num); }
.evg-cmt { color: var(--evg-code-cmt); font-style: italic; }

/* ── Data Table ── */
.evg-comp-table { padding: 8px; }
.evg-table-filter { margin-bottom: 8px; }
.evg-table-filter input { width: 100%; padding: 6px 10px; background: var(--evg-bg-primary); border: 1px solid var(--evg-border-default); border-radius: 4px; color: var(--evg-text-primary); font-size: 12px; }
.evg-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.evg-table th, .evg-table td { padding: 6px 10px; border: 1px solid var(--evg-border-default); text-align: left; }
.evg-table th { background: var(--evg-bg-tertiary); font-weight: 600; }
.evg-table tr:hover td { background: var(--evg-bg-tertiary); }
.evg-sort { color: var(--evg-text-tertiary); font-size: 10px; cursor: pointer; }

/* ── Card Grid ── */
.evg-comp-cards { padding: 8px; }
.evg-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.evg-card { background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); border-radius: 8px; padding: 10px; }
.evg-card-field { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.evg-card-label { color: var(--evg-text-secondary); }
.evg-card-val { color: var(--evg-text-primary); font-weight: 600; }

/* ── Chart ── */
.evg-comp-chart { padding: 8px 8px 40px 8px; display: flex; flex-direction: column; }
.evg-chart-area { flex: 1; display: flex; align-items: flex-end; padding: 12px 0 0; }
.evg-chart-bars { display: flex; align-items: flex-end; gap: 4px; width: 100%; height: 100%; }
.evg-bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.evg-bar { width: 80%; min-width: 16px; border-radius: 3px 3px 0 0; position: relative; min-height: 4px; transition: height .3s; }
.evg-bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--evg-text-secondary); }
.evg-bar-label { font-size: 9px; color: var(--evg-text-secondary); margin-top: 4px; }
.evg-chart-pie { width: 120px; height: 120px; border-radius: 50%; margin: 12px auto; }
.evg-chart-pie.donut { position: relative; }
.evg-chart-pie.donut::after { content: ''; position: absolute; top: 30px; left: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--evg-bg-primary); }
.evg-chart-legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.evg-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--evg-text-secondary); }
.evg-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.evg-line-svg { width: 100%; height: 100%; }

/* ── Lottery ── */
.evg-comp-lottery { display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 12px; }
.evg-lottery-header { text-align: center; }
.evg-lottery-sub { font-size: 11px; color: var(--evg-text-secondary); }
.evg-lottery-wheel-container { position: relative; }
.evg-lottery-canvas { border-radius: 50%; border: 4px solid var(--evg-border-default); background: var(--evg-bg-tertiary); }
.evg-lottery-btn { margin-top: 12px; padding: 8px 24px; background: linear-gradient(135deg, var(--evg-button-green), var(--evg-border-accent)); border: none; border-radius: 20px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
.evg-lottery-history { text-align: center; }

/* ── Document ── */
.evg-comp-doc { display: flex; flex-direction: column; }
.evg-doc-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--evg-bg-tertiary); border-bottom: 1px solid var(--evg-border-default); font-size: 12px; }
.evg-doc-actions { display: flex; gap: 4px; }
.evg-doc-tag { background: var(--evg-accent-blue-bg); border: 1px solid var(--evg-accent-blue-border); border-radius: 3px; padding: 1px 6px; font-size: 10px; color: var(--evg-accent-blue); }
.evg-doc-content { flex: 1; padding: 16px; overflow-y: auto; line-height: 1.8; }
.evg-doc-content h2 { font-size: 18px; margin-bottom: 12px; color: var(--evg-text-primary); }
.evg-doc-content p { margin-bottom: 8px; }
.evg-doc-content blockquote { border-left: 3px solid var(--evg-accent-blue); padding: 4px 12px; color: var(--evg-text-secondary); margin: 8px 0; background: var(--evg-bg-tertiary); border-radius: 0 4px 4px 0; }

/* ── Spreadsheet ── */
.evg-comp-sheet { display: flex; flex-direction: column; }
.evg-sheet-header { display: flex; justify-content: space-between; padding: 6px 12px; background: var(--evg-bg-tertiary); border-bottom: 1px solid var(--evg-border-default); font-size: 12px; color: var(--evg-text-primary); }
.evg-sheet-table { flex: 1; overflow: auto; }
.evg-sheet-table table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; }
.evg-sheet-table th, .evg-sheet-table td { border: 1px solid var(--evg-border-default); padding: 4px 8px; min-width: 60px; text-align: left; }
.evg-sheet-table th { background: var(--evg-bg-tertiary); font-weight: 600; position: sticky; top: 0; }
.evg-sheet-table td { background: var(--evg-bg-primary); }
.evg-row-num { color: var(--evg-text-tertiary); text-align: center; background: var(--evg-bg-secondary) !important; }

/* ── Video ── */
.evg-comp-video { display: flex; flex-direction: column; }
.evg-video-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--evg-bg-primary); gap: 12px; }
.evg-video-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--evg-accent-blue-bg); border: 2px solid var(--evg-accent-blue); color: var(--evg-accent-blue); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.evg-video-text { font-size: 14px; color: var(--evg-text-secondary); }
.evg-video-controls { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--evg-bg-secondary); border-top:1px solid var(--evg-border-default); width:100%; font-size:14px; color:var(--evg-text-primary); }

/* ── Presentation ── */
.evg-comp-pres { display: flex; flex-direction: column; }
.evg-pres-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 16px; position: relative; }
.evg-pres-title { font-size: 20px; font-weight: 700; color: var(--evg-accent-blue); }
.evg-pres-content { font-size: 14px; color: var(--evg-text-secondary); text-align: center; line-height: 1.8; }
.evg-pres-page { position: absolute; bottom: 12px; right: 12px; font-size: 11px; color: var(--evg-text-tertiary); }
.evg-pres-nav { display: flex; justify-content: center; gap: 12px; padding: 8px; border-top:1px solid var(--evg-border-default); }
.evg-pres-nav button { padding: 4px 12px; background: var(--evg-button-bg); border: 1px solid var(--evg-border-default); border-radius: 4px; color: var(--evg-text-primary); font-size: 12px; cursor: pointer; }

/* ── TypeCheck ── */
.evg-comp-typecheck { padding: 12px; }
.evg-tc-question { display: flex; gap: 8px; margin: 12px 0; font-size: 14px; }
.evg-tc-q-number { color: var(--evg-accent-blue); font-weight: 700; }
.evg-tc-q-text { color: var(--evg-text-primary); }
.evg-tc-options { display: flex; flex-direction: column; gap: 6px; }
.evg-tc-opt { padding: 8px 12px; background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); border-radius: 6px; font-size: 13px; cursor: pointer; }
.evg-tc-opt.correct { border-color: var(--evg-state-success); background: var(--evg-state-success-bg); }
.evg-tc-score { margin-top: 12px; font-size: 12px; color: var(--evg-text-secondary); }

/* ── Form ── */
.evg-comp-form { padding: 12px; }
.evg-form-field { margin-bottom: 10px; }
.evg-form-field label { display: block; font-size: 12px; color: var(--evg-text-secondary); margin-bottom: 4px; }
.evg-form-field input, .evg-form-field textarea, .evg-form-field select {
  width: 100%; padding: 6px 10px; background: var(--evg-bg-primary); border: 1px solid var(--evg-border-default);
  border-radius: 4px; color: var(--evg-text-primary); font-size: 13px;
}
.evg-form-field.inline { display: flex; align-items: center; gap: 8px; }
.evg-form-field.inline input { width: auto; }
.evg-form-submit { padding: 6px 20px; background: var(--evg-button-green); border: none; border-radius: 6px; color: #fff; font-size: 13px; cursor: pointer; }

/* ── Calendar ── */
.evg-comp-cal { padding: 12px; }
.evg-cal-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--evg-text-primary); margin-bottom: 8px; }
.evg-cal-header button { background: var(--evg-button-bg); border: 1px solid var(--evg-border-default); border-radius: 4px; color: var(--evg-text-primary); cursor: pointer; padding: 2px 8px; }
.evg-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.evg-cal-dh { text-align: center; font-size: 11px; color: var(--evg-text-secondary); padding: 4px; }
.evg-cal-day { text-align: center; padding: 6px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.evg-cal-day:hover { background: var(--evg-bg-tertiary); }
.evg-cal-day.active { background: var(--evg-border-accent); color: #fff; }

/* ── Map ── */
.evg-comp-map { display: flex; flex-direction: column; }
.evg-map-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--evg-bg-primary); gap: 8px; position: relative; }
.evg-map-pin { font-size: 36px; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.evg-map-coords { font-size: 11px; color: var(--evg-text-secondary); }
.evg-map-zoom { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 2px; }
.evg-map-zoom button { width: 24px; height: 24px; background: var(--evg-button-bg); border:1px solid var(--evg-border-default); color:var(--evg-text-primary); cursor:pointer; border-radius:4px; font-size:14px; }

/* ── Markdown ── */
.evg-comp-md { display: flex; flex-direction: column; }
.evg-md-content { flex: 1; overflow: auto; font-size: 13px; }

/* ── Divider ── */
.evg-comp-divider { padding: 4px 0; }
.evg-comp-divider hr { border: none; border-top: 1px solid var(--evg-border-default); }

/* ── Flashcards ── */
.evg-comp-flash { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.evg-flash-card { width: 100%; max-width: 300px; height: 160px; perspective: 600px; }
.evg-flash-front, .evg-flash-back { width: 100%; height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; font-size: 14px; }
.evg-flash-front { background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); color: var(--evg-text-primary); }
.evg-flash-back { background: var(--evg-accent-blue-bg); border: 1px solid var(--evg-accent-blue-border); color: var(--evg-accent-blue); }
.evg-flash-nav { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--evg-text-secondary); }
.evg-flash-nav button { padding: 4px 10px; background: var(--evg-button-bg); border: 1px solid var(--evg-border-default); border-radius: 4px; color: var(--evg-text-primary); font-size: 11px; cursor: pointer; }

/* ── Quiz ── */
.evg-comp-quiz { padding: 12px; }
.evg-quiz-question { margin: 12px 0; }
.evg-quiz-q { font-size: 14px; color: var(--evg-text-primary); margin-bottom: 8px; }
.evg-quiz-options { display: flex; flex-direction: column; gap: 4px; }
.evg-quiz-options label { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--evg-bg-tertiary); border: 1px solid var(--evg-border-default); border-radius: 4px; cursor: pointer; font-size: 13px; }
.evg-quiz-submit { margin-top: 12px; padding: 6px 20px; background: var(--evg-button-green); border: none; border-radius: 6px; color: #fff; font-size: 13px; cursor: pointer; }

/* ── Mindmap ── */
.evg-comp-mindmap { padding: 12px; }
.evg-mm-root { display: inline-block; padding: 10px 20px; background: var(--evg-border-accent); color: #fff; border-radius: 20px; font-size: 14px; font-weight: 700; }

.evg-wv-btn:hover { background: var(--evg-border-default); }

</head>
<body>
<div id="evg-app" style="">
  <div class="evg-empty">无页面配置</div>
</div>
<script>
// V2 事件系统: emit / listen / delegates
window.evergreen = {
  events: [],
  emit(eventName, payload) {
    const evt = { name: eventName, payload, time: Date.now() };
    this.events.push(evt);
    const listeners = document.querySelectorAll('[data-listen]');
    listeners.forEach(el => {
      try {
        const cfg = JSON.parse(el.dataset.listen || '[]');
        cfg.forEach(l => {
          if (l.event === eventName) {
            console.log('[Evergreen] emit:', eventName, '→ handler:', l.handler, payload);
            el.dispatchEvent(new CustomEvent('evg:' + eventName, { detail: payload }));
          }
        });
      } catch(e) {}
    });
  }
};

</script>
<script>
// 初始化页面切换
function switchPage(pageId) {
  document.querySelectorAll('.evg-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.evg-tab').forEach(t => t.classList.remove('active'));
  const page = document.getElementById('page-' + pageId);
  if (page) page.classList.add('active');
  const tab = document.querySelector('[data-page="' + pageId + '"]');
  if (tab) tab.classList.add('active');
}

// 默认激活第一个页面
(function() {
  const pages = [];
  if (pages.length > 0) {
    const firstPage = pages.find(p => p.default === true) || pages[0];
    switchPage(firstPage.id);
  }
})();

</script>
