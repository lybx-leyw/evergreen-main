<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evergreen 下载中心</title>
  <style>
    :root {
      --ink: #16181d;          /* 墨 */
      --ink-2: #3a3f47;
      --paper: #fafaf7;        /* 白 */
      --paper-2: #f0f0ec;
      --line: #dcdcd6;
      --muted: #7a7f88;
      --accent: #2f8f5b;       /* 绿色仅作少量强调 */
      --accent-ink: #1f5c3c;
      --badge-pre: #6b7280;
      --badge-stable: #16181d;
      --badge-draft: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0 16px 64px;
    }
    /* —— 放映区：logo 由黑白渐映为彩色，悬停回到黑白 —— */
    .stage {
      text-align: center;
      padding: 44px 16px 20px;
    }
    .stage .brand {
      width: 108px;
      height: 108px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 10px 30px rgba(22, 24, 29, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: reelshow 6s ease-in-out infinite alternate;
    }
    .stage .brand svg {
      width: 84px;
      height: 84px;
      filter: grayscale(1) contrast(1.12);
      transition: filter 0.6s ease;
    }
    .stage .brand:hover svg { filter: grayscale(0) contrast(1); }
    @keyframes reelshow {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(-5px) scale(1.03); }
    }
    .stage h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .stage p { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
    .container { max-width: 880px; margin: 0 auto; }
    .status {
      text-align: center;
      color: var(--muted);
      padding: 24px;
      font-size: 0.95rem;
    }
    .status.error { color: #b03a3a; }
    .version {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(22, 24, 29, 0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .version:hover {
      border-color: var(--ink);
      box-shadow: 0 6px 18px rgba(22, 24, 29, 0.08);
    }
    .version-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 4px;
    }
    .version-name { font-size: 1.25rem; font-weight: 700; }
    .badge {
      font-size: 0.7rem;
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
    }
    .badge.pre { background: var(--badge-pre); }
    .badge.stable { background: var(--badge-stable); }
    .badge.draft { background: var(--badge-draft); }
    .version-date { color: var(--muted); font-size: 0.83rem; margin-left: auto; }
    .version-note {
      color: var(--muted);
      font-size: 0.9rem;
      white-space: pre-wrap;
      margin: 8px 0 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .group {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .group-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.zju { background: var(--accent); }
    .dot.std { background: var(--ink); }
    .btns { display: flex; flex-direction: column; gap: 8px; }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      transition: all 0.15s;
    }
    a.btn:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      transform: translateY(-1px);
    }
    a.btn .tag {
      font-size: 0.68rem;
      padding: 1px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    a.btn .tag.release { background: var(--ink); color: #fff; }
    a.btn .tag.debug { background: var(--paper-2); color: var(--muted); border: 1px solid var(--line); }
    a.btn:hover .tag.release { background: #fff; color: var(--ink); }
    a.btn:hover .tag.debug { background: rgba(255,255,255,0.16); color: #c9ccd2; border-color: transparent; }
    a.btn .arrow { color: var(--muted); }
    a.btn:hover .arrow { color: #fff; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 12px;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 44px;
      line-height: 1.8;
    }
    footer .pets { display: flex; justify-content: center; gap: 18px; margin-bottom: 14px; }
    footer .pets svg { width: 34px; height: 34px; opacity: 0.55; filter: grayscale(1); transition: all 0.4s; }
    footer .pets svg:hover { opacity: 1; filter: grayscale(0); }
    footer a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); }
    footer a:hover { color: var(--accent-ink); border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <header class="stage">
    <!-- logo：黑白放映（CSS 灰度滤镜 + 悬停还原彩色） -->
    <div class="brand" title="绿意不息">
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意不息 Logo">
        <g transform="translate(0 0)">
          <path fill="#e8e8e2" d="M120 16a104 104 0 1 0 0 208 104 104 0 0 0 0-208z" opacity="0.55"/>
          <path fill="#d9d9d2" d="M120 26a94 94 0 1 0 0 188 94 94 0 0 0 0-188z" opacity="0.4"/>
          <g fill="#3a3f47">
            <path d="M120 52c-22 26-38 50-38 84 0 26 17 46 38 52 21-6 38-26 38-52 0-34-16-58-38-84z"/>
            <path d="M120 70c-10 16-18 32-18 52 0 16 8 30 18 36 10-6 18-20 18-36 0-20-8-36-18-52z" fill="#fafaf7"/>
            <path d="M100 118c-10-4-24-2-32 6 4 10 18 16 32 14z" fill="#4a5058"/>
            <path d="M140 118c10-4 24-2 32 6-4 10-18 16-32 14z" fill="#4a5058"/>
          </g>
        </g>
      </svg>
    </div>
    <h1>Evergreen 下载中心</h1>
    <p>所有版本（含预发布）一键下载安装 · 数据本地优先 · 无账号</p>
  </header>

  <div class="container">
    <div id="status" class="status">正在从 GitHub 拉取版本列表…</div>
    <div id="versions"></div>
  </div>

  <footer>
    <div class="pets">
      <!-- 宠物：黑白待机，悬停放映彩色 -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意不息宠物 叶灵猫">
        <g fill="#3a3f47">
          <ellipse cx="100" cy="118" rx="52" ry="46"/>
          <path d="M62 88l-24-30 8-2 20 22z"/>
          <path d="M138 88l24-30-8-2-20 22z"/>
        </g>
        <ellipse cx="100" cy="126" rx="16" ry="10" fill="#fafaf7"/>
        <circle cx="92" cy="112" r="4" fill="#16181d"/>
        <circle cx="108" cy="112" r="4" fill="#16181d"/>
      </svg>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意不息宠物 绿芽精灵">
        <g fill="#3a3f47">
          <circle cx="100" cy="120" r="46"/>
          <path d="M100 74c-10-14-26-22-40-22 4 14 18 24 34 24z"/>
          <path d="M100 74c10-14 26-22 40-22-4 14-18 24-34 24z"/>
        </g>
        <circle cx="86" cy="114" r="5" fill="#fafaf7"/>
        <circle cx="114" cy="114" r="5" fill="#fafaf7"/>
      </svg>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="绿意不息宠物 睡眠款">
        <g fill="#3a3f47">
          <ellipse cx="100" cy="120" rx="52" ry="44"/>
          <path d="M120 128c6 6 14 8 22 6-4 8-14 12-24 8z" fill="#fafaf7"/>
        </g>
        <circle cx="84" cy="112" r="4" fill="#16181d"/>
        <circle cx="116" cy="112" r="4" fill="#16181d"/>
      </svg>
    </div>
    版本数据来自 GitHub Releases，自动同步。<br />
    遇到问题？前往
    <a href="https://github.com/lybx-leyw/evergreen-main/issues" target="_blank" rel="noopener">Issue 反馈</a>
    ·
    <a href="https://github.com/lybx-leyw/evergreen-main" target="_blank" rel="noopener">项目主页</a>
  </footer>

  <script>
    const REPO = "lybx-leyw/evergreen-main";
    const API = `https://api.github.com/repos/${REPO}/releases?per_page=100`;

    // 把一个 release 的 assets 按 版本/平台/模式 归类
    function classify(assets) {
      const out = { zju: {}, std: {} };
      for (const a of assets) {
        const name = a.name || "";
        const url = a.browser_download_url;
        const isApk = name.endsWith(".apk");
        const isExe = name.toLowerCase().endsWith(".exe");
        if (!isApk && !isExe) continue;

        let edition = null;
        if (name.includes("zju") || name.includes("Zju")) edition = "zju";
        else if (name.includes("std") || name.includes("Std")) edition = "std";
        if (!edition) continue;

        const mode = /debug/i.test(name) ? "debug" : /release/i.test(name) ? "release" : null;
        if (!mode) continue;

        const platform = isApk ? "android" : "windows";
        out[edition][`${platform}-${mode}`] = url;
      }
      return out;
    }

    function btn(label, url, mode) {
      if (!url) return "";
      const tagCls = mode === "release" ? "release" : "debug";
      const tagTxt = mode === "release" ? "正式" : "调试";
      return `<a class="btn" href="${url}" download>
        <span>${label}</span>
        <span class="tag ${tagCls}">${tagTxt}</span>
        <span class="arrow">↓</span>
      </a>`;
    }

    function renderVersion(rel) {
      const assets = rel.assets || [];
      const cls = classify(assets);
      const hasAny = Object.values(cls).some((e) => Object.keys(e).length > 0);
      if (!hasAny) return "";

      const name = rel.name || rel.tag_name;
      let badge = "";
      if (rel.draft) badge = `<span class="badge draft">草稿</span>`;
      else if (rel.prerelease) badge = `<span class="badge pre">预发布</span>`;
      else badge = `<span class="badge stable">正式版</span>`;

      const date = rel.published_at
        ? new Date(rel.published_at).toLocaleDateString("zh-CN")
        : "";

      const group = (edition, label, dotCls) => {
        const e = cls[edition];
        const cells = [
          btn("安卓 APK", e["android-release"], "release"),
          btn("安卓 APK（调试）", e["android-debug"], "debug"),
          btn("Windows 安装包", e["windows-release"], "release"),
          btn("Windows 安装包（调试）", e["windows-debug"], "debug"),
        ].join("");
        return `<div class="group">
          <div class="group-title"><span class="dot ${dotCls}"></span>${label}</div>
          <div class="btns">${cells}</div>
        </div>`;
      };

      return `<div class="version">
        <div class="version-head">
          <span class="version-name">${name}</span>
          ${badge}
          <span class="version-date">${date}</span>
        </div>
        ${rel.body ? `<div class="version-note">${escapeHtml(rel.body)}</div>` : ""}
        <div class="grid">
          ${group("zju", "浙大专用版", "zju")}
          ${group("std", "通用版", "std")}
        </div>
      </div>`;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    async function load() {
      const statusEl = document.getElementById("status");
      const wrap = document.getElementById("versions");
      try {
        const resp = await fetch(API, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const releases = await resp.json();
        const html = releases
          .map(renderVersion)
          .filter((h) => h)
          .join("");
        if (!html) {
          statusEl.textContent = "暂无可下载的版本。";
          return;
        }
        statusEl.style.display = "none";
        wrap.innerHTML = html;
      } catch (e) {
        statusEl.className = "status error";
        statusEl.innerHTML =
          "加载失败：" + e.message +
          '<br/>可前往 <a href="https://github.com/lybx-leyw/evergreen-main/releases" target="_blank" rel="noopener" style="color:var(--ink-2);text-decoration:underline">GitHub Releases</a> 手动下载。';
      }
    }

    load();
  </script>
</body>
</html>
