<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evergreen 三角通讯链架构图</title>
<style>
  :root {
    --bg: #0d1117;
    --up: #58a6ff; --mid: #d2a8ff; --down: #7ee787;
    --accent: #f78166; --gold: #e3b341;
    --text: #c9d1d9; --dim: #8b949e; --surface: #161b22;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 100%; max-width: 1080px; }
</style>
</head>
<body>
<svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gUp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gDown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0.04"/>
    </linearGradient>

    <marker id="maBlue"   markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#58a6ff"/></marker>
    <marker id="maPurple" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#d2a8ff"/></marker>
    <marker id="maGreen"  markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#7ee787"/></marker>

    <filter id="fGlow"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- ================================================================ -->
  <!--  BACKGROUND: faint triangle outline                               -->
  <!-- ================================================================ -->
  <polygon points="370,20  660,20  660,175  870,440  850,610  730,610  190,535  25,535  55,435  180,175"
           fill="none" stroke="var(--dim)" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="8 5"/>

  <!-- ================================================================ -->
  <!--  ARROW 1: core/ ──→ plugins/  (HTTP JSON)                        -->
  <!-- ================================================================ -->
  <path d="M 260 440 Q 310 300 415 195"
        fill="none" stroke="#58a6ff" stroke-width="2.2" marker-end="url(#maBlue)" filter="url(#fGlow)"/>
  <rect x="300" y="305" width="118" height="20" rx="4" fill="var(--bg)" opacity="0.88"/>
  <text x="359" y="319" text-anchor="middle" font-size="10.5" fill="#58a6ff" font-weight="600">HTTP JSON 调用服务</text>

  <!-- ================================================================ -->
  <!--  ARROW 2: plugins/ ──→ renderer/  (Descriptor + Riverpod)        -->
  <!-- ================================================================ -->
  <path d="M 625 150 Q 665 280 750 395"
        fill="none" stroke="#d2a8ff" stroke-width="2.2" marker-end="url(#maPurple)" filter="url(#fGlow)"/>
  <rect x="635" y="255" width="135" height="20" rx="4" fill="var(--bg)" opacity="0.88"/>
  <text x="702" y="269" text-anchor="middle" font-size="10.5" fill="#d2a8ff" font-weight="600">Descriptor + Riverpod</text>

  <!-- ================================================================ -->
  <!--  ARROW 3: core/ ──→ renderer/  (import 直调 · 零序列化)          -->
  <!-- ================================================================ -->
  <path d="M 290 485 Q 500 560 720 480"
        fill="none" stroke="#7ee787" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#maGreen)" filter="url(#fGlow)"/>
  <rect x="456" y="518" width="126" height="32" rx="4" fill="var(--bg)" opacity="0.88"/>
  <text x="519" y="533" text-anchor="middle" font-size="10.5" fill="#7ee787" font-weight="600">import 直调</text>
  <text x="519" y="546" text-anchor="middle" font-size="9" fill="var(--accent)" font-weight="600">零序列化快速通道</text>

  <!-- ================================================================ -->
  <!--  NODE: UPSTREAM  core/  (bottom-left)                            -->
  <!-- ================================================================ -->
  <rect x="25" y="365" width="275" height="185" rx="12" fill="url(#gUp)" stroke="#58a6ff" stroke-width="1.5"
        filter="drop-shadow(0 3px 10px rgba(88,166,255,0.12))"/>

  <text x="162" y="394" text-anchor="middle" font-size="17" fill="#58a6ff" font-weight="700">上游 · core/</text>
  <text x="162" y="412" text-anchor="middle" font-size="10.5" fill="var(--dim)">纯 Dart 服务层 · 提供原子能力</text>

  <line x1="48" y1="422" x2="277" y2="422" stroke="var(--dim)" stroke-width="0.5" opacity="0.3"/>

  <g font-size="11" fill="var(--text)">
    <text x="48" y="442">Agent 运行时</text>
    <text x="48" y="460">Tool 注册表</text>
    <text x="48" y="478">Config 引擎</text>
    <text x="165" y="442">Data 管线</text>
    <text x="165" y="460">Module 注册中心</text>
    <text x="165" y="478">Theme 引擎</text>
    <text x="165" y="496">OCR 等通用服务</text>
  </g>

  <text x="162" y="525" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-style="italic"
        opacity="0.85">✗ 不定义页面长什么样 · 不画像素</text>

  <!-- ================================================================ -->
  <!--  NODE: MIDSTREAM  plugins/  (top-center)                         -->
  <!-- ================================================================ -->
  <rect x="350" y="25" width="310" height="170" rx="12" fill="url(#gMid)" stroke="#d2a8ff" stroke-width="1.5"
        filter="drop-shadow(0 3px 10px rgba(210,168,255,0.12))"/>

  <text x="505" y="54" text-anchor="middle" font-size="17" fill="#d2a8ff" font-weight="700">中游 · plugins/</text>
  <text x="505" y="72" text-anchor="middle" font-size="10.5" fill="var(--dim)">插件 = JSON 声明 + .exe 进程</text>

  <line x1="375" y1="82" x2="635" y2="82" stroke="var(--dim)" stroke-width="0.5" opacity="0.3"/>

  <g font-size="11" fill="var(--text)">
    <text x="375" y="102">module/manifest.json</text>
    <text x="375" y="120">agent/manifest.json</text>
    <text x="375" y="138">data/manifest.json</text>
    <text x="530" y="102">config/config.json</text>
    <text x="530" y="120">theme/theme.json</text>
    <text x="530" y="138">.exe 业务进程</text>
  </g>

  <text x="505" y="172" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-style="italic"
        opacity="0.85">✗ 不写 Dart UI 代码 · 不直接操作渲染</text>

  <!-- ================================================================ -->
  <!--  NODE: DOWNSTREAM  renderer/  (bottom-right)                     -->
  <!-- ================================================================ -->
  <rect x="745" y="365" width="290" height="185" rx="12" fill="url(#gDown)" stroke="#7ee787" stroke-width="1.5"
        filter="drop-shadow(0 3px 10px rgba(126,231,135,0.12))"/>

  <text x="890" y="394" text-anchor="middle" font-size="17" fill="#7ee787" font-weight="700">下游 · renderer/</text>
  <text x="890" y="412" text-anchor="middle" font-size="10.5" fill="var(--dim)">纯渲染层 · 按声明画 UI</text>

  <line x1="768" y1="422" x2="1012" y2="422" stroke="var(--dim)" stroke-width="0.5" opacity="0.3"/>

  <g font-size="11" fill="var(--text)">
    <text x="768" y="442">ModuleDispatch 派发</text>
    <text x="768" y="460">CompositeView 调度</text>
    <text x="768" y="478">SlotDispatch 分派</text>
    <text x="768" y="496">LayoutEngine 布局</text>
    <text x="910" y="442">widgets/ 62 原子组件</text>
    <text x="910" y="460">shared/ 范式视图</text>
    <text x="910" y="478">html/ HTML 渲染</text>
  </g>

  <text x="890" y="525" text-anchor="middle" font-size="9.5" fill="var(--accent)" font-style="italic"
        opacity="0.85">✗ 不解析 manifest · 不写业务逻辑</text>

  <!-- ================================================================ -->
  <!--  MAIN.DART ASSEMBLER                                             -->
  <!-- ================================================================ -->
  <rect x="125" y="595" width="810" height="32" rx="16" fill="var(--surface)" stroke="#e3b341" stroke-width="1.2"/>
  <text x="530" y="616" text-anchor="middle" font-size="11" fill="var(--gold)" font-weight="600">
    main.dart : 启动 6 个 HTTP Server → 扫描插件目录 → 解析 manifest → 注册到 Registry → 启动 .exe 进程 → 注入 Riverpod → runApp
  </text>

  <!-- ================================================================ -->
  <!--  BOTTOM: dual render + fast channels                             -->
  <!-- ================================================================ -->
  <g transform="translate(125, 642)">
    <!-- Dart -->
    <rect x="0" y="0" width="250" height="48" rx="6" fill="var(--surface)" stroke="#7ee787" stroke-width="1" opacity="0.9"/>
    <text x="125" y="18" text-anchor="middle" font-size="11.5" fill="#7ee787" font-weight="700">🎯 Dart 渲染 (renderMode:"dart")</text>
    <text x="125" y="36" text-anchor="middle" font-size="9.5" fill="var(--dim)">Flutter Widget 树 · 主渲染路径 · 零序列化 import core/</text>

    <!-- HTML -->
    <rect x="265" y="0" width="250" height="48" rx="6" fill="var(--surface)" stroke="#f78166" stroke-width="1" opacity="0.8"/>
    <text x="390" y="18" text-anchor="middle" font-size="11.5" fill="#f78166" font-weight="700">🌐 HTML 渲染 (renderMode:"html")</text>
    <text x="390" y="36" text-anchor="middle" font-size="9.5" fill="var(--dim)">WebView 内嵌 · 受限预览 · 全HTML可选</text>

    <!-- Fast channels -->
    <rect x="530" y="0" width="280" height="48" rx="6" fill="var(--surface)" stroke="var(--dim)" stroke-width="1" opacity="0.75"/>
    <text x="670" y="18" text-anchor="middle" font-size="11.5" fill="#d2a8ff" font-weight="700">⚡ dart 路径 import 直调优势</text>
    <text x="670" y="36" text-anchor="middle" font-size="9.5" fill="var(--dim)">core/agent/ · core/config/ · core/data/ · core/module/</text>
  </g>

</svg>
</body>
</html>
